<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentence Workbench</title>
<style>
  :root{
    --bg:#faf8f4; --panel:#ffffff; --ink:#26241f; --muted:#7a766c; --line:#e3ded3;
    --accent:#2f5d8a; --flag:#fff0b3; --flag-line:#e0b92b; --done:#d8efd3; --done-line:#6aa95d;
    --fix:#c0392b; --ok:#2e7d32; --sel:#cfe3f7;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1b1a18; --panel:#242321; --ink:#e8e4da; --muted:#9a958a; --line:#3a3833;
      --accent:#7fb0e0; --flag:#4d4217; --flag-line:#b8962a; --done:#223a20; --done-line:#4f8a45;
      --fix:#ee7566; --ok:#74c378; --sel:#27425c;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
  header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:16px;margin:0 8px 0 0;font-weight:650}
  .spacer{flex:1}
  button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .seg{display:inline-flex}
  .seg button{border-radius:0;margin-left:-1px}
  .seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}
  .seg button:last-child{border-radius:0 6px 6px 0}
  .stats{color:var(--muted);font-size:13px}
  main{flex:1;display:flex;min-height:0}
  #left{flex:1.2;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
  #right{flex:1;display:flex;min-width:0;max-width:820px;background:var(--panel)}
  body.focus #left{display:none}
  body.focus #right{max-width:none}
  .hint{padding:8px 24px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line)}
  #editor,#review{flex:1;margin:0;border:0;outline:0;resize:none;padding:24px 32px;overflow:auto;
    font:19px/1.75 Georgia,'Times New Roman',serif;background:transparent;color:var(--ink);white-space:pre-wrap;word-wrap:break-word}
  #review{display:none;cursor:pointer}
  body.review #editor{display:none}
  body.review #review{display:block}
  .s{border-radius:3px;padding:1px 0}
  .s:hover{background:var(--sel)}
  .s.long{border-bottom:2px dotted var(--muted)}
  .s.flag{background:var(--flag);box-shadow:0 0 0 1px var(--flag-line)}
  .s.done{background:var(--done);box-shadow:0 0 0 1px var(--done-line)}
  .s.sel{outline:2px solid var(--accent);outline-offset:1px}
  /* queue */
  #queue{width:230px;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  #queue h2,#bench h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0;padding:12px 14px 6px}
  #qlist{overflow:auto;flex:1;padding:0 8px 8px}
  .q{display:block;width:100%;text-align:left;margin:0 0 6px;padding:8px 9px;font-size:13px;line-height:1.35}
  .q.sel{border-color:var(--accent);background:var(--sel)}
  .q .meta{display:flex;gap:8px;font-size:11.5px;color:var(--muted);margin-top:4px}
  .q.done{opacity:.6}
  .q .t{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .qfoot{padding:8px 12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
  /* bench */
  #bench{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  #benchscroll{overflow:auto;flex:1;padding:0 16px 16px}
  #empty{padding:30px 20px;color:var(--muted)}
  #draft{width:100%;min-height:96px;resize:vertical;padding:10px 12px;font:17px/1.6 Georgia,serif;
    border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
  details{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:var(--bg)}
  summary{cursor:pointer;padding:9px 12px;display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14px}
  summary .cc{font-weight:400;color:var(--muted);font-size:12.5px;white-space:nowrap}
  .cq{margin:0;padding:0 12px 6px;color:var(--muted);font-style:italic;font-size:13.5px}
  .crit{display:flex;gap:8px;align-items:flex-start;padding:6px 12px;border-top:1px solid var(--line)}
  .cid{font:600 11.5px ui-monospace,monospace;color:var(--muted);width:30px;padding-top:3px}
  .ctext{flex:1;font-size:14px}
  .cb{display:flex;gap:4px}
  .m{padding:1px 8px;font-weight:700;line-height:1.5}
  .m.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
  .m.fix.on{background:var(--fix);border-color:var(--fix);color:#fff}
  textarea.note{width:100%;min-height:60px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
  #toast.show{opacity:.95}
  @media (max-width:900px){
    main{flex-direction:column;overflow:auto}
    #left{border-right:0;border-bottom:1px solid var(--line);min-height:50vh}
    #right{max-width:none;min-height:60vh}
    #queue{width:170px}
  }
</style>
</head>
<body>
<header>
  <h1>Sentence Workbench</h1>
  <div class="seg">
    <button id="bWrite" class="on">Write</button>
    <button id="bReview">Review &amp; flag</button>
  </div>
  <button id="bFocus" title="Hide the text and work only on flagged sentences">Focus mode</button>
  <span class="stats" id="stats"></span>
  <span class="spacer"></span>
  <button id="bSample">Sample text</button>
  <button id="bExportMd">Export report</button>
  <button id="bSave">Save session</button>
  <button id="bLoad">Load session</button>
  <button id="bClear">Clear all</button>
  <input type="file" id="fileIn" accept=".json" hidden>
</header>

<main>
  <section id="left">
    <div class="hint" id="hint"></div>
    <textarea id="editor" spellcheck="true" placeholder="Paste or write your text here. Then switch to “Review &amp; flag” and click the sentences you want to work on."></textarea>
    <div id="review"></div>
  </section>

  <section id="right">
    <aside id="queue">
      <h2>Flagged sentences</h2>
      <div id="qlist"></div>
      <div class="qfoot"><label><input type="checkbox" id="showDone" checked> show resolved</label></div>
    </aside>
    <div id="bench">
      <h2>Workbench</h2>
      <div id="benchscroll"></div>
    </div>
  </section>
</main>
<div id="toast"></div>

<script>
/* ---------------- Checklist data ---------------- */
const CRITERIA = [
 {n:"1", title:"Authorial ownership", q:"Does this sentence represent something I understand, intend and can defend?", items:[
  ["AO1","I understand the claim being made in this sentence."],
  ["AO2","I could explain this sentence in my own words."],
  ["AO3","The sentence expresses my intended meaning."],
  ["AO4","I can distinguish my own interpretation from the ideas of others."],
  ["AO5","I could defend this claim if challenged."],
  ["AO6","I have not retained this sentence merely because it sounds academic."],
  ["AO7","The wording does not conceal uncertainty or gaps in my understanding."]]},
 {n:"2", title:"Argument and intellectual contribution", q:"Does this sentence contribute something meaningful to the argument?", items:[
  ["AR1","The sentence makes a discernible point or performs a clear function."],
  ["AR2","It advances, develops or qualifies the argument."],
  ["AR3","It contributes something beyond simply repeating an earlier point."],
  ["AR4","It makes a meaningful connection between ideas or evidence."],
  ["AR5","It distinguishes between description, interpretation and evaluation."],
  ["AR6","It expresses a sufficiently specific claim rather than a generic observation."],
  ["AR7","The strength of the claim is justified by the available evidence."],
  ["AR8","It introduces a meaningful implication, qualification or consequence where appropriate."]]},
 {n:"3", title:"Scholarship and evidential accountability", q:"Does this sentence engage responsibly with evidence and existing scholarship?", items:[
  ["SE1","Any factual or scholarly claim is appropriately supported."],
  ["SE2","The source is relevant to the particular claim being made."],
  ["SE3","The attribution makes clear whose idea or interpretation is being presented."],
  ["SE4","The sentence represents the source's position accurately."],
  ["SE5","Important qualifications or limitations have been preserved."],
  ["SE6","I have distinguished the source's explicit claims from my own inferences."],
  ["SE7","The sentence uses evidence to develop an argument rather than simply reporting information."],
  ["SE8","The citation is attached to the claim it actually supports."],
  ["SE9","The sentence does not imply greater scholarly agreement than the evidence warrants."]]},
 {n:"4", title:"Clarity and specificity", q:"Does this sentence communicate its meaning precisely?", items:[
  ["CS1","The central meaning is immediately understandable."],
  ["CS2","The subject of the sentence is identifiable."],
  ["CS3","The action or relationship being described is clear."],
  ["CS4","Abstract concepts are sufficiently explained or contextualised."],
  ["CS5","Important terms are used precisely and consistently."],
  ["CS6","The sentence avoids unnecessary generalisations."],
  ["CS7","The wording is specific enough to distinguish the claim from a generic academic observation."],
  ["CS8","Unnecessary ambiguity has been removed."],
  ["CS9","The sentence contains no more conceptual complexity than the idea requires."]]},
 {n:"5", title:"Natural academic prose", q:"Does this sentence sound like considered scholarly writing rather than formulaic academic language?", items:[
  ["NP1","The sentence uses vocabulary because it is precise, not simply because it sounds academic."],
  ["NP2","The sentence avoids unnecessary jargon or inflated language."],
  ["NP3","Abstract nouns are used purposefully rather than excessively."],
  ["NP4","Verbs communicate actions and relationships clearly."],
  ["NP5","The sentence avoids unnecessary introductory or transitional padding."],
  ["NP6","The sentence does not repeat information already communicated."],
  ["NP7","The grammatical structure is natural and readable."],
  ["NP8","The sentence is not unnecessarily elaborate."],
  ["NP9","The sentence maintains an appropriate academic register without becoming impersonal or artificial."]]},
 {n:"6", title:"Epistemic precision and critical judgement", q:"Does this sentence demonstrate appropriate intellectual confidence and critical awareness?", items:[
  ["EP1","The sentence expresses an appropriate degree of certainty."],
  ["EP2","Qualification is used where the evidence requires it."],
  ["EP3","The sentence avoids unnecessary hedging."],
  ["EP4","The sentence avoids overstating what the evidence establishes."],
  ["EP5","Judgements and interpretations are clearly distinguished from established facts."],
  ["EP6","Relevant tensions, disagreements or limitations are acknowledged where necessary."],
  ["EP7","The sentence does not artificially resolve a genuinely complex issue."],
  ["EP8","The sentence demonstrates independent evaluation where appropriate."]]},
 {n:"7", title:"Disciplinary and contextual specificity", q:"Does this sentence belong to the particular scholarly conversation in which I am participating?", items:[
  ["DC1","The terminology is appropriate to the discipline."],
  ["DC2","Disciplinary concepts are used accurately."],
  ["DC3","The sentence reflects relevant theoretical or methodological distinctions."],
  ["DC4","The claim is appropriately situated within its scholarly or historical context."],
  ["DC5","The sentence avoids substituting generic language for more precise disciplinary concepts."],
  ["DC6","The implications are relevant to the particular research question or field."],
  ["DC7","The sentence reflects an understanding of the wider scholarly conversation."]]},
 {n:"8", title:"Authorial voice and expression", q:"Does this sentence sound like something I would genuinely write and stand behind?", items:[
  ["AV1","The sentence sounds natural when read aloud."],
  ["AV2","The phrasing reflects my own established writing voice."],
  ["AV3","The sentence does not sound unnecessarily polished or symmetrical."],
  ["AV4","The wording reflects how I would naturally explain the idea to an informed reader."],
  ["AV5","The sentence communicates my thinking rather than merely imitating academic conventions."],
  ["AV6","The sentence retains my intended emphasis and intellectual personality."],
  ["AV7","I would be comfortable explaining this sentence to my supervisor without reading it."]]}
];

/* ---------------- State ---------------- */
const STORE = "sentence-workbench-v1";
const LONG_WORDS = 35;
let S = { text:"", flags:{}, sel:null, mode:"write", showDone:true, openCats:new Set(["1"]) };

const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const words = s => (s.trim().match(/\S+/g) || []).length;

function save(){
  try{ localStorage.setItem(STORE, JSON.stringify({text:S.text, flags:S.flags})); }catch(e){}
}
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(STORE) || "null");
    if(d){ S.text = d.text || ""; S.flags = d.flags || {}; }
  }catch(e){}
}
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ---------------- Sentence splitting ---------------- */
const ABBR = new Set(["e.g","i.e","et al","etc","vs","cf","fig","figs","dr","mr","mrs","ms","prof","no","nos","pp","p","vol","ch","ed","eds","st","approx","ca","inc","ltd","al","viz","ibid","op cit","trans","repr","rev"]);

function splitPara(p, offset, out){
  const re = /[.!?]+["'\u201d\u2019)\]]*(?=\s|$)/g;
  let start = 0, m;
  const push = (a,b) => {
    let s=a, e=b;
    while(s<e && /\s/.test(p[s])) s++;
    while(e>s && /\s/.test(p[e-1])) e--;
    if(e>s) out.push({start:offset+s, end:offset+e, text:p.slice(s,e)});
  };
  while((m = re.exec(p))){
    const end = m.index + m[0].length;
    if(end < p.length){
      const next = p.slice(end).trimStart()[0];
      if(next && /[a-z]/.test(next)) continue;               // lowercase follows: not a boundary
      if(m[0][0] === "."){
        const words_ = p.slice(start, m.index).trim().split(/\s+/);
        const w1 = (words_.pop() || "").toLowerCase().replace(/^[("'\u201c\[]+/,"");
        const w2 = (words_.pop() || "").toLowerCase();
        if(ABBR.has(w1) || ABBR.has(w2+" "+w1) || /^[a-z]$/.test(w1)) continue;
      }
    }
    push(start, end);
    start = end;
  }
  if(start < p.length) push(start, p.length);
}
function splitSentences(text){
  const out = []; let pos = 0;
  text.split("\n").forEach(p => { splitPara(p, pos, out); pos += p.length + 1; });
  return out;
}

/* ---------------- Rendering ---------------- */
function queueKeys(){
  const seen = new Set(), keys = [];
  splitSentences(S.text).forEach(s => {
    if(S.flags[s.text] && !seen.has(s.text)){ seen.add(s.text); keys.push(s.text); }
  });
  return keys;
}
function fixCount(f){ return Object.values(f.marks).filter(v => v==="fix").length; }
function doneCount(f){ return Object.keys(f.marks).length; }

function renderStats(){
  const sents = splitSentences(S.text);
  const keys = queueKeys();
  const open = keys.filter(k => S.flags[k].status !== "done").length;
  $("#stats").textContent = `${words(S.text)} words · ${sents.length} sentences · ${open} to work on · ${keys.length-open} resolved`;
}

function renderReview(){
  const sents = splitSentences(S.text);
  let html = "", cur = 0;
  sents.forEach((s,i) => {
    html += esc(S.text.slice(cur, s.start));
    const f = S.flags[s.text];
    const cls = ["s"];
    if(words(s.text) >= LONG_WORDS) cls.push("long");
    if(f) cls.push(f.status === "done" ? "done" : "flag");
    if(S.sel === s.text) cls.push("sel");
    html += `<span class="${cls.join(" ")}" data-i="${i}">${esc(s.text)}</span>`;
    cur = s.end;
  });
  html += esc(S.text.slice(cur));
  $("#review").innerHTML = html || '<span style="color:var(--muted)">Nothing to review yet — write or paste some text first.</span>';
}

function renderHint(){
  $("#hint").innerHTML = S.mode === "write"
    ? "Write or paste your text. Switch to <b>Review &amp; flag</b> to pick out sentences. Tip: edit flagged sentences in the workbench so their checklists follow them."
    : "Click a sentence to flag it and send it to the workbench. Dotted underline = long sentence (" + LONG_WORDS + "+ words). Yellow = to work on, green = resolved.";
}

function renderQueue(){
  const keys = queueKeys().filter(k => S.showDone || S.flags[k].status !== "done");
  $("#qlist").innerHTML = keys.length ? keys.map(k => {
    const f = S.flags[k];
    return `<button class="q ${S.sel===k?"sel":""} ${f.status==="done"?"done":""}" data-k="${esc(k)}">
      <div class="t">${esc(k)}</div>
      <div class="meta"><span>${f.status==="done"?"✓ resolved":"open"}</span><span>${fixCount(f)} to fix</span><span>${doneCount(f)}/${CRITERIA.reduce((a,c)=>a+c.items.length,0)} checked</span></div>
    </button>`;
  }).join("") : '<div style="padding:10px 6px;color:var(--muted);font-size:13px">No flagged sentences yet. Use “Review &amp; flag” and click a sentence.</div>';
}

function renderBench(){
  const box = $("#benchscroll");
  const f = S.sel && S.flags[S.sel];
  if(!f){
    box.innerHTML = '<div id="empty">Select a flagged sentence to work on it here.<br><br>Each sentence gets its own eight-part checklist, an editable copy, and a notes field.</div>';
    return;
  }
  box.innerHTML = `
    <div class="row"><b>Working copy</b><span class="stats" id="dwc"></span></div>
    <textarea id="draft" spellcheck="true"></textarea>
    <div class="row">
      <button class="primary" id="bApply">Apply edit to text</button>
      <button id="bResolve">${f.status==="done"?"Re-open":"Mark resolved"}</button>
      <button id="bUnflag">Unflag</button>
      <span class="spacer"></span>
      <button id="bPrev">← Prev</button><button id="bNext">Next →</button>
    </div>
    <div id="checklist"></div>
    <div class="row"><b>Notes for this sentence</b></div>
    <textarea class="note" id="note" placeholder="What needs doing? What would you ask your supervisor?"></textarea>`;
  $("#draft").value = S.sel;
  $("#note").value = f.note || "";
  $("#dwc").textContent = words(S.sel) + " words";
  renderChecklist();
}

function renderChecklist(){
  const f = S.sel && S.flags[S.sel]; if(!f) return;
  $("#checklist").innerHTML = CRITERIA.map(c => {
    const ok = c.items.filter(i => f.marks[i[0]]==="ok").length;
    const fix = c.items.filter(i => f.marks[i[0]]==="fix").length;
    return `<details data-cat="${c.n}" ${S.openCats.has(c.n)?"open":""}>
      <summary><span>${c.n}. ${c.title}</span><span class="cc">${ok} ✓ · ${fix} ✗ · ${c.items.length} total</span></summary>
      <p class="cq">${c.q}</p>
      ${c.items.map(([id,t]) => `<div class="crit"><span class="cid">${id}</span><span class="ctext">${esc(t)}</span>
        <span class="cb"><button class="m ok ${f.marks[id]==="ok"?"on":""}" data-id="${id}" data-v="ok" title="Meets this">✓</button><button class="m fix ${f.marks[id]==="fix"?"on":""}" data-id="${id}" data-v="fix" title="Needs work">✗</button></span></div>`).join("")}
    </details>`;
  }).join("");
}

function refresh(){ renderStats(); renderQueue(); if(S.mode==="review") renderReview(); }
function renderAll(){ renderHint(); refresh(); renderBench(); }

/* ---------------- Actions ---------------- */
function select(key, scroll){
  S.sel = key; renderBench(); refresh();
  if(scroll && S.mode==="review"){
    const el = document.querySelector("#review .s.sel"); if(el) el.scrollIntoView({block:"center", behavior:"smooth"});
  }
}
function setMode(m){
  S.mode = m;
  document.body.classList.toggle("review", m==="review");
  $("#bWrite").classList.toggle("on", m==="write");
  $("#bReview").classList.toggle("on", m==="review");
  if(m==="write") $("#editor").value = S.text;
  renderHint(); refresh();
}
function newFlag(){ return {status:"open", marks:{}, note:""}; }

function applyEdit(){
  const sents = splitSentences(S.text);
  const idx = sents.findIndex(s => s.text === S.sel);
  if(idx < 0){ toast("That sentence is no longer in the text."); return; }
  const nt = $("#draft").value.trim();
  if(nt === S.sel){ toast("No changes to apply."); return; }
  const s = sents[idx], old = S.flags[S.sel];
  S.text = S.text.slice(0, s.start) + nt + S.text.slice(s.end);
  delete S.flags[S.sel];
  if(nt){
    const ns = splitSentences(nt);
    ns.forEach(x => { S.flags[x.text] = (ns.length===1 && old) ? {...old, marks:{...old.marks}} : newFlag(); });
    S.sel = ns[0] ? ns[0].text : null;
  } else S.sel = null;
  $("#editor").value = S.text;
  save(); renderBench(); refresh(); toast("Edit applied to your text.");
}

function step(dir){
  const keys = queueKeys().filter(k => S.showDone || S.flags[k].status !== "done");
  if(!keys.length) return;
  let i = keys.indexOf(S.sel);
  i = i < 0 ? 0 : (i + dir + keys.length) % keys.length;
  select(keys[i], true);
}
function nextOpen(){
  const keys = queueKeys().filter(k => S.flags[k].status !== "done");
  if(!keys.length){ S.sel = null; renderBench(); refresh(); toast("All flagged sentences resolved."); return; }
  select(keys[0], true);
}

function download(name, content, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([content], {type}));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 500);
}

function buildReport(){
  const lines = ["# Sentence review report", ""];
  const all = {}; CRITERIA.forEach(c => c.items.forEach(([id,t]) => all[id] = t));
  const keys = queueKeys();
  if(!keys.length) return lines.concat("_No flagged sentences._").join("\n");
  keys.forEach((k,i) => {
    const f = S.flags[k];
    lines.push(`## ${i+1}. ${f.status==="done" ? "[resolved]" : "[open]"}`, "", `> ${k}`, "");
    const fixes = Object.entries(f.marks).filter(([,v]) => v==="fix").map(([id]) => id);
    if(fixes.length){ lines.push("**Needs work:**"); fixes.forEach(id => lines.push(`- ${id}: ${all[id]}`)); lines.push(""); }
    if(f.note) lines.push("**Notes:** " + f.note, "");
  });
  return lines.join("\n");
}

/* ---------------- Events ---------------- */
$("#editor").addEventListener("input", e => { S.text = e.target.value; save(); renderStats(); renderQueue(); });
$("#bWrite").onclick = () => setMode("write");
$("#bReview").onclick = () => setMode("review");
$("#bFocus").onclick = () => { document.body.classList.toggle("focus"); $("#bFocus").classList.toggle("on"); };
$("#showDone").onchange = e => { S.showDone = e.target.checked; renderQueue(); };

$("#review").addEventListener("click", e => {
  const el = e.target.closest(".s"); if(!el) return;
  const s = splitSentences(S.text)[+el.dataset.i]; if(!s) return;
  if(!S.flags[s.text]) S.flags[s.text] = newFlag();
  save(); select(s.text, false);
});
$("#qlist").addEventListener("click", e => {
  const b = e.target.closest(".q"); if(b) select(b.dataset.k, true);
});

$("#benchscroll").addEventListener("click", e => {
  const f = S.sel && S.flags[S.sel]; if(!f) return;
  const m = e.target.closest(".m");
  if(m){
    const id = m.dataset.id, v = m.dataset.v;
    if(f.marks[id] === v) delete f.marks[id]; else f.marks[id] = v;
    save(); renderChecklist(); renderQueue(); return;
  }
  const id = e.target.id;
  if(id === "bApply") applyEdit();
  else if(id === "bResolve"){ f.status = f.status==="done" ? "open" : "done"; save(); if(f.status==="done") nextOpen(); else { renderBench(); refresh(); } }
  else if(id === "bUnflag"){ delete S.flags[S.sel]; S.sel = null; save(); renderBench(); refresh(); }
  else if(id === "bPrev") step(-1);
  else if(id === "bNext") step(1);
});
$("#benchscroll").addEventListener("input", e => {
  const f = S.sel && S.flags[S.sel]; if(!f) return;
  if(e.target.id === "note"){ f.note = e.target.value; save(); }
  if(e.target.id === "draft"){ $("#dwc").textContent = words(e.target.value) + " words"; }
});
$("#benchscroll").addEventListener("toggle", e => {
  const d = e.target; if(!d.dataset || !d.dataset.cat) return;
  d.open ? S.openCats.add(d.dataset.cat) : S.openCats.delete(d.dataset.cat);
}, true);

$("#bSample").onclick = () => {
  if(S.text.trim() && !confirm("Replace your current text with the sample?")) return;
  S.text = "It is important to note that the concept of memory has been widely discussed in the literature. Halbwachs (1992) argued that memory is socially framed, although later scholars have questioned how far this claim can be pushed. In this sense, it could be said that remembering is, to a certain extent, a fundamentally collective practice. This chapter argues that commemorative rituals do not simply preserve the past but actively reshape it for present needs.\n\nThe archive, therefore, plays a pivotal role in the broader landscape of knowledge production.";
  S.flags = {}; S.sel = null; save(); $("#editor").value = S.text; renderAll();
};
$("#bExportMd").onclick = () => download("sentence-report.md", buildReport(), "text/markdown");
$("#bSave").onclick = () => download("sentence-session.json", JSON.stringify({text:S.text, flags:S.flags}, null, 2), "application/json");
$("#bLoad").onclick = () => $("#fileIn").click();
$("#fileIn").onchange = e => {
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      S.text = d.text || ""; S.flags = d.flags || {}; S.sel = null;
      save(); $("#editor").value = S.text; renderAll(); toast("Session loaded.");
    }catch(err){ toast("Couldn't read that file."); }
  };
  r.readAsText(file); e.target.value = "";
};
$("#bClear").onclick = () => {
  if(!confirm("Clear the text and all flags? Save the session first if you want to keep it.")) return;
  S.text = ""; S.flags = {}; S.sel = null; save(); $("#editor").value = ""; renderAll();
};

/* ---------------- Init ---------------- */
load();
$("#editor").value = S.text;
renderAll();
</script>
</body>
</html>
