<script>
/* ---------------- 8-Part Academic Checklist Criteria Data ---------------- */
const CRITERIA = [
  {
    n: "1", 
    title: "Authorial ownership", 
    q: "Does this sentence represent something I understand, intend and can defend?", 
    items: [
      ["AO1","I understand the claim being made in this sentence."],
      ["AO2","I could explain this sentence in my own words."],
      ["AO3","The sentence expresses my intended meaning."],
      ["AO4","I can distinguish my own interpretation from the ideas of others."],
      ["AO5","I could defend this claim if challenged."],
      ["AO6","I have not retained this sentence merely because it sounds academic."],
      ["AO7","The wording does not conceal uncertainty or gaps in my understanding."]
    ]
  },
  {
    n: "2", 
    title: "Argument & intellectual contribution", 
    q: "Does this sentence contribute something meaningful to the argument?", 
    items: [
      ["AR1","The sentence makes a discernible point or performs a clear function."],
      ["AR2","It advances, develops or qualifies the argument."],
      ["AR3","It contributes something beyond simply repeating an earlier point."],
      ["AR4","It makes a meaningful connection between ideas or evidence."],
      ["AR5","It distinguishes between description, interpretation and evaluation."],
      ["AR6","It expresses a sufficiently specific claim rather than a generic observation."],
      ["AR7","The strength of the claim is justified by the available evidence."],
      ["AR8","It introduces a meaningful implication, qualification or consequence where appropriate."]
    ]
  },
  {
    n: "3", 
    title: "Scholarship & evidential accountability", 
    q: "Does this sentence engage responsibly with evidence and existing scholarship?", 
    items: [
      ["SE1","Any factual or scholarly claim is appropriately supported."],
      ["SE2","The source is relevant to the particular claim being made."],
      ["SE3","The attribution makes clear whose idea or interpretation is being presented."],
      ["SE4","The sentence represents the source's position accurately."],
      ["SE5","Important qualifications or limitations have been preserved."],
      ["SE6","I have distinguished the source's explicit claims from my own inferences."],
      ["SE7","The sentence uses evidence to develop an argument rather than simply reporting information."],
      ["SE8","The citation is attached to the claim it actually supports."],
      ["SE9","The sentence does not imply greater scholarly agreement than the evidence warrants."]
    ]
  },
  {
    n: "4", 
    title: "Clarity & specificity", 
    q: "Does this sentence communicate its meaning precisely?", 
    items: [
      ["CS1","The central meaning is immediately understandable."],
      ["CS2","The subject of the sentence is identifiable."],
      ["CS3","The action or relationship being described is clear."],
      ["CS4","Abstract concepts are sufficiently explained or contextualised."],
      ["CS5","Important terms are used precisely and consistently."],
      ["CS6","The sentence avoids unnecessary generalisations."],
      ["CS7","The wording is specific enough to distinguish the claim from a generic academic observation."],
      ["CS8","Unnecessary ambiguity has been removed."],
      ["CS9","The sentence contains no more conceptual complexity than the idea requires."]
    ]
  },
  {
    n: "5", 
    title: "Natural academic prose", 
    q: "Does this sentence sound like considered scholarly writing rather than formulaic academic language?", 
    items: [
      ["NP1","The sentence uses vocabulary because it is precise, not simply because it sounds academic."],
      ["NP2","The sentence avoids unnecessary jargon or inflated language."],
      ["NP3","Abstract nouns are used purposefully rather than excessively."],
      ["NP4","Verbs communicate actions and relationships clearly."],
      ["NP5","The sentence avoids unnecessary introductory or transitional padding."],
      ["NP6","The sentence does not repeat information already communicated."],
      ["NP7","The grammatical structure is natural and readable."],
      ["NP8","The sentence is not unnecessarily elaborate."],
      ["NP9","The sentence maintains an appropriate academic register without becoming impersonal or artificial."]
    ]
  },
  {
    n: "6", 
    title: "Epistemic precision & critical judgement", 
    q: "Does this sentence demonstrate appropriate intellectual confidence and critical awareness?", 
    items: [
      ["EP1","The sentence expresses an appropriate degree of certainty."],
      ["EP2","Qualification is used where the evidence requires it."],
      ["EP3","The sentence avoids unnecessary hedging."],
      ["EP4","The sentence avoids overstating what the evidence establishes."],
      ["EP5","Judgements and interpretations are clearly distinguished from established facts."],
      ["EP6","Relevant tensions, disagreements or limitations are acknowledged where necessary."],
      ["EP7","The sentence does not artificially resolve a genuinely complex issue."],
      ["EP8","The sentence demonstrates independent evaluation where appropriate."]
    ]
  },
  {
    n: "7", 
    title: "Disciplinary & contextual specificity", 
    q: "Does this sentence belong to the particular scholarly conversation in which I am participating?", 
    items: [
      ["DC1","The terminology is appropriate to the discipline."],
      ["DC2","Disciplinary concepts are used accurately."],
      ["DC3","The sentence reflects relevant theoretical or methodological distinctions."],
      ["DC4","The claim is appropriately situated within its scholarly or historical context."],
      ["DC5","The sentence avoids substituting generic language for more precise disciplinary concepts."],
      ["DC6","The implications are relevant to the particular research question or field."],
      ["DC7","The sentence reflects an understanding of the wider scholarly conversation."]
    ]
  },
  {
    n: "8", 
    title: "Authorial voice & expression", 
    q: "Does this sentence sound like something I would genuinely write and stand behind?", 
    items: [
      ["AV1","The sentence sounds natural when read aloud."],
      ["AV2","The phrasing reflects my own established writing voice."],
      ["AV3","The sentence does not sound unnecessarily polished or symmetrical."],
      ["AV4","The wording reflects how I would naturally explain the idea to an informed reader."],
      ["AV5","The sentence communicates my thinking rather than merely imitating academic conventions."],
      ["AV6","The sentence retains my intended emphasis and intellectual personality."],
      ["AV7","I would be comfortable explaining this sentence to my supervisor without reading it."]
    ]
  }
];

/* ---------------- Application State ---------------- */
const STORE_KEY = "sentence-workbench-v2";
const LONG_WORD_COUNT = 35;
const AUTO_PASS_THRESHOLD = 4; // Requirement: auto-check/mark criterion if 4 subcriteria are checked

let AppState = {
  text: "",
  flags: {},       // Keyed by exact sentence text -> { status: "open"|"done", marks: { [itemId]: "ok"|"fix" }, note: "" }
  selected: null,  // Current sentence key being edited
  mode: "write",   // "write" | "review"
  showResolved: true,
  openCategories: new Set(["1"])
};

/* Helper Functions */
const $ = selector => document.querySelector(selector);
const esc = str => (str || '').replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const countWords = str => (str.trim().match(/\S+/g) || []).length;

function saveToStorage() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      text: AppState.text,
      flags: AppState.flags
    }));
  } catch(e){}
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) {
      const data = JSON.parse(raw);
      AppState.text = data.text || "";
      AppState.flags = data.flags || {};
    }
  } catch(e){}
}

function showToast(message) {
  const toast = $("#toast");
  $("#toastMsg").textContent = message;
  toast.classList.remove("translate-y-10", "opacity-0", "pointer-events-none");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => {
    toast.classList.add("translate-y-10", "opacity-0", "pointer-events-none");
  }, 2400);
}

/* Sentence Boundary Detection with Abbreviation Recognition */
const COMMON_ABBRS = new Set(["e.g","i.e","et al","etc","vs","cf","fig","figs","dr","mr","mrs","ms","prof","no","nos","pp","p","vol","ch","ed","eds","st","approx","ca","inc","ltd","al","viz","ibid","op cit","trans","repr","rev"]);

function splitParagraph(paragraphText, baseOffset, outArray) {
  const sentenceRegex = /[.!?]+["'\u201d\u2019)\]]*(?=\s|$)/g;
  let start = 0, match;
  
  const pushSentence = (sIdx, eIdx) => {
    let s = sIdx, e = eIdx;
    while(s < e && /\s/.test(paragraphText[s])) s++;
    while(e > s && /\s/.test(paragraphText[e-1])) e--;
    if(e > s) {
      outArray.push({
        start: baseOffset + s,
        end: baseOffset + e,
        text: paragraphText.slice(s, e)
      });
    }
  };

  while((match = sentenceRegex.exec(paragraphText))) {
    const end = match.index + match[0].length;
    if(end < paragraphText.length) {
      const nextChar = paragraphText.slice(end).trimStart()[0];
      if(nextChar && /[a-z]/.test(nextChar)) continue; // Lowercase following punct -> not end
      if(match[0][0] === ".") {
        const words = paragraphText.slice(start, match.index).trim().split(/\s+/);
        const w1 = (words.pop() || "").toLowerCase().replace(/^[("'\u201c\[]+/,"");
        const w2 = (words.pop() || "").toLowerCase();
        if(COMMON_ABBRS.has(w1) || COMMON_ABBRS.has(w2 + " " + w1) || /^[a-z]$/.test(w1)) continue;
      }
    }
    pushSentence(start, end);
    start = end;
  }
  if(start < paragraphText.length) pushSentence(start, paragraphText.length);
}

function parseSentences(fullText) {
  const result = [];
  let pos = 0;
  fullText.split("\n").forEach(p => {
    splitParagraph(p, pos, result);
    pos += p.length + 1;
  });
  return result;
}

function createNewFlag() {
  return { status: "open", marks: {}, note: "" };
}

/* Requirement 2: Ensure all sentences are selected/flagged by default */
function autoFlagAllSentences(forceReset = false) {
  const sentences = parseSentences(AppState.text);
  let newlyFlagged = 0;
  sentences.forEach(s => {
    if(!AppState.flags[s.text] || forceReset) {
      AppState.flags[s.text] = AppState.flags[s.text] || createNewFlag();
      newlyFlagged++;
    }
  });

  // If active selection is invalid, pick the first sentence
  const flaggedKeys = getOrderedFlaggedKeys();
  if(flaggedKeys.length > 0 && (!AppState.selected || !AppState.flags[AppState.selected])) {
    AppState.selected = flaggedKeys[0];
  }
  return newlyFlagged;
}

function getOrderedFlaggedKeys() {
  const seen = new Set(), keys = [];
  parseSentences(AppState.text).forEach(s => {
    if(AppState.flags[s.text] && !seen.has(s.text)) {
      seen.add(s.text);
      keys.push(s.text);
    }
  });
  return keys;
}

/* UI Rendering Core */
function renderStats() {
  const sentences = parseSentences(AppState.text);
  const totalWords = countWords(AppState.text);
  const keys = getOrderedFlaggedKeys();
  const openCount = keys.filter(k => AppState.flags[k].status !== "done").length;
  const resolvedCount = keys.length - openCount;

  $("#statsBar").innerHTML = `
    <span><b>${totalWords}</b> words</span> • 
    <span><b>${sentences.length}</b> sentences</span> • 
    <span class="text-amber-600 dark:text-amber-400 font-medium"><b>${openCount}</b> open</span> • 
    <span class="text-emerald-600 dark:text-emerald-400 font-medium"><b>${resolvedCount}</b> resolved</span>
  `;
}

function renderReviewCanvas() {
  const sentences = parseSentences(AppState.text);
  let html = "", currentIdx = 0;

  sentences.forEach((s, i) => {
    html += esc(AppState.text.slice(currentIdx, s.start));
    const flag = AppState.flags[s.text];
    const isLong = countWords(s.text) >= LONG_WORD_COUNT;
    
    let classes = ["s-node"];
    if(isLong) classes.push("long-sent");
    if(flag) {
      classes.push(flag.status === "done" ? "done" : "flagged");
    }
    if(AppState.selected === s.text) classes.push("selected");

    html += `<span class="${classes.join(" ")}" data-idx="${i}" title="${isLong ? 'Long sentence ('+countWords(s.text)+' words)' : ''}">${esc(s.text)}</span>`;
    currentIdx = s.end;
  });

  html += esc(AppState.text.slice(currentIdx));
  $("#reviewCanvas").innerHTML = html || `<div class="text-zinc-400 text-sm italic">No text provided. Enter your essay in "Write &amp; Edit" mode.</div>`;
}

function renderQueue() {
  const keys = getOrderedFlaggedKeys().filter(k => AppState.showResolved || AppState.flags[k].status !== "done");
  const container = $("#queueList");
  $("#queueBadge").textContent = keys.length;

  if(!keys.length) {
    container.innerHTML = `<div class="p-4 text-center text-xs text-zinc-400">No sentences flagged. Click "Flag All" or switch to Review mode to select sentences.</div>`;
    return;
  }

  container.innerHTML = keys.map(k => {
    const f = AppState.flags[k];
    const isSelected = AppState.selected === k;
    const isDone = f.status === "done";
    const fixesCount = Object.values(f.marks).filter(v => v === "fix").length;
    const okCount = Object.values(f.marks).filter(v => v === "ok").length;

    return `
      <button class="queue-item w-full text-left p-2.5 rounded-lg border text-xs transition-all ${
        isSelected 
          ? 'bg-brand-50 border-brand-300 dark:bg-brand-950/60 dark:border-brand-700 ring-1 ring-brand-400' 
          : 'bg-white dark:bg-zinc-800/80 border-zinc-200 dark:border-zinc-700/70 hover:border-zinc-300 dark:hover:border-zinc-600'
      } ${isDone ? 'opacity-60' : ''}" data-key="${esc(k)}">
        <div class="font-serif text-zinc-800 dark:text-zinc-200 line-clamp-2 leading-snug mb-1.5">${esc(k)}</div>
        <div class="flex items-center justify-between text-[10px] text-zinc-500 dark:text-zinc-400 font-sans">
          <span class="inline-flex items-center gap-1 font-medium ${isDone ? 'text-emerald-600 dark:text-emerald-400' : 'text-amber-600 dark:text-amber-400'}">
            ${isDone ? '✓ Resolved' : '● Open'}
          </span>
          <div class="flex items-center gap-1">
            ${fixesCount > 0 ? `<span class="px-1 bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300 rounded">${fixesCount} ✗</span>` : ''}
            <span class="px-1 bg-zinc-100 text-zinc-600 dark:bg-zinc-700 dark:text-zinc-300 rounded">${okCount} ✓</span>
          </div>
        </div>
      </button>
    `;
  }).join("");
}

function renderWorkbench() {
  const box = $("#workbenchContent");
  const activeKey = AppState.selected;
  const flag = activeKey && AppState.flags[activeKey];

  if(!activeKey || !flag) {
    box.innerHTML = `
      <div class="h-full flex flex-col items-center justify-center text-center p-8 text-zinc-400 space-y-3">
        <svg class="w-12 h-12 stroke-current opacity-40" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        <p class="text-sm font-medium text-zinc-600 dark:text-zinc-300">No sentence selected</p>
        <p class="text-xs max-w-xs">Select a flagged sentence from the queue or click any sentence in "Review &amp; Flag" mode to inspect it.</p>
      </div>
    `;
    return;
  }

  box.innerHTML = `
    <!-- Working draft sentence -->
    <div class="space-y-2">
      <div class="flex items-center justify-between text-xs font-semibold text-zinc-700 dark:text-zinc-300">
        <span>Working Copy</span>
        <span class="text-zinc-400 font-mono font-normal">${countWords(activeKey)} words</span>
      </div>
      <textarea id="draftInput" spellcheck="true" class="w-full p-3 font-serif text-base border border-zinc-300 dark:border-zinc-700 rounded-lg bg-zinc-50 dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 focus:bg-white dark:focus:bg-zinc-900 focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none transition">${esc(activeKey)}</textarea>
      
      <!-- Action Toolbar -->
      <div class="flex flex-wrap items-center gap-2 pt-1">
        <button id="btnApplyEdit" class="px-3 py-1.5 text-xs font-semibold rounded-md bg-brand-600 hover:bg-brand-700 text-white shadow-sm transition">
          Apply Edit to Essay
        </button>
        <button id="btnToggleResolve" class="px-3 py-1.5 text-xs font-medium rounded-md border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">
          ${flag.status === "done" ? "Re-open Sentence" : "Mark Resolved ✓"}
        </button>
        <button id="btnUnflagSingle" class="px-3 py-1.5 text-xs font-medium rounded-md text-red-600 hover:bg-red-50 dark:hover:bg-red-950/40 transition">
          Unflag
        </button>
      </div>
    </div>

    <!-- 8 Criteria Accordions -->
    <div class="space-y-3 pt-2">
      <div class="flex items-center justify-between">
        <h3 class="text-xs font-bold uppercase tracking-wider text-zinc-500 dark:text-zinc-400">Diagnostic Criteria Suite</h3>
        <span class="text-[11px] text-zinc-400">≥ 4 checks auto-marks criterion</span>
      </div>
      <div id="criteriaSuite" class="space-y-2.5"></div>
    </div>

    <!-- Sentence Notes -->
    <div class="space-y-2 pt-2 border-t border-zinc-200 dark:border-zinc-800">
      <label for="sentenceNote" class="block text-xs font-semibold text-zinc-700 dark:text-zinc-300">Notes &amp; Supervisor Query</label>
      <textarea id="sentenceNote" placeholder="Record ideas, doubts, or queries for your advisor regarding this sentence..." class="w-full p-2.5 text-xs border border-zinc-200 dark:border-zinc-700 rounded-lg bg-zinc-50 dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 focus:ring-2 focus:ring-brand-500 outline-none h-20 resize-y">${esc(flag.note || '')}</textarea>
    </div>
  `;

  renderCriteriaList();
}

function renderCriteriaList() {
  const flag = AppState.selected && AppState.flags[AppState.selected];
  if(!flag) return;

  const container = $("#criteriaSuite");
  if(!container) return;

  container.innerHTML = CRITERIA.map(cat => {
    const totalItems = cat.items.length;
    const okCount = cat.items.filter(([id]) => flag.marks[id] === "ok").length;
    const fixCount = cat.items.filter(([id]) => flag.marks[id] === "fix").length;
    const isOpen = AppState.openCategories.has(cat.n);
    
    // Requirement 3: Auto-check rule: ≥ 4 subcriteria marked 'ok' automatically passes criterion
    const isAutoPassed = okCount >= AUTO_PASS_THRESHOLD;

    return `
      <details class="group rounded-lg border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-800/60 overflow-hidden shadow-sm transition" data-cat="${cat.n}" ${isOpen ? 'open' : ''}>
        
        <!-- Accordion Summary Bar -->
        <summary class="flex items-center justify-between p-3 cursor-pointer select-none bg-zinc-50/80 dark:bg-zinc-800 hover:bg-zinc-100 dark:hover:bg-zinc-750 transition border-b border-transparent group-open:border-zinc-200 dark:group-open:border-zinc-700">
          <div class="flex items-center gap-2.5 min-w-0 pr-2">
            <span class="w-5 h-5 rounded-full bg-zinc-200 dark:bg-zinc-700 text-zinc-700 dark:text-zinc-300 text-[11px] font-bold flex items-center justify-center shrink-0">
              ${cat.n}
            </span>
            <span class="font-medium text-xs sm:text-sm text-zinc-900 dark:text-zinc-100 truncate">${cat.title}</span>
            
            ${isAutoPassed ? `
              <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-800">
                ✓ Criterion Met
              </span>
            ` : ''}
          </div>

          <div class="flex items-center gap-2 shrink-0">
            <!-- Progress Pill -->
            <div class="text-[11px] text-zinc-500 dark:text-zinc-400 font-mono bg-white dark:bg-zinc-900 px-2 py-0.5 rounded border border-zinc-200 dark:border-zinc-700">
              <span class="text-emerald-600 dark:text-emerald-400 font-semibold">${okCount}</span>/<span class="text-red-500">${fixCount}</span> of ${totalItems}
            </div>

            <!-- Requirement 3: Criterion Level Batch Controls -->
            <div class="flex items-center gap-1" onclick="event.stopPropagation()">
              <button title="Mark all subcriteria in this category as met" class="btn-batch-cat px-2 py-0.5 text-[10px] font-semibold rounded bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-300 dark:bg-emerald-950 dark:hover:bg-emerald-900 dark:text-emerald-300 dark:border-emerald-800" data-cat="${cat.n}" data-action="ok">
                Mark All ✓
              </button>
              <button title="Clear all marks for this criterion" class="btn-batch-cat px-1.5 py-0.5 text-[10px] font-medium rounded bg-zinc-100 hover:bg-zinc-200 text-zinc-600 dark:bg-zinc-700 dark:text-zinc-300" data-cat="${cat.n}" data-action="clear">
                Clear
              </button>
            </div>
          </div>
        </summary>

        <!-- Progress Bar Indicator -->
        <div class="w-full bg-zinc-100 dark:bg-zinc-700 h-1">
          <div class="bg-emerald-500 h-1 transition-all duration-300" style="width: ${Math.min(100, Math.round((okCount/totalItems)*100))}%"></div>
        </div>

        <!-- Question Prompt -->
        <div class="p-3 bg-zinc-50/40 dark:bg-zinc-900/40 border-b border-zinc-100 dark:border-zinc-800/60 text-xs italic text-zinc-600 dark:text-zinc-400">
          "${cat.q}"
        </div>

        <!-- Subcriteria Items List -->
        <div class="divide-y divide-zinc-100 dark:divide-zinc-800">
          ${cat.items.map(([id, label]) => {
            const val = flag.marks[id];
            return `
              <div class="p-2.5 sm:px-3 flex items-start justify-between gap-3 text-xs hover:bg-zinc-50/80 dark:hover:bg-zinc-800/40 transition">
                <div class="flex items-start gap-2 pt-0.5 min-w-0">
                  <span class="font-mono text-[10px] font-semibold text-zinc-400 shrink-0 w-7">${id}</span>
                  <span class="text-zinc-700 dark:text-zinc-300 leading-snug">${esc(label)}</span>
                </div>

                <div class="flex items-center gap-1 shrink-0">
                  <button class="btn-mark-item w-7 h-6 rounded text-xs font-bold transition ${
                    val === 'ok' 
                      ? 'bg-emerald-600 text-white shadow-sm' 
                      : 'bg-zinc-100 hover:bg-emerald-100 text-zinc-600 dark:bg-zinc-700 dark:hover:bg-zinc-600 dark:text-zinc-300'
                  }" data-id="${id}" data-val="ok" title="Pass / Meets criterion">✓</button>

                  <button class="btn-mark-item w-7 h-6 rounded text-xs font-bold transition ${
                    val === 'fix' 
                      ? 'bg-red-600 text-white shadow-sm' 
                      : 'bg-zinc-100 hover:bg-red-100 text-zinc-600 dark:bg-zinc-700 dark:hover:bg-zinc-600 dark:text-zinc-300'
                  }" data-id="${id}" data-val="fix" title="Needs work / Attention required">✗</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>

      </details>
    `;
  }).join('');
}

function refreshAll() {
  renderStats();
  renderQueue();
  if(AppState.mode === "review") renderReviewCanvas();
  renderWorkbench();
}

/* User Actions & Logic handlers */
function setMode(mode) {
  AppState.mode = mode;
  const isWrite = mode === "write";

  $("#btnModeWrite").className = isWrite
    ? "px-3 py-1 text-xs font-semibold rounded-md transition-all shadow-sm bg-white dark:bg-zinc-700 text-zinc-900 dark:text-white"
    : "px-3 py-1 text-xs font-medium text-zinc-600 dark:text-zinc-300 hover:text-zinc-900 dark:hover:text-white rounded-md transition-all";

  $("#btnModeReview").className = !isWrite
    ? "px-3 py-1 text-xs font-semibold rounded-md transition-all shadow-sm bg-white dark:bg-zinc-700 text-zinc-900 dark:text-white"
    : "px-3 py-1 text-xs font-medium text-zinc-600 dark:text-zinc-300 hover:text-zinc-900 dark:hover:text-white rounded-md transition-all";

  if(isWrite) {
    $("#textEditor").classList.remove("hidden");
    $("#reviewCanvas").classList.add("hidden");
    $("#hintText").textContent = "Type or paste your essay below. Every sentence is automatically flagged for systematic analysis.";
    $("#textEditor").value = AppState.text;
  } else {
    $("#textEditor").classList.add("hidden");
    $("#reviewCanvas").classList.remove("hidden");
    $("#hintText").textContent = "Click any sentence to select and flag it. Dotted underline indicates long sentences (35+ words).";
    renderReviewCanvas();
  }
}

function applyEditToText() {
  const draft = $("#draftInput").value.trim();
  const sentences = parseSentences(AppState.text);
  const idx = sentences.findIndex(s => s.text === AppState.selected);

  if(idx < 0) {
    showToast("Selected sentence not found in main text.");
    return;
  }

  if(draft === AppState.selected) {
    showToast("No changes detected.");
    return;
  }

  const origSentence = sentences[idx];
  const oldFlagData = AppState.flags[AppState.selected];

  // Substitute sentence in primary text
  AppState.text = AppState.text.slice(0, origSentence.start) + draft + AppState.text.slice(origSentence.end);
  delete AppState.flags[AppState.selected];

  if(draft) {
    const newParsed = parseSentences(draft);
    newParsed.forEach(s => {
      AppState.flags[s.text] = (newParsed.length === 1 && oldFlagData) ? { ...oldFlagData, marks: { ...oldFlagData.marks } } : createNewFlag();
    });
    AppState.selected = newParsed[0] ? newParsed[0].text : null;
  } else {
    AppState.selected = null;
  }

  saveToStorage();
  $("#textEditor").value = AppState.text;
  refreshAll();
  showToast("Edit applied successfully to essay text.");
}

function stepQueue(direction) {
  const keys = getOrderedFlaggedKeys().filter(k => AppState.showResolved || AppState.flags[k].status !== "done");
  if(!keys.length) return;
  let idx = keys.indexOf(AppState.selected);
  idx = idx < 0 ? 0 : (idx + direction + keys.length) % keys.length;
  AppState.selected = keys[idx];
  refreshAll();
}

function exportMarkdownReport() {
  const lines = ["# Sentence Workbench - Essay Quality Report", "", `_Generated on ${new Date().toLocaleDateString()}_`, ""];
  const allSubcriteria = {};
  CRITERIA.forEach(c => c.items.forEach(([id, t]) => allSubcriteria[id] = t));

  const keys = getOrderedFlaggedKeys();
  if(!keys.length) {
    lines.push("_No sentences currently flagged._");
  } else {
    keys.forEach((k, idx) => {
      const f = AppState.flags[k];
      lines.push(`## ${idx + 1}. [${f.status === "done" ? "RESOLVED" : "OPEN"}]`);
      lines.push(`> ${k}`, "");

      const fixes = Object.entries(f.marks).filter(([, v]) => v === "fix").map(([id]) => id);
      const passed = Object.entries(f.marks).filter(([, v]) => v === "ok").map(([id]) => id);

      if(fixes.length) {
        lines.push("**Needs Attention:**");
        fixes.forEach(id => lines.push(`- **${id}**: ${allSubcriteria[id]}`));
        lines.push("");
      }

      if(passed.length) {
        lines.push(`**Passed (${passed.length} criteria met)**`);
        lines.push("");
      }

      if(f.note) {
        lines.push(`**Notes:** ${f.note}`, "");
      }
      lines.push("---", "");
    });
  }

  const blob = new Blob([lines.join("\n")], { type: "text/markdown" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "Sentence-Workbench-Report.md";
  a.click();
  URL.revokeObjectURL(url);
  showToast("Report exported as Markdown file.");
}

/* Attach Event Listeners */
document.addEventListener("DOMContentLoaded", () => {
  loadFromStorage();

  // Mode switching
  $("#btnModeWrite").addEventListener("click", () => setMode("write"));
  $("#btnModeReview").addEventListener("click", () => setMode("review"));

  // Text editor input handler
  $("#textEditor").addEventListener("input", (e) => {
    AppState.text = e.target.value;
    autoFlagAllSentences(false);
    saveToStorage();
    renderStats();
    renderQueue();
  });

  // Toggle Focus Mode
  $("#btnFocusMode").addEventListener("click", () => {
    $("#leftPanel").classList.toggle("hidden");
    $("#btnFocusMode").classList.toggle("bg-brand-50");
  });

  // Flag all / Unflag all controls
  $("#btnFlagAll").addEventListener("click", () => {
    const count = autoFlagAllSentences(true);
    saveToStorage();
    refreshAll();
    showToast(`Flagged all sentences in essay.`);
  });

  $("#btnUnflagAll").addEventListener("click", () => {
    AppState.flags = {};
    AppState.selected = null;
    saveToStorage();
    refreshAll();
    showToast("Cleared all sentence flags.");
  });

  // Queue filter
  $("#chkShowResolved").addEventListener("change", (e) => {
    AppState.showResolved = e.target.checked;
    renderQueue();
  });

  // Review mode canvas sentence click
  $("#reviewCanvas").addEventListener("click", (e) => {
    const node = e.target.closest(".s-node");
    if(!node) return;
    const idx = parseInt(node.dataset.idx, 10);
    const parsed = parseSentences(AppState.text);
    const sentence = parsed[idx];
    if(!sentence) return;

    if(!AppState.flags[sentence.text]) {
      AppState.flags[sentence.text] = createNewFlag();
    }
    AppState.selected = sentence.text;
    saveToStorage();
    refreshAll();
  });

  // Queue item click
  $("#queueList").addEventListener("click", (e) => {
    const item = e.target.closest(".queue-item");
    if(item) {
      AppState.selected = item.dataset.key;
      refreshAll();
    }
  });

  // Workbench delegator
  $("#workbenchContent").addEventListener("click", (e) => {
    const flag = AppState.selected && AppState.flags[AppState.selected];
    if(!flag) return;

    // Apply edit
    if(e.target.id === "btnApplyEdit") {
      applyEditToText();
      return;
    }

    // Toggle resolve status
    if(e.target.id === "btnToggleResolve") {
      flag.status = flag.status === "done" ? "open" : "done";
      saveToStorage();
      refreshAll();
      showToast(flag.status === "done" ? "Sentence marked as resolved." : "Sentence re-opened.");
      return;
    }

    // Unflag single sentence
    if(e.target.id === "btnUnflagSingle") {
      delete AppState.flags[AppState.selected];
      AppState.selected = getOrderedFlaggedKeys()[0] || null;
      saveToStorage();
      refreshAll();
      showToast("Unflagged sentence.");
      return;
    }

    // Subcriteria button click (✓ or ✗)
    const btnMark = e.target.closest(".btn-mark-item");
    if(btnMark) {
      const id = btnMark.dataset.id;
      const val = btnMark.dataset.val;
      if(flag.marks[id] === val) {
        delete flag.marks[id];
      } else {
        flag.marks[id] = val;
      }
      saveToStorage();
      renderQueue();
      renderWorkbench();
      return;
    }

    // Criterion Batch action button ("Mark All ✓" or "Clear")
    const btnBatch = e.target.closest(".btn-batch-cat");
    if(btnBatch) {
      const catNum = btnBatch.dataset.cat;
      const action = btnBatch.dataset.action;
      const category = CRITERIA.find(c => c.n === catNum);
      if(category) {
        category.items.forEach(([id]) => {
          if(action === "ok") {
            flag.marks[id] = "ok";
          } else if(action === "clear") {
            delete flag.marks[id];
          }
        });
        saveToStorage();
        renderQueue();
        renderWorkbench();
      }
      return;
    }
  });

  // Notes & Draft input change listeners
  $("#workbenchContent").addEventListener("input", (e) => {
    const flag = AppState.selected && AppState.flags[AppState.selected];
    if(!flag) return;

    if(e.target.id === "sentenceNote") {
      flag.note = e.target.value;
      saveToStorage();
    }
  });

  // Accordion state tracker
  $("#workbenchContent").addEventListener("toggle", (e) => {
    const details = e.target.closest("details");
    if(!details || !details.dataset.cat) return;
    if(details.open) {
      AppState.openCategories.add(details.dataset.cat);
    } else {
      AppState.openCategories.delete(details.dataset.cat);
    }
  }, true);

  // Queue navigation
  $("#btnPrev").addEventListener("click", () => stepQueue(-1));
  $("#btnNext").addEventListener("click", () => stepQueue(1));

  // Toolbar Actions
  $("#btnSample").addEventListener("click", () => {
    AppState.text = "It is important to note that the concept of memory has been widely discussed in the literature. Halbwachs (1992) argued that memory is socially framed, although later scholars have questioned how far this claim can be pushed. In this sense, it could be said that remembering is, to a certain extent, a fundamentally collective practice. This chapter argues that commemorative rituals do not simply preserve the past but actively reshape it for present needs.\n\nThe archive, therefore, plays a pivotal role in the broader landscape of knowledge production.";
    AppState.flags = {};
    autoFlagAllSentences(true);
    saveToStorage();
    $("#textEditor").value = AppState.text;
    refreshAll();
    showToast("Sample essay loaded with all sentences flagged.");
  });

  $("#btnExportMd").addEventListener("click", exportMarkdownReport);

  $("#btnSaveSession").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify({ text: AppState.text, flags: AppState.flags }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "sentence-workbench-session.json";
    a.click();
    URL.revokeObjectURL(url);
    showToast("Session saved to file.");
  });

  $("#btnLoadSession").addEventListener("click", () => $("#fileInput").click());

  $("#fileInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const data = JSON.parse(evt.target.result);
        AppState.text = data.text || "";
        AppState.flags = data.flags || {};
        autoFlagAllSentences(false);
        saveToStorage();
        $("#textEditor").value = AppState.text;
        refreshAll();
        showToast("Session loaded successfully.");
      } catch(err) {
        showToast("Error loading JSON session file.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  });

  $("#btnClear").addEventListener("click", () => {
    if(confirm("Are you sure you want to clear all essay text and sentence flags?")) {
      AppState.text = "";
      AppState.flags = {};
      AppState.selected = null;
      saveToStorage();
      $("#textEditor").value = "";
      refreshAll();
      showToast("Cleared all text and session data.");
    }
  });

  // Initial Load setup
  if(!AppState.text) {
    // Load default sample if first launch
    AppState.text = "It is important to note that the concept of memory has been widely discussed in the literature. Halbwachs (1992) argued that memory is socially framed, although later scholars have questioned how far this claim can be pushed. In this sense, it could be said that remembering is, to a certain extent, a fundamentally collective practice. This chapter argues that commemorative rituals do not simply preserve the past but actively reshape it for present needs.\n\nThe archive, therefore, plays a pivotal role in the broader landscape of knowledge production.";
  }

  $("#textEditor").value = AppState.text;
  autoFlagAllSentences(false);
  refreshAll();
});
</script>
</body>
</html>
