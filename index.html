<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POM | Strategic Focus</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.92);
            --accent: #2c3e50;
            --warmup: #e3f2fd; --study: #ffffff; --wrapup: #fff3e0; --break: #f1f8e9;
            --alert-red: #e74c3c;
        }
        
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
        }

        #app { max-width: 600px; width: 95%; margin: 2rem 0; padding: 2rem; background: var(--glass); backdrop-filter: blur(15px); border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); box-sizing: border-box; }
        .hidden { display: none; }
        
        /* Typography & Inputs */
        h1, h2 { color: var(--accent); text-align: center; margin-top: 0; }
        input, select, textarea, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 12px; font-size: 1rem; box-sizing: border-box; }
        .primary-btn { background: var(--accent); color: white; border: none; font-weight: bold; cursor: pointer; }
        
        /* Timeline Table */
        .timeline-table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 0.85rem; }
        .timeline-table th, .timeline-table td { padding: 8px; border-bottom: 1px solid #eee; text-align: left; }

        /* The Big Red Button */
        .activate-btn { 
            background: var(--alert-red); color: white; font-size: 1.8rem; padding: 30px; 
            border: 5px solid white; border-radius: 20px; font-weight: 900; cursor: pointer;
            animation: pulse 1.5s infinite; margin-top: 20px;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(231, 76, 60, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }

        #rush-btn { position: fixed; bottom: 20px; right: 20px; width: auto; background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 5px 10px; font-size: 0.7rem; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>

<div id="app">
    <h1>POM</h1>
    
    <div id="setup-area">
        <label><b>Goal:</b></label>
        <input type="text" id="goal-input" placeholder="Main objective...">
        <label><b>Steps (One per line):</b></label>
        <textarea id="steps-input" rows="3" placeholder="Step 1...&#10;Step 2..."></textarea>
        <label><b>Cycles:</b></label>
        <input type="number" id="cycle-count" min="1" max="5" value="3">
        <label><b>Optional YouTube Soundscape (URL):</b></label>
        <input type="text" id="yt-url" placeholder="https://www.youtube.com/watch?v=...">
        <button class="primary-btn" onclick="goToTimeline()">Plan Timeline &rarr;</button>
    </div>

    <div id="timeline-area" class="hidden">
        <h2>Strategic Review</h2>
        <p style="font-size: 0.8rem; text-align:center;">Front-load your choices. Assign steps to cycles and set your break style.</p>
        <div id="timeline-list"></div>
        <button class="primary-btn" onclick="startLiveSession()">Initialise System</button>
    </div>

    <div id="timer-area" class="hidden">
        <div id="status-msg" style="text-align:center; font-weight:bold; text-transform:uppercase; letter-spacing:1px;"></div>
        <div id="cycle-info" style="text-align:center; font-size:0.8rem; margin-bottom:10px;"></div>
        <div id="time-left" style="font-size: 5rem; font-weight: 800; text-align: center; margin: 10px 0;">00:00</div>
        
        <div id="yt-container" class="hidden"></div> <div id="break-display" class="hidden" style="text-align:center;">
            <div id="break-icon-live" style="font-size:4rem;"></div>
            <p id="break-desc-live"></p>
        </div>

        <div id="activation-zone" class="hidden">
            <button class="activate-btn" onclick="handleActivation()">BACK TO WORK</button>
        </div>

        <input type="text" id="distraction-input" placeholder="Release thought..." onkeydown="if(event.key==='Enter') saveDistraction()">
    </div>

    <div id="summary-area" class="hidden">
        <h2>Session Summary</h2>
        <div id="final-stats"></div>
        <button class="primary-btn" onclick="exportCSV()">Export Data</button>
        <button style="background:none; border:none; color:#666; cursor:pointer;" onclick="location.reload()">Reset</button>
    </div>
</div>

<button id="rush-btn" onclick="rush()">Rush ⏩</button>

<script>
    let state = {
        goal: '', steps: [], cycles: 1, currentCycle: 1, phase: 'warmup',
        timeLeft: 0, timerId: null, startTime: null,
        plan: [], distractions: [], driftMinutes: 0
    };

    let audioCtx;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

    function playSound(type) {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        if(type === 'gong') {
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3);
            osc.start(); osc.stop(audioCtx.currentTime + 3);
        } else if(type === 'whistle') {
            osc.frequency.setValueAtTime(900, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);
            osc.start(); osc.stop(audioCtx.currentTime + 0.6);
        }
    }

    function goToTimeline() {
        state.goal = document.getElementById('goal-input').value;
        state.steps = document.getElementById('steps-input').value.split('\n').filter(s => s.trim() !== '');
        state.cycles = parseInt(document.getElementById('cycle-count').value);
        
        let html = `<table class="timeline-table"><tr><th>Phase</th><th>Start Time</th><th>Step Assignment</th></tr>`;
        let now = new Date();
        
        for(let i = 1; i <= state.cycles; i++) {
            let timeStr = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            html += `<tr><td>Cycle ${i}</td><td>${timeStr}</td>
                     <td><select id="step-map-${i}"><option value="General">General Focus</option>
                     ${state.steps.map(s => `<option value="${s}">${s}</option>`).join('')}</select></td></tr>`;
            html += `<tr><td>Break ${i}</td><td>-</td>
                     <td><select id="break-map-${i}">
                        <option value="🚶">Moving</option><option value="🍎">Food</option>
                        <option value="🏋️">Exercise</option><option value="💬">Social</option>
                     </select></td></tr>`;
            now.setMinutes(now.getMinutes() + 30); // Approx block
        }
        html += `</table>`;
        document.getElementById('timeline-list').innerHTML = html;
        document.getElementById('setup-area').classList.add('hidden');
        document.getElementById('timeline-area').classList.remove('hidden');
    }

    function startLiveSession() {
        state.startTime = new Date();
        // Capture choices
        for(let i = 1; i <= state.cycles; i++) {
            state.plan.push({
                step: document.getElementById(`step-map-${i}`).value,
                breakIcon: document.getElementById(`break-map-${i}`).value
            });
        }
        document.getElementById('timeline-area').classList.add('hidden');
        document.getElementById('timer-area').classList.remove('hidden');
        runPhase('warmup');
    }

    function runPhase(phase) {
        state.phase = phase;
        document.getElementById('activation-zone').classList.add('hidden');
        document.getElementById('break-display').classList.add('hidden');

        if(phase === 'warmup') { state.timeLeft = 60; playSound('gong'); }
        else if(phase === 'study') { state.timeLeft = 23 * 60; playSound('whistle'); }
        else if(phase === 'wrapup') { state.timeLeft = 60; }
        else if(phase === 'break') { 
            state.timeLeft = 5 * 60; 
            playSound('whistle');
            const currentPlan = state.plan[state.currentCycle - 1];
            document.getElementById('break-display').classList.remove('hidden');
            document.getElementById('break-icon-live').innerText = currentPlan.breakIcon;
        }

        document.getElementById('status-msg').innerText = phase;
        document.getElementById('cycle-info').innerText = `Cycle ${state.currentCycle} of ${state.cycles} | Current Task: ${state.plan[state.currentCycle-1].step}`;
        
        if(state.timerId) clearInterval(state.timerId);
        state.timerId = setInterval(tick, 1000);
        updateDisplay();
    }

    function tick() {
        state.timeLeft--;
        if(state.timeLeft <= 0) {
            clearInterval(state.timerId);
            if(state.phase === 'break') {
                document.getElementById('activation-zone').classList.remove('hidden');
                state.breakEndTime = new Date();
            } else {
                autoAdvance();
            }
        }
        updateDisplay();
    }

    function autoAdvance() {
        if(state.phase === 'warmup') runPhase('study');
        else if(state.phase === 'study') runPhase('wrapup');
        else if(state.phase === 'wrapup') runPhase('break');
    }

    function handleActivation() {
        let drift = Math.floor((new Date() - state.breakEndTime) / 60000);
        state.driftMinutes += Math.max(0, drift);
        if(state.currentCycle < state.cycles) {
            state.currentCycle++;
            runPhase('warmup');
        } else {
            showSummary();
        }
    }

    function rush() { state.timeLeft = 2; }
    function updateDisplay() {
        const mins = Math.floor(state.timeLeft / 60);
        const secs = state.timeLeft % 60;
        document.getElementById('time-left').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function saveDistraction() {
        const input = document.getElementById('distraction-input');
        if(!input.value) return;
        state.distractions.push(input.value);
        input.value = '';
    }

    function showSummary() {
        document.getElementById('timer-area').classList.add('hidden');
        document.getElementById('summary-area').classList.remove('hidden');
        document.getElementById('final-stats').innerHTML = `
            <p><b>Goal:</b> ${state.goal}</p>
            <p><b>Schedule Drift:</b> ${state.driftMinutes} minutes total late return.</p>
            <p><b>Thoughts Captured:</b> ${state.distractions.length}</p>
        `;
    }

    function exportCSV() {
        let csv = "data:text/csv;charset=utf-8,Goal,Cycles,Drift(min)\n";
        csv += `${state.goal},${state.currentCycle},${state.driftMinutes}\n\nDistractions\n`;
        state.distractions.forEach(d => { csv += `"${d}"\n`; });
        const encodedUri = encodeURI(csv);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "pom_summary.csv");
        document.body.appendChild(link);
        link.click();
    }
</script>
</body>
</html>
