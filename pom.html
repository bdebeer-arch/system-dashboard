<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POM | Study Systems</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.85);
            --accent: #2c3e50;
            --warmup: rgba(227, 242, 253, 0.7);
            --study: rgba(255, 255, 255, 0.7);
            --wrapup: rgba(255, 243, 224, 0.7);
            --break: rgba(241, 248, 233, 0.7);
        }
        
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Inspiring Nature Wallpaper */
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), 
                        url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background 1s ease;
        }

        nav { width: 100%; padding: 15px 25px; box-sizing: border-box; }
        .nav-link { 
            color: white; text-decoration: none; font-weight: 600; 
            background: rgba(0,0,0,0.4); padding: 8px 15px; border-radius: 20px;
            backdrop-filter: blur(5px); transition: 0.3s;
        }
        .nav-link:hover { background: rgba(0,0,0,0.6); }

        #app { 
            max-width: 550px; width: 90%; margin: 2rem 0; padding: 2.5rem; 
            background: var(--glass); backdrop-filter: blur(15px);
            border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .timer-display { font-size: 5rem; font-weight: 800; text-align: center; margin: 1rem 0; color: var(--accent); letter-spacing: -2px; }
        .status-bar { padding: 12px; border-radius: 12px; text-align: center; margin-bottom: 1.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        input, select, textarea, button { 
            width: 100%; padding: 14px; margin: 10px 0; border: 1px solid rgba(0,0,0,0.1); 
            border-radius: 12px; font-size: 1rem; background: rgba(255,255,255,0.9);
        }

        button.primary-btn { 
            background: var(--accent); color: white; border: none; font-weight: bold; 
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: 0.2s;
        }
        button.primary-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }

        #rush-btn {
            position: fixed; bottom: 20px; right: 20px; width: auto;
            background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(5px); padding: 8px 15px; font-size: 0.7rem; text-transform: uppercase;
        }

        .distraction-log { background: rgba(255,255,255,0.5); padding: 15px; border-radius: 12px; margin-top: 20px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<nav>
    <a href="https://bdebeer-arch.github.io/system-dashboard/" class="nav-link">← Dashboard</a>
</nav>

<div id="app">
    <h1 style="text-align:center; margin-top:0; color: var(--accent);">POM</h1>
    
    <div id="setup-area">
        <label><b>Cycles</b> (Max 5)</label>
        <input type="number" id="cycle-count" min="1" max="5" value="1">
        <label><b>Goal:</b> What do you want?</label>
        <input type="text" id="goal-input" placeholder="e.g. Master Calculus integration">
        <label><b>Steps:</b> How will you get there?</label>
        <textarea id="steps-input" rows="3" placeholder="Step 1... Step 2..."></textarea>
        <button class="primary-btn" onclick="initSession()">Start Session</button>
    </div>

    <div id="timer-area" class="hidden">
        <div id="header-display" style="border-bottom: 1px solid rgba(0,0,0,0.1); margin-bottom: 1rem; padding-bottom: 1rem;"></div>
        <div id="status-msg" class="status-bar">Focus</div>
        <div class="timer-display" id="time-left">00:00</div>
        
        <div id="break-controls" class="hidden">
            <select id="break-type" onchange="updateBreakIcon()">
                <option value="🚶">Moving (Movement)</option>
                <option value="🍎">Food (Refuel)</option>
                <option value="🏋️">Exercise (Exercise)</option>
                <option value="💬">Talking (Social)</option>
                <option value="🧹">Broom (Tidy)</option>
            </select>
            <div id="break-icon" style="font-size: 4rem; text-align: center; margin: 15px;">🚶</div>
        </div>

        <button id="next-btn" class="primary-btn hidden" onclick="advanceStep()">Next Stage →</button>

        <div class="distraction-log">
            <input type="text" id="distraction-input" placeholder="Release a distracting thought..." onkeydown="if(event.key==='Enter') saveDistraction()">
            <ul id="distraction-list" style="font-size: 0.85rem; padding-left: 20px;"></ul>
        </div>
    </div>

    <div id="summary-area" class="hidden">
        <h2>Session Summary</h2>
        <div id="final-stats"></div>
        <button class="primary-btn" onclick="location.reload()">New Session</button>
    </div>
</div>

<button id="rush-btn" onclick="rush()">Rush ⏩</button>

<script>
    let state = {
        cycles: 1, currentCycle: 1, phase: 'warmup', 
        timeLeft: 0, goal: '', steps: '', distractions: [], timerId: null
    };

    let audioCtx;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playSound(type) {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        
        if(type === 'gong') {
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3);
            osc.start(); osc.stop(audioCtx.currentTime + 3);
        } else {
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }
    }

    function initSession() {
        initAudio();
        state.goal = document.getElementById('goal-input').value || "Deep Study";
        state.steps = document.getElementById('steps-input').value;
        state.cycles = parseInt(document.getElementById('cycle-count').value);
        
        document.getElementById('setup-area').classList.add('hidden');
        document.getElementById('timer-area').classList.remove('hidden');
        document.getElementById('header-display').innerHTML = `<b>Target:</b> ${state.goal}`;
        
        runPhase('warmup');
    }

    function runPhase(phase) {
        state.phase = phase;
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('break-controls').classList.add('hidden');
        const app = document.getElementById('app');

        if(phase === 'warmup') {
            state.timeLeft = 60;
            app.style.background = 'var(--warmup)';
            document.getElementById('status-msg').innerText = "Warm Up";
            playSound('gong');
        } else if(phase === 'study') {
            state.timeLeft = 23 * 60;
            app.style.background = 'var(--study)';
            document.getElementById('status-msg').innerText = "Study Focus";
        } else if(phase === 'wrapup') {
            state.timeLeft = 60;
            app.style.background = 'var(--wrapup)';
            document.getElementById('status-msg').innerText = "The Comma (Wrap Up)";
        } else if(phase === 'break') {
            state.timeLeft = 5 * 60;
            app.style.background = 'var(--break)';
            document.getElementById('status-msg').innerText = "Active Break";
            document.getElementById('break-controls').classList.remove('hidden');
            playSound('gong');
        }

        if(state.timerId) clearInterval(state.timerId);
        state.timerId = setInterval(tick, 1000);
        updateDisplay();
    }

    function tick() {
        state.timeLeft--;
        if(state.timeLeft <= 0) {
            clearInterval(state.timerId);
            if(state.phase === 'break') {
                document.getElementById('next-btn').classList.remove('hidden');
                playSound('beep');
            } else {
                autoAdvance();
            }
        }
        updateDisplay();
    }

    function autoAdvance() {
        if(state.phase === 'warmup') runPhase('study');
        else if(state.phase === 'study') runPhase('wrapup');
        else if(state.phase === 'wrapup') runPhase('break');
    }

    function advanceStep() {
        if(state.currentCycle < state.cycles) {
            state.currentCycle++;
            runPhase('warmup');
        } else {
            showSummary();
        }
    }

    function rush() {
        state.timeLeft = 2;
    }

    function updateDisplay() {
        const mins = Math.floor(state.timeLeft / 60);
        const secs = state.timeLeft % 60;
        document.getElementById('time-left').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function updateBreakIcon() {
        document.getElementById('break-icon').innerText = document.getElementById('break-type').value;
    }

    function saveDistraction() {
        const input = document.getElementById('distraction-input');
        if(!input.value) return;
        state.distractions.push(input.value);
        const li = document.createElement('li');
        li.innerText = input.value;
        document.getElementById('distraction-list').prepend(li);
        input.value = '';
    }

    function showSummary() {
        document.getElementById('timer-area').classList.add('hidden');
        document.getElementById('summary-area').classList.remove('hidden');
        document.getElementById('final-stats').innerHTML = `<p>Completed ${state.currentCycle} cycles for: <b>${state.goal}</b></p>`;
    }
</script>
</body>
</html>
