<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POM | Study Systems</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.95);
            --accent: #2c3e50;
            --warmup: #e3f2fd; --study: #ffffff; --wrapup: #fff3e0; --break: #f1f8e9;
            --alert-red: #e74c3c; --note-yellow: #fff382;
        }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
            display: flex; justify-content: center;
        }
        #main-container { display: flex; width: 95%; max-width: 1000px; gap: 20px; margin: 2rem 0; align-items: flex-start; }
        #app { flex: 1; padding: 2rem; background: var(--glass); backdrop-filter: blur(15px); border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        #sidebar { width: 250px; display: flex; flex-direction: column; gap: 10px; }
        .post-it { background: var(--note-yellow); padding: 15px; box-shadow: 3px 3px 10px rgba(0,0,0,0.2); border-radius: 2px; transform: rotate(-2deg); font-family: 'Comic Sans MS', cursive, sans-serif; font-size: 0.85rem; color: #333; }
        .post-it:nth-child(even) { transform: rotate(3deg); }
        .hidden { display: none; }
        input, select, textarea, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 12px; font-size: 1rem; box-sizing: border-box; }
        .primary-btn { background: var(--accent); color: white; border: none; font-weight: bold; cursor: pointer; }
        .activate-btn { background: var(--alert-red); color: white; font-size: 1.8rem; padding: 30px; border: 5px solid white; border-radius: 20px; font-weight: 900; cursor: pointer; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #rush-btn { position: fixed; bottom: 20px; right: 20px; background: none; border: none; font-size: 1.5rem; cursor: pointer; opacity: 0.3; }
    </style>
</head>
<body>

<div id="main-container">
    <div id="app">
        <h1 style="text-align:center; margin-top:0;">POM</h1>
        
        <div id="setup-area">
            <input type="text" id="goal-input" placeholder="Main Goal...">
            <textarea id="steps-input" rows="3" placeholder="Steps (one per line)..."></textarea>
            <input type="number" id="cycle-count" min="1" max="5" value="3">
            <button class="primary-btn" onclick="goToTimeline()">Plan Timeline &rarr;</button>
        </div>

        <div id="timeline-area" class="hidden">
            <div id="timeline-list"></div>
            <button class="primary-btn" onclick="startLiveSession()">Initialise System</button>
        </div>

        <div id="timer-area" class="hidden">
            <div id="status-msg" style="text-align:center; font-weight:bold; text-transform:uppercase; padding:5px; border-radius:8px;"></div>
            <div id="time-left" style="font-size: 6rem; font-weight: 800; text-align: center;">00:00</div>
            
            <div id="energy-input-zone" class="hidden" style="background:#eee; padding:10px; border-radius:12px; text-align:center;">
                <label>Update Energy (1-10):</label>
                <input type="range" id="energy-live" min="1" max="10" value="5" onchange="updateCurrentEnergy(this.value)">
            </div>

            <div id="activation-zone" class="hidden" style="text-align:center;">
                <button class="activate-btn" onclick="handleActivation()">BACK TO WORK</button>
            </div>
            
            <div id="break-display" class="hidden" style="text-align:center; font-size:4rem;"></div>
            <input type="text" id="distraction-input" placeholder="Release thought to sidebar..." onkeydown="if(event.key==='Enter') saveDistraction()">
        </div>

        <div id="summary-area" class="hidden">
            <div id="final-stats"></div>
            <button class="primary-btn" onclick="exportCSV()">Export CSV Summary</button>
            <button style="background:none; border:none; color:#999; cursor:pointer;" onclick="location.reload()">Reset Session</button>
        </div>
    </div>

    <div id="sidebar">
        <h3 style="color:white; text-align:center; margin-top:0;">Released Thoughts</h3>
    </div>
</div>

<button id="rush-btn" onclick="rush()">⏩</button>

<script>
    let state = {
        goal: '', cycles: 1, currentCycle: 1, phase: 'idle', timeLeft: 0,
        plan: [], distractions: [], energyHistory: [], driftHistory: [], timerId: null
    };

    let audioCtx;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

    function playSound(type) {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'whistle') {
            osc.frequency.setValueAtTime(900, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        } else if (type === 'gong') {
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2);
            osc.start(); osc.stop(audioCtx.currentTime + 2);
        }
    }

    function goToTimeline() {
        state.goal = document.getElementById('goal-input').value || "Study";
        let steps = document.getElementById('steps-input').value.split('\n').filter(s => s.trim() !== '');
        state.cycles = parseInt(document.getElementById('cycle-count').value);
        let html = `<table style="width:100%; border-collapse:collapse;">`;
        for(let i=1; i<=state.cycles; i++) {
            html += `<tr style="border-bottom:1px solid #ddd"><td>C${i}</td><td><select id="step-${i}">${steps.map(s=>`<option>${s}</option>`).join('')}<option>Review</option></select></td><td><select id="break-${i}"><option value="🚶">Moving</option><option value="🍎">Food</option><option value="🏋️">Exercise</option><option value="🧹">Broom</option></select></td></tr>`;
        }
        document.getElementById('timeline-list').innerHTML = html + `</table>`;
        document.getElementById('setup-area').classList.add('hidden');
        document.getElementById('timeline-area').classList.remove('hidden');
    }

    function startLiveSession() {
        for(let i=1; i<=state.cycles; i++) {
            state.plan.push({ step: document.getElementById(`step-${i}`).value, icon: document.getElementById(`break-${i}`).value });
            state.energyHistory[i-1] = 5; // Default
        }
        document.getElementById('timeline-area').classList.add('hidden');
        document.getElementById('timer-area').classList.remove('hidden');
        runPhase('warmup');
    }

    function runPhase(phase) {
        state.phase = phase;
        document.getElementById('activation-zone').classList.add('hidden');
        document.getElementById('break-display').classList.add('hidden');
        document.getElementById('energy-input-zone').classList.add('hidden');
        
        const app = document.getElementById('app');
        if (phase === 'warmup') { 
            state.timeLeft = 60; app.style.backgroundColor = 'var(--warmup)'; 
            playSound('gong'); 
            document.getElementById('energy-input-zone').classList.remove('hidden');
        }
        else if (phase === 'study') { state.timeLeft = 23 * 60; app.style.backgroundColor = 'var(--study)'; }
        else if (phase === 'wrapup') { state.timeLeft = 60; app.style.backgroundColor = 'var(--wrapup)'; }
        else if (phase === 'break') { 
            state.timeLeft = 5 * 60; app.style.backgroundColor = 'var(--break)';
            document.getElementById('break-display').innerText = state.plan[state.currentCycle-1].icon;
            document.getElementById('break-display').classList.remove('hidden');
            playSound('whistle');
        }

        document.getElementById('status-msg').innerText = `${phase} | ${state.plan[state.currentCycle-1].step}`;
        if(state.timerId) clearInterval(state.timerId);
        state.timerId = setInterval(tick, 1000);
    }

    function tick() {
        state.timeLeft--;
        if (state.timeLeft <= 0) {
            clearInterval(state.timerId);
            if (state.phase === 'warmup') { playSound('whistle'); runPhase('study'); }
            else if (state.phase === 'study') { runPhase('wrapup'); }
            else if (state.phase === 'wrapup') { playSound('whistle'); runPhase('break'); }
            else if (state.phase === 'break') { 
                document.getElementById('activation-zone').classList.remove('hidden'); 
                state.breakEnd = new Date(); 
            }
        }
        updateDisplay();
    }

    function updateCurrentEnergy(val) { state.energyHistory[state.currentCycle-1] = val; }

    function handleActivation() {
        let drift = Math.floor((new Date() - state.breakEnd) / 60000);
        state.driftHistory.push(drift);
        if (state.currentCycle < state.cycles) { state.currentCycle++; runPhase('warmup'); }
        else showSummary();
    }

    function updateDisplay() {
        const m = Math.floor(state.timeLeft / 60);
        const s = state.timeLeft % 60;
        document.getElementById('time-left').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function saveDistraction() {
        const el = document.getElementById('distraction-input');
        if(!el.value) return;
        state.distractions.push(el.value);
        const note = document.createElement('div');
        note.className = 'post-it';
        note.innerText = el.value;
        document.getElementById('sidebar').prepend(note);
        el.value = '';
    }

    function showSummary() {
        document.getElementById('timer-area').classList.add('hidden');
        document.getElementById('summary-area').classList.remove('hidden');
        let html = `<h3>System Reflection</h3><table style="width:100%; border-collapse:collapse;"><tr><th>Cycle</th><th>Step</th><th>Energy</th><th>Drift</th></tr>`;
        state.plan.forEach((p, i) => {
            html += `<tr style="border-bottom:1px solid #eee"><td>${i+1}</td><td>${p.step}</td><td>${state.energyHistory[i]}/10</td><td>${state.driftHistory[i] || 0}m</td></tr>`;
        });
        document.getElementById('final-stats').innerHTML = html + `</table>`;
    }

    function exportCSV() {
        let csv = "Cycle,Step,Energy,Drift\n";
        state.plan.forEach((p, i) => { csv += `${i+1},${p.step},${state.energyHistory[i]},${state.driftHistory[i]}\n`; });
        const link = document.createElement("a");
        link.href = encodeURI("data:text/csv;charset=utf-8," + csv);
        link.download = "pom_reflective_summary.csv";
        link.click();
    }

    function rush() { state.timeLeft = 1; }
</script>
</body>
</html>
