<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POM | Integrated Systems</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.96);
            --accent: #2c3e50;
            --warmup: #e3f2fd; --study: #ffffff; --wrapup: #fff3e0; --break: #f1f8e9;
            --alert-red: #e74c3c; --note-yellow: #fff382;
        }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
            display: flex; justify-content: center;
        }
        #main-container { display: flex; width: 95%; max-width: 1150px; gap: 20px; margin: 2rem 0; align-items: flex-start; }
        #app { flex: 1; padding: 2rem; background: var(--glass); backdrop-filter: blur(15px); border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        #sidebar { width: 280px; position: sticky; top: 2rem; display: flex; flex-direction: column; gap: 15px; }
        .post-it { 
            background: var(--note-yellow); padding: 15px; box-shadow: 5px 5px 15px rgba(0,0,0,0.2); 
            border-radius: 2px; transform: rotate(-1deg); font-size: 0.9rem; color: #333; border-left: 5px solid rgba(0,0,0,0.05);
            animation: slideIn 0.3s ease-out; word-wrap: break-word; position: relative;
        }
        .post-it small { position: absolute; bottom: 5px; right: 8px; font-size: 0.65rem; opacity: 0.5; }
        .hidden { display: none; }
        input, select, textarea, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 12px; font-size: 1rem; box-sizing: border-box; }
        .primary-btn { background: var(--accent); color: white; border: none; font-weight: bold; cursor: pointer; }
        .activate-btn { background: var(--alert-red); color: white; font-size: 1.8rem; padding: 30px; border: 5px solid white; border-radius: 20px; font-weight: 900; cursor: pointer; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        #copy-area { background: #f4f4f4; padding: 15px; border-radius: 12px; font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; border: 1px solid #ddd; max-height: 300px; overflow-y: auto; }
        #rush-btn { position: fixed; bottom: 20px; right: 20px; background: none; border: none; font-size: 1.5rem; cursor: pointer; opacity: 0.3; }
    </style>
</head>
<body>

<div id="main-container">
    <div id="app">
        <h1 id="main-title" style="text-align:center; margin-top:0;">POM</h1>
        <div id="cycle-breadcrumb" style="text-align:center; font-weight:bold; color:var(--accent); font-size:0.9rem; margin-bottom:10px;"></div>
        
        <div id="setup-area">
            <input type="text" id="goal-input" placeholder="Main Goal...">
            <textarea id="steps-input" rows="3" placeholder="Steps (One per line)..."></textarea>
            <input type="number" id="cycle-count" min="1" max="5" value="3">
            <button class="primary-btn" onclick="goToTimeline()">Plan Timeline &rarr;</button>
        </div>

        <div id="timeline-area" class="hidden">
            <h2>Strategic Review</h2>
            <div id="timeline-list"></div>
            <button class="primary-btn" onclick="startLiveSession()">Initialise System</button>
        </div>

        <div id="timer-area" class="hidden">
            <div id="status-msg" style="text-align:center; font-weight:bold; text-transform:uppercase; background:rgba(0,0,0,0.05); padding:5px; border-radius:8px;"></div>
            <div id="time-left" style="font-size: 6rem; font-weight: 800; text-align: center; margin: 10px 0;">00:00</div>
            
            <div id="warmup-controls" class="hidden" style="background:rgba(255,255,255,0.6); padding:15px; border-radius:12px; margin-bottom:15px; border:1px solid #ccc;">
                <label>Energy (1-10):</label>
                <input type="range" id="energy-live" min="1" max="10" value="5" onchange="updateCurrentEnergy(this.value)">
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <select id="pivot-step" onchange="pivotPlan('step', this.value)"></select>
                    <select id="pivot-break" onchange="pivotPlan('icon', this.value)">
                        <option value="🚶">🚶 Moving</option><option value="🍎">🍎 Food</option>
                        <option value="🏋️">🏋️ Exercise</option><option value="💬">💬 Social</option><option value="🧹">🧹 Broom</option>
                    </select>
                </div>
            </div>

            <div id="activation-zone" class="hidden" style="text-align:center;">
                <button class="activate-btn" onclick="handleActivation()">BACK TO WORK</button>
                <p style="color:var(--alert-red); font-weight:bold;">Break Over! Return to System.</p>
            </div>
            
            <div id="break-display" class="hidden" style="text-align:center; font-size:5rem; margin:10px 0;"></div>
            <input type="text" id="distraction-input" placeholder="Release thought..." onkeydown="if(event.key==='Enter') saveDistraction()">
        </div>

        <div id="summary-area" class="hidden">
            <h2>Session Reflection</h2>
            <div id="final-stats"></div>
            <label>Copy Report:</label>
            <div id="copy-area"></div>
            <button class="primary-btn" style="margin-top:10px;" onclick="copyToClipboard()">Click to Copy All</button>
            <button style="background:none; border:none; color:#999; cursor:pointer; margin-top:10px;" onclick="location.reload()">New Session</button>
        </div>
    </div>

    <div id="sidebar">
        <h3 style="color:white; text-align:center; margin-top:0; text-shadow: 1px 1px 3px rgba(0,0,0,0.5);">Mental Space</h3>
    </div>
</div>

<button id="rush-btn" onclick="rush()">⏩</button>

<script>
    let state = {
        goal: '', cycles: 1, currentCycle: 1, phase: 'idle', timeLeft: 0,
        plan: [], distractions: [], energyHistory: [], driftHistory: [], timerId: null, rawSteps: []
    };

    let audioCtx;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

    function playSound(type) {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'whistle') {
            osc.frequency.setValueAtTime(900, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1400, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        } else if (type === 'gong') {
            osc.frequency.setValueAtTime(140, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3);
            osc.start(); osc.stop(audioCtx.currentTime + 3);
        } else if (type === 'alert') {
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
            osc.start(); osc.stop(audioCtx.currentTime + 0.2);
        }
    }

    function goToTimeline() {
        state.goal = document.getElementById('goal-input').value || "Deep Study";
        state.rawSteps = document.getElementById('steps-input').value.split('\n').filter(s => s.trim() !== '');
        state.cycles = parseInt(document.getElementById('cycle-count').value);
        let html = `<table style="width:100%; border-collapse:collapse; margin-bottom:15px;">`;
        for(let i=1; i<=state.cycles; i++) {
            html += `<tr style="border-bottom:1px solid #ddd"><td style="padding:10px"><b>C${i}:</b></td><td><select id="step-${i}">${state.rawSteps.map(s=>`<option>${s}</option>`).join('')}<option>Review</option></select></td><td><select id="break-${i}"><option value="🚶">🚶 Moving</option><option value="🍎">🍎 Food</option><option value="🏋️">🏋️ Exercise</option><option value="💬">💬 Social</option><option value="🧹">🧹 Broom</option></select></td></tr>`;
        }
        document.getElementById('timeline-list').innerHTML = html + `</table>`;
        document.getElementById('setup-area').classList.add('hidden');
        document.getElementById('timeline-area').classList.remove('hidden');
    }

    function startLiveSession() {
        for(let i=1; i<=state.cycles; i++) {
            state.plan.push({ step: document.getElementById(`step-${i}`).value, icon: document.getElementById(`break-${i}`).value });
            state.energyHistory[i-1] = 5;
        }
        document.getElementById('timeline-area').classList.add('hidden');
        document.getElementById('timer-area').classList.remove('hidden');
        const pivotS = document.getElementById('pivot-step');
        pivotS.innerHTML = state.rawSteps.map(s => `<option value="${s}">${s}</option>`).join('') + '<option>Review</option>';
        updateCycleBreadcrumb();
        runPhase('warmup');
    }

    function updateCycleBreadcrumb() {
        document.getElementById('cycle-breadcrumb').innerText = `Cycle ${state.currentCycle} of ${state.cycles}`;
    }

    function runPhase(phase) {
        state.phase = phase;
        document.getElementById('activation-zone').classList.add('hidden');
        document.getElementById('break-display').classList.add('hidden');
        document.getElementById('warmup-controls').classList.add('hidden');
        
        if (phase === 'warmup') { 
            state.timeLeft = 60; document.getElementById('app').style.backgroundColor = 'var(--warmup)'; 
            playSound('whistle');
            document.getElementById('warmup-controls').classList.remove('hidden');
            document.getElementById('pivot-step').value = state.plan[state.currentCycle-1].step;
            document.getElementById('pivot-break').value = state.plan[state.currentCycle-1].icon;
        }
        else if (phase === 'study') { 
            state.timeLeft = 23 * 60; document.getElementById('app').style.backgroundColor = 'var(--study)'; 
            playSound('gong');
        }
        else if (phase === 'wrapup') { 
            state.timeLeft = 60; document.getElementById('app').style.backgroundColor = 'var(--wrapup)'; 
            playSound('gong');
        }
        else if (phase === 'break') { 
            state.timeLeft = 5 * 60; document.getElementById('app').style.backgroundColor = 'var(--break)';
            document.getElementById('break-display').innerText = state.plan[state.currentCycle-1].icon;
            document.getElementById('break-display').classList.remove('hidden');
            playSound('whistle');
        }

        document.getElementById('status-msg').innerText = `${phase} | ${state.plan[state.currentCycle-1].step}`;
        if(state.timerId) clearInterval(state.timerId);
        state.timerId = setInterval(tick, 1000);
    }

    function tick() {
        state.timeLeft--;
        if (state.timeLeft <= 0) {
            clearInterval(state.timerId);
            if (state.phase === 'warmup') runPhase('study');
            else if (state.phase === 'study') runPhase('wrapup');
            else if (state.phase === 'wrapup') runPhase('break');
            else if (state.phase === 'break') { 
                document.getElementById('activation-zone').classList.remove('hidden'); 
                state.breakEnd = new Date(); 
                state.alertId = setInterval(() => playSound('alert'), 60000);
                playSound('alert');
            }
        }
        updateDisplay();
    }

    function updateCurrentEnergy(val) { state.energyHistory[state.currentCycle-1] = val; }
    function pivotPlan(key, val) { state.plan[state.currentCycle-1][key] = val; }

    function handleActivation() {
        clearInterval(state.alertId);
        let drift = Math.floor((new Date() - state.breakEnd) / 60000);
        state.driftHistory.push(drift);
        if (state.currentCycle < state.cycles) { 
            state.currentCycle++; 
            updateCycleBreadcrumb();
            runPhase('warmup'); 
        }
        else showSummary();
    }

    function updateDisplay() {
        const m = Math.floor(state.timeLeft / 60);
        const s = state.timeLeft % 60;
        document.getElementById('time-left').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function saveDistraction() {
        const el = document.getElementById('distraction-input');
        if(!el.value) return;
        state.distractions.push({ text: el.value, cycle: state.currentCycle });
        const note = document.createElement('div');
        note.className = 'post-it';
        note.innerHTML = `${el.value} <small>Cycle ${state.currentCycle}</small>`;
        document.getElementById('sidebar').prepend(note);
        el.value = '';
    }

    function showSummary() {
        document.getElementById('timer-area').classList.add('hidden');
        document.getElementById('summary-area').classList.remove('hidden');
        let report = `SESSION REPORT: ${state.goal}\n------------------------------\n`;
        state.plan.forEach((p, i) => {
            report += `CYCLE ${i+1}: ${p.step} | Energy: ${state.energyHistory[i]}/10 | Drift: ${state.driftHistory[i] || 0}m\n`;
        });
        report += `\nRELEASED THOUGHTS:\n`;
        state.distractions.forEach(d => report += `[Cycle ${d.cycle}] ${d.text}\n`);
        
        document.getElementById('copy-area').innerText = report;
    }

    function copyToClipboard() {
        const text = document.getElementById('copy-area').innerText;
        navigator.clipboard.writeText(text).then(() => alert("Report copied to clipboard!"));
    }

    function rush() { state.timeLeft = 1; }
</script>
</body>
</html>
