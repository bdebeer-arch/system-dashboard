<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POM | Study Systems</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.95);
            --accent: #2c3e50;
            --warmup: #e3f2fd; --study: #ffffff; --wrapup: #fff3e0; --break: #f1f8e9;
            --alert-red: #e74c3c;
        }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        #app { max-width: 600px; width: 95%; margin: 2rem 0; padding: 2rem; background: var(--glass); backdrop-filter: blur(15px); border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .hidden { display: none; }
        input, select, textarea, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 12px; font-size: 1rem; box-sizing: border-box; }
        .primary-btn { background: var(--accent); color: white; border: none; font-weight: bold; cursor: pointer; }
        .activate-btn { background: var(--alert-red); color: white; font-size: 1.8rem; padding: 30px; border: 5px solid white; border-radius: 20px; font-weight: 900; cursor: pointer; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #rush-btn { position: fixed; bottom: 20px; right: 20px; background: none; border: none; font-size: 1.5rem; cursor: pointer; opacity: 0.3; }
        #rush-btn:hover { opacity: 1; }
        .energy-box { background: #eee; padding: 15px; border-radius: 12px; text-align: center; }
    </style>
</head>
<body>

<div id="app">
    <h1 style="text-align:center">POM</h1>
    
    <div id="setup-area">
        <input type="text" id="goal-input" placeholder="Main Goal...">
        <textarea id="steps-input" rows="3" placeholder="Steps (one per line)..."></textarea>
        <input type="number" id="cycle-count" min="1" max="5" value="3">
        <input type="text" id="yt-url" placeholder="YouTube URL (Optional)">
        <button class="primary-btn" onclick="goToTimeline()">Plan Timeline &rarr;</button>
    </div>

    <div id="timeline-area" class="hidden">
        <div id="timeline-list"></div>
        <button class="primary-btn" onclick="startLiveSession()">Initialise</button>
    </div>

    <div id="timer-area" class="hidden">
        <div id="status-msg" style="text-align:center; font-weight:bold; text-transform:uppercase;"></div>
        <div id="time-left" style="font-size: 5rem; font-weight: 800; text-align: center;">00:00</div>
        
        <div id="energy-check" class="hidden energy-box">
            <p><b>Current Energy / Engagement (1-10):</b></p>
            <input type="range" id="energy-slider" min="1" max="10" value="5">
            <button class="primary-btn" onclick="confirmEnergy()">Enter Focus Block</button>
        </div>

        <div id="activation-zone" class="hidden" style="text-align:center;">
            <button class="activate-btn" onclick="handleActivation()">BACK TO WORK</button>
        </div>
        
        <div id="break-display" class="hidden" style="text-align:center; font-size:4rem;"></div>
        <input type="text" id="distraction-input" placeholder="Release thought..." onkeydown="if(event.key==='Enter') saveDistraction()">
    </div>

    <div id="summary-area" class="hidden">
        <div id="final-stats"></div>
        <button class="primary-btn" onclick="exportCSV()">Export CSV</button>
    </div>
</div>

<button id="rush-btn" onclick="rush()">⏩</button>

<script>
    let state = {
        goal: '', cycles: 1, currentCycle: 1, phase: 'idle', timeLeft: 0,
        plan: [], distractions: [], energyHistory: [], driftHistory: [], timerId: null
    };

    let audioCtx;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

    function playSound(type) {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        
        if (type === 'whistle') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1600, audioCtx.currentTime + 0.1);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        } else if (type === 'gong') {
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2);
            osc.start(); osc.stop(audioCtx.currentTime + 2);
        }
    }

    function goToTimeline() {
        state.goal = document.getElementById('goal-input').value || "Study";
        let steps = document.getElementById('steps-input').value.split('\n').filter(s => s.trim() !== '');
        state.cycles = parseInt(document.getElementById('cycle-count').value);
        
        let html = `<table style="width:100%; border-collapse:collapse;">`;
        for(let i=1; i<=state.cycles; i++) {
            html += `<tr><td>C${i} Step:</td><td><select id="step-${i}">${steps.map(s=>`<option>${s}</option>`).join('')}<option>Review</option></select></td></tr>`;
            html += `<tr><td>C${i} Break:</td><td><select id="break-${i}"><option value="🚶">Moving</option><option value="🍎">Food</option><option value="🏋️">Exercise</option><option value="🧹">Broom</option></select></td></tr>`;
        }
        html += `</table>`;
        document.getElementById('timeline-list').innerHTML = html;
        document.getElementById('setup-area').classList.add('hidden');
        document.getElementById('timeline-area').classList.remove('hidden');
    }

    function startLiveSession() {
        for(let i=1; i<=state.cycles; i++) {
            state.plan.push({ step: document.getElementById(`step-${i}`).value, icon: document.getElementById(`break-${i}`).value });
        }
        document.getElementById('timeline-area').classList.add('hidden');
        document.getElementById('timer-area').classList.remove('hidden');
        runPhase('warmup');
    }

    function runPhase(phase) {
        state.phase = phase;
        document.getElementById('energy-check').classList.add('hidden');
        document.getElementById('activation-zone').classList.add('hidden');
        document.getElementById('break-display').classList.add('hidden');
        
        if (phase === 'warmup') { state.timeLeft = 60; playSound('gong'); }
        else if (phase === 'study') { state.timeLeft = 23 * 60; }
        else if (phase === 'wrapup') { state.timeLeft = 60; }
        else if (phase === 'break') { 
            state.timeLeft = 5 * 60; 
            document.getElementById('break-display').innerText = state.plan[state.currentCycle-1].icon;
            document.getElementById('break-display').classList.remove('hidden');
        }

        document.getElementById('status-msg').innerText = phase;
        if(state.timerId) clearInterval(state.timerId);
        state.timerId = setInterval(tick, 1000);
    }

    function tick() {
        state.timeLeft--;
        if (state.timeLeft <= 0) {
            clearInterval(state.timerId);
            if (state.phase === 'warmup') {
                playSound('whistle');
                document.getElementById('energy-check').classList.remove('hidden');
            } else if (state.phase === 'study') {
                runPhase('wrapup');
            } else if (state.phase === 'wrapup') {
                playSound('whistle');
                runPhase('break');
            } else if (state.phase === 'break') {
                document.getElementById('activation-zone').classList.remove('hidden');
                state.breakEnd = new Date();
            }
        }
        updateDisplay();
    }

    function confirmEnergy() {
        state.energyHistory.push(document.getElementById('energy-slider').value);
        runPhase('study');
    }

    function handleActivation() {
        let drift = Math.floor((new Date() - state.breakEnd) / 60000);
        state.driftHistory.push(drift);
        if (state.currentCycle < state.cycles) { state.currentCycle++; runPhase('warmup'); }
        else showSummary();
    }

    function updateDisplay() {
        const m = Math.floor(state.timeLeft / 60);
        const s = state.timeLeft % 60;
        document.getElementById('time-left').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function showSummary() {
        document.getElementById('timer-area').classList.add('hidden');
        document.getElementById('summary-area').classList.remove('hidden');
        let html = `<h3>Session Log</h3><table style="width:100%"><tr><th>Cycle</th><th>Step</th><th>Energy</th><th>Drift</th></tr>`;
        state.plan.forEach((p, i) => {
            html += `<tr><td>${i+1}</td><td>${p.step}</td><td>${state.energyHistory[i] || '-'}</td><td>${state.driftHistory[i] || 0}m</td></tr>`;
        });
        document.getElementById('final-stats').innerHTML = html + `</table>`;
    }

    function exportCSV() {
        let csv = "Cycle,Step,Energy,Drift\n";
        state.plan.forEach((p, i) => { csv += `${i+1},${p.step},${state.energyHistory[i]},${state.driftHistory[i]}\n`; });
        const link = document.createElement("a");
        link.href = encodeURI("data:text/csv;charset=utf-8," + csv);
        link.download = "pom_log.csv";
        link.click();
    }

    function rush() { state.timeLeft = 1; }

    function saveDistraction() {
        state.distractions.push(document.getElementById('distraction-input').value);
        document.getElementById('distraction-input').value = '';
    }
</script>
</body>
</html>
