<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Te Whare Tapa Whā Reflection</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #f4f7f6; color: #2c3e50; padding: 20px; }
        .wrapper { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 12px; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        .unlock-sidebar { position: absolute; top: 25px; right: 25px; text-align: right; }
        .btn-mini { background: #dfe6e9; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; transition: 0.3s; color: #636e72; }
        .btn-mini.active { background: #27ae60; color: white; }

        .main-layout { display: grid; grid-template-columns: 300px 1fr 200px; gap: 20px; margin-top: 40px; align-items: start; }
        .input-group { margin-bottom: 12px; padding: 12px; background: #fafafa; border-radius: 8px; border: 1px solid #edf2f7; }
        .input-group.whenua { border-color: #27ae60; background: #f0fff4; display: none; }
        label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 8px; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #3498db; }
        
        /* Elevation View Styling */
        .elevation-view { background: #fcfcfc; border: 1px solid #eee; border-radius: 8px; padding: 10px; display: none; text-align: center; }
        .elevation-view canvas { width: 100% !important; height: auto !important; }

        .diagnostic-section { margin-top: 40px; border-top: 1px solid #edf2f7; padding-top: 30px; }
        .mini-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 15px; }
        .mini-card { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 8px; text-align: center; font-size: 12px; }
    </style>
</head>
<body>

<div class="wrapper">
    <h1>Te Whare Tapa Whā Reflection</h1>
    
    <div class="unlock-sidebar">
        <button id="unlockBtn" class="btn-mini" onclick="toggleElevation()">Show Elevation View</button>
    </div>

    <div class="main-layout">
        <div class="controls">
            <div class="input-group"><label>Taha Tinana</label><input type="range" id="t1" min="1" max="10" value="7" oninput="update()"></div>
            <div class="input-group"><label>Taha Hinengaro</label><input type="range" id="t2" min="1" max="10" value="6" oninput="update()"></div>
            <div class="input-group"><label>Taha Whānau</label><input type="range" id="t3" min="1" max="10" value="8" oninput="update()"></div>
            <div class="input-group"><label>Taha Wairua</label><input type="range" id="t4" min="1" max="10" value="5" oninput="update()"></div>
            <div class="input-group whenua" id="whenuaBox"><label style="color:#27ae60;">Whenua (Belonging)</label><input type="range" id="t5" min="1" max="10" value="5" oninput="update()"></div>
        </div>
        
        <div class="chart-box"><canvas id="mainChart"></canvas></div>

        <div class="elevation-view" id="elevationBox">
            <label style="color: #7f8c8d; font-size: 10px;">WHAKAPAPA ELEVATION</label>
            <canvas id="elevationChart"></canvas>
            <p style="font-size: 10px; margin-top: 10px; color: #95a5a6;">This side-view shows the height of your whare based on Whenua.</p>
        </div>
    </div>

    <div class="diagnostic-section">
        <div class="mini-grid" id="miniGrid"></div>
    </div>
</div>

<script>
    let showElevation = false;
    let mainChart, elevationChart;

    function init() {
        const ctx = document.getElementById('mainChart').getContext('2d');
        mainChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['Physical', 'Mental', 'Social', 'Spiritual'],
                datasets: [{ 
                    label: 'Base', 
                    data: [7, 6, 8, 5], 
                    backgroundColor: 'rgba(52, 152, 219, 0.4)', 
                    borderColor: '#3498db', 
                    fill: true 
                }]
            },
            options: { scales: { r: { min: 0, max: 10, ticks: { display: false } } }, plugins: { legend: { display: false } } }
        });

        const eCtx = document.getElementById('elevationChart').getContext('2d');
        elevationChart = new Chart(eCtx, {
            type: 'bar',
            data: {
                labels: ['Whare Elevation'],
                datasets: [{
                    label: 'Whenua Height',
                    data: [5],
                    backgroundColor: '#27ae60',
                    borderRadius: 10,
                    barThickness: 40
                }]
            },
            options: {
                scales: { y: { min: 0, max: 10, ticks: { display: false }, grid: { display: false } }, x: { grid: { display: false } } },
                plugins: { legend: { display: false } }
            }
        });

        // Diagnostic Mini-Charts
        const grid = document.getElementById('miniGrid');
        for (let i = 0; i < 3; i++) {
            const card = document.createElement('div');
            card.className = 'mini-card';
            card.innerHTML = `<strong>Profile ${i+1}</strong><div style="height:140px;"><canvas id="mini${i}"></canvas></div>`;
            grid.appendChild(card);
            new Chart(document.getElementById(`mini${i}`).getContext('2d'), {
                type: 'radar',
                data: { labels: ['P','M','S','Sp'], datasets: [{ data: [Math.random()*8+2,Math.random()*8+2,Math.random()*8+2,Math.random()*8+2], backgroundColor: 'rgba(189, 195, 199, 0.3)', borderColor: '#bdc3c7', pointRadius: 0 }] },
                options: { scales: { r: { min: 0, max: 10, ticks: { display: false } } }, plugins: { legend: { display: false } } }
            });
        }
    }

    function toggleElevation() {
        showElevation = !showElevation;
        document.getElementById('whenuaBox').style.display = showElevation ? "block" : "none";
        document.getElementById('elevationBox').style.display = showElevation ? "block" : "none";
        document.getElementById('unlockBtn').classList.toggle('active');
        document.getElementById('unlockBtn').innerText = showElevation ? "Hide Elevation" : "Show Elevation View";
    }

    function update() {
        const v = [1,2,3,4,5].map(i => +document.getElementById('t'+i).value);
        mainChart.data.datasets[0].data = v.slice(0,4);
        mainChart.update();

        elevationChart.data.datasets[0].data = [v[4]];
        elevationChart.update();
    }

    window.onload = init;
</script>
</body>
</html>
