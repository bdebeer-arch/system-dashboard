<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Te Whare Tapa Whā: Pyramidal Projection</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f0f2f5; color: #2d3436; padding: 20px; line-height: 1.5; }
        .wrapper { max-width: 950px; margin: auto; background: white; padding: 35px; border-radius: 20px; box-shadow: 0 12px 40px rgba(0,0,0,0.12); }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; font-size: 0.95em; }
        .unlock-panel { background: #eef2f7; padding: 20px; border-radius: 12px; border: 2px dashed #3498db; text-align: center; margin-bottom: 30px; }
        .btn { background: #3498db; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
        .btn:hover { background: #2980b9; transform: translateY(-1px); }
        .main-layout { display: grid; grid-template-columns: 1fr 1.2fr; gap: 40px; margin-bottom: 50px; }
        .input-group { margin-bottom: 18px; padding: 12px; background: #f8f9fa; border-radius: 10px; border-left: 4px solid #3498db; }
        .input-group.whenua { border-left-color: #27ae60; background: #f1f9f3; }
        label { display: block; font-weight: 700; font-size: 0.85em; margin-bottom: 8px; color: #34495e; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #3498db; }
        .diagnostic-section { border-top: 2px solid #ecf0f1; padding-top: 40px; }
        .mini-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 25px; }
        .mini-card { background: #fff; border: 1px solid #e0e0e0; padding: 20px; border-radius: 12px; text-align: center; transition: box-shadow 0.3s; }
        .mini-card:hover { box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .mini-chart-container { height: 180px; margin-bottom: 15px; }
        textarea { width: 100%; border: 1px solid #dcdde1; border-radius: 8px; padding: 10px; font-size: 0.85em; background: #fafafa; }
    </style>
</head>
<body>

<div class="wrapper">
    <h1>Te Whare Tapa Whā</h1>
    <p class="subtitle">A Systems-Thinking Approach to Holistic Wellbeing</p>
    
    <div class="unlock-panel">
        <p>Current View: <strong id="modeLabel">2D Base Map</strong></p>
        <button class="btn" id="toggleBtn" onclick="toggle3D()">Unlock Whenua (Vertical Projection)</button>
    </div>

    <div class="main-layout">
        <div class="controls">
            <div class="input-group"><label>Taha Tinana (Physical)</label><input type="range" id="t1" min="0" max="10" value="5" oninput="updateMain()"></div>
            <div class="input-group"><label>Taha Hinengaro (Mental)</label><input type="range" id="t2" min="0" max="10" value="5" oninput="updateMain()"></div>
            <div class="input-group"><label>Taha Whānau (Social)</label><input type="range" id="t3" min="0" max="10" value="5" oninput="updateMain()"></div>
            <div class="input-group"><label>Taha Wairua (Spiritual)</label><input type="range" id="t4" min="0" max="10" value="5" oninput="updateMain()"></div>
            <div class="input-group whenua" id="whenuaBox" style="display:none;"><label style="color:#27ae60;">Whenua (Belonging & Foundation)</label><input type="range" id="t5" min="0" max="10" value="0" oninput="updateMain()"></div>
        </div>
        <div class="chart-box"><canvas id="mainChart"></canvas></div>
    </div>

    <div class="diagnostic-section">
        <h2>Diagnostic Case Studies</h2>
        <p style="text-align: center; color: #7f8c8d;">Analyse these randomised profiles. How does their balance affect the whare?</p>
        <div class="mini-grid" id="miniGrid"></div>
    </div>
</div>

<script>
    let is3D = false;
    let mainChart;

    function init() {
        const ctx = document.getElementById('mainChart').getContext('2d');
        mainChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: [['Taha Tinana','(Physical)'], ['Taha Hinengaro','(Mental)'], ['Taha Whānau','(Social)'], ['Taha Wairua','(Spiritual)']],
                datasets: [
                    {
                        label: 'Whare Base',
                        data: [5, 5, 5, 5],
                        backgroundColor: 'rgba(52, 152, 219, 0.4)',
                        borderColor: '#3498db',
                        borderWidth: 2,
                        fill: true
                    },
                    {
                        label: 'Whenua Apex',
                        data: [0, 0, 0, 0],
                        backgroundColor: 'rgba(39, 174, 96, 0.3)',
                        borderColor: '#27ae60',
                        pointRadius: 0,
                        borderWidth: 1,
                        hidden: true,
                        fill: true
                    }
                ]
            },
            options: { scales: { r: { min: 0, max: 10, ticks: { display: false }, grid: { color: '#ecf0f1' } } }, plugins: { legend: { display: false } } }
        });

        // Initialize Mini Charts
        const grid = document.getElementById('miniGrid');
        for (let i = 0; i < 3; i++) {
            const card = document.createElement('div');
            card.className = 'mini-card';
            const randomData = Array.from({length: 4}, () => Math.floor(Math.random() * 8) + 2);
            card.innerHTML = `<strong>Profile ${String.fromCharCode(65 + i)}</strong><div class="mini-chart-container"><canvas id="mini${i}"></canvas></div><textarea rows="3" placeholder="Diagnose this state..."></textarea>`;
            grid.appendChild(card);
            new Chart(document.getElementById(`mini${i}`).getContext('2d'), {
                type: 'radar',
                data: { labels: ['P', 'M', 'S', 'Sp'], datasets: [{ data: randomData, backgroundColor: 'rgba(149, 165, 166, 0.2)', borderColor: '#95a5a6', pointRadius: 0 }] },
                options: { scales: { r: { min: 0, max: 10, ticks: { display: false } } }, plugins: { legend: { display: false } } }
            });
        }
    }

    function toggle3D() {
        is3D = !is3D;
        document.getElementById('whenuaBox').style.display = is3D ? 'block' : 'none';
        document.getElementById('modeLabel').innerText = is3D ? '3D Pyramidal Projection' : '2D Base Map';
        document.getElementById('toggleBtn').innerText = is3D ? 'Lock to 2D' : 'Unlock Whenua (Vertical Projection)';
        updateMain();
    }

    function updateMain() {
        const vals = [1,2,3,4,5].map(i => +document.getElementById('t'+i).value);
        mainChart.data.datasets[0].data = vals.slice(0,4);
        
        if (is3D) {
            const whenua = vals[4];
            const scaleFactor = 1 - (whenua / 25); // Inward taper simulation
            mainChart.data.datasets[1].data = vals.slice(0,4).map(v => v * scaleFactor);
            mainChart.data.datasets[1].hidden = false;
            mainChart.data.datasets[0].backgroundColor = 'rgba(52, 152, 219, 0.2)';
            mainChart.data.datasets[1].backgroundColor = `rgba(39, 174, 96, ${0.1 + (whenua/20)})`;
        } else {
            mainChart.data.datasets[1].hidden = true;
            mainChart.data.datasets[0].backgroundColor = 'rgba(52, 152, 219, 0.4)';
        }
        mainChart.update();
    }

    window.onload = init;
</script>
</body>
</html>
