<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Te Whare Tapa Whā Reflection Tool</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f7f6; color: #333; padding: 20px; }
        .wrapper { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 12px; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        /* Small, side-aligned Unlock Feature */
        .unlock-sidebar { position: absolute; top: 20px; right: 20px; text-align: right; }
        .unlock-sidebar label { font-size: 11px; color: #7f8c8d; display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
        .btn-mini { background: #cfd8dc; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; transition: 0.2s; }
        .btn-mini.active { background: #27ae60; color: white; }

        .main-layout { display: grid; grid-template-columns: 320px 1fr; gap: 30px; margin-top: 40px; }
        .input-group { margin-bottom: 12px; padding: 10px; background: #fafafa; border-radius: 8px; border: 1px solid #eee; }
        .input-group.whenua { border-color: #27ae60; background: #f1f9f3; display: none; }
        label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 6px; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #3498db; }
        
        .diagnostic-section { margin-top: 40px; border-top: 1px solid #eee; padding-top: 30px; }
        .mini-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 15px; }
        .mini-card { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 8px; font-size: 12px; text-align: center; }
        .mini-chart-container { height: 160px; }
        textarea { width: 100%; border: 1px solid #ddd; border-radius: 4px; margin-top: 8px; font-size: 11px; padding: 5px; resize: none; }
        h1 { font-size: 22px; color: #2c3e50; margin: 0; }
    </style>
</head>
<body>

<div class="wrapper">
    <h1>Te Whare Tapa Whā</h1>
    
    <div class="unlock-sidebar">
        <label>Dimensions</label>
        <button id="unlockBtn" class="btn-mini" onclick="toggle3D()">Unlock 3D</button>
    </div>

    <div class="main-layout">
        <div class="controls">
            <div class="input-group"><label>Taha Tinana (Physical)</label><input type="range" id="t1" min="1" max="10" value="5" oninput="update()"></div>
            <div class="input-group"><label>Taha Hinengaro (Mental)</label><input type="range" id="t2" min="1" max="10" value="5" oninput="update()"></div>
            <div class="input-group"><label>Taha Whānau (Social)</label><input type="range" id="t3" min="1" max="10" value="5" oninput="update()"></div>
            <div class="input-group"><label>Taha Wairua (Spiritual)</label><input type="range" id="t4" min="1" max="10" value="5" oninput="update()"></div>
            <div class="input-group whenua" id="whenuaBox"><label style="color:#27ae60;">Whenua (Belonging)</label><input type="range" id="t5" min="1" max="10" value="1" oninput="update()"></div>
        </div>
        <div class="chart-box"><canvas id="mainChart"></canvas></div>
    </div>

    <div class="diagnostic-section">
        <label style="color: #7f8c8d; text-align:center;">DIAGNOSTIC CASE STUDIES</label>
        <div class="mini-grid" id="miniGrid"></div>
    </div>
</div>

<script>
    let is3D = false;
    let mainChart;

    function init() {
        const ctx = document.getElementById('mainChart').getContext('2d');
        mainChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: [['Taha Tinana','Physical'], ['Taha Hinengaro','Mental'], ['Taha Whānau','Social'], ['Taha Wairua','Spiritual']],
                datasets: [
                    { label: 'Base', data: [5, 5, 5, 5], backgroundColor: 'rgba(52, 152, 219, 0.4)', borderColor: '#3498db', borderWidth: 2, fill: true },
                    { label: 'Apex', data: [0, 0, 0, 0], backgroundColor: 'rgba(39, 174, 96, 0.3)', borderColor: '#27ae60', borderWidth: 1, pointRadius: 0, fill: true, hidden: true }
                ]
            },
            options: { scales: { r: { min: 0, max: 10, ticks: { display: false } } }, plugins: { legend: { display: false } } }
        });

        const grid = document.getElementById('miniGrid');
        for (let i = 0; i < 3; i++) {
            const card = document.createElement('div');
            card.className = 'mini-card';
            const randomData = Array.from({length: 4}, () => Math.floor(Math.random() * 8) + 2);
            card.innerHTML = `<strong>Profile ${i+1}</strong><div class="mini-chart-container"><canvas id="mini${i}"></canvas></div><textarea placeholder="Diagnose..."></textarea>`;
            grid.appendChild(card);
            new Chart(document.getElementById(`mini${i}`).getContext('2d'), {
                type: 'radar',
                data: { labels: ['P', 'M', 'S', 'Sp'], datasets: [{ data: randomData, backgroundColor: 'rgba(189, 195, 199, 0.3)', borderColor: '#bdc3c7', pointRadius: 0 }] },
                options: { scales: { r: { min: 0, max: 10, ticks: { display: false } } }, plugins: { legend: { display: false } } }
            });
        }
    }

    function toggle3D() {
        is3D = !is3D;
        const btn = document.getElementById('unlockBtn');
        const box = document.getElementById('whenuaBox');
        btn.classList.toggle('active');
        btn.innerText = is3D ? "Lock 2D" : "Unlock 3D";
        box.style.display = is3D ? "block" : "none";
        update();
    }

    function update() {
        const v = [1,2,3,4,5].map(i => +document.getElementById('t'+i).value);
        mainChart.data.datasets[0].data = v.slice(0,4);
        
        if (is3D) {
            const whenua = v[4];
            const scale = 1 - (whenua / 20); // Creates the "inward" pull for the apex
            mainChart.data.datasets[1].data = v.slice(0,4).map(val => val * scale);
            mainChart.data.datasets[1].hidden = false;
            mainChart.data.datasets[1].backgroundColor = `rgba(39, 174, 96, ${0.1 + whenua/20})`;
        } else {
            mainChart.data.datasets[1].hidden = true;
        }
        mainChart.update();
    }

    window.onload = init;
</script>
</body>
</html>
