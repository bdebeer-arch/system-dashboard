<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Te Whare Tapa Whā + Whenua</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f0f4f8; color: #2d3436; display: flex; flex-direction: column; align-items: center; padding: 40px; }
        .container { background: #ffffff; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); max-width: 900px; width: 100%; }
        h1 { color: #0984e3; text-align: center; margin-bottom: 10px; }
        .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .control { display: flex; flex-direction: column; background: #f9f9f9; padding: 10px; border-radius: 8px; border-left: 4px solid #0984e3; }
        .control.whenua { border-left-color: #27ae60; background: #eef9f1; }
        label { font-size: 0.85em; font-weight: 700; margin-bottom: 5px; }
        input[type="number"] { padding: 10px; border: 1px solid #dfe6e9; border-radius: 5px; font-size: 1em; }
        .chart-container { position: relative; height: 450px; margin: 0 auto; }
    </style>
</head>
<body>

<div class="container">
    <h1>Te Whare Tapa Whā & Whenua</h1>
    <p style="text-align: center; margin-bottom: 30px;">Reflect on your five dimensions of wellbeing (0-10).</p>

    <div class="input-grid">
        <div class="control">
            <label for="tinana">Taha Tinana</label>
            <input type="number" id="tinana" value="7" min="0" max="10" oninput="updateChart()">
        </div>
        <div class="control">
            <label for="hinengaro">Taha Hinengaro</label>
            <input type="number" id="hinengaro" value="6" min="0" max="10" oninput="updateChart()">
        </div>
        <div class="control">
            <label for="whanau">Taha Whānau</label>
            <input type="number" id="whanau" value="8" min="0" max="10" oninput="updateChart()">
        </div>
        <div class="control">
            <label for="wairua">Taha Wairua</label>
            <input type="number" id="wairua" value="5" min="0" max="10" oninput="updateChart()">
        </div>
        <div class="control whenua">
            <label for="whenua">Whenua (Belonging)</label>
            <input type="number" id="whenua" value="9" min="0" max="10" oninput="updateChart()">
        </div>
    </div>

    <div class="chart-container">
        <canvas id="pyramidChart"></canvas>
    </div>
</div>

<script>
    const ctx = document.getElementById('pyramidChart').getContext('2d');
    let pyramidChart = new Chart(ctx, {
        type: 'radar',
        data: {
            labels: ['Taha Tinana', 'Taha Hinengaro', 'Taha Whānau', 'Taha Wairua', 'Whenua'],
            datasets: [{
                label: 'Wellbeing Profile',
                data: [7, 6, 8, 5, 9],
                fill: true,
                backgroundColor: 'rgba(9, 132, 227, 0.2)',
                borderColor: '#0984e3',
                pointBackgroundColor: '#0984e3',
                pointRadius: 5,
                borderWidth: 2
            }]
        },
        options: {
            scales: {
                r: {
                    min: 0,
                    max: 10,
                    ticks: { stepSize: 2, display: false },
                    grid: { color: '#dfe6e9' },
                    angleLines: { color: '#dfe6e9' },
                    pointLabels: { font: { size: 14, weight: 'bold' }, color: '#2d3436' }
                }
            },
            plugins: { legend: { display: false } }
        }
    });

    function updateChart() {
        pyramidChart.data.datasets[0].data = [
            document.getElementById('tinana').value,
            document.getElementById('hinengaro').value,
            document.getElementById('whanau').value,
            document.getElementById('wairua').value,
            document.getElementById('whenua').value
        ];
        pyramidChart.update();
    }
</script>

</body>
</html>
