<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Te Whare Tapa Whā: Dynamic 3D Tool</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f8f9fa; color: #2d3436; padding: 20px; line-height: 1.6; }
        .wrapper { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; text-align: center; }
        .unlock-panel { background: #e8f4fd; padding: 15px; border-radius: 10px; border: 2px dashed #3498db; text-align: center; margin-bottom: 25px; }
        .btn { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #2980b9; }
        .main-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 40px; }
        .input-group { margin-bottom: 15px; padding: 10px; background: #f1f2f6; border-radius: 8px; }
        label { display: block; font-weight: bold; font-size: 0.85em; margin-bottom: 5px; }
        input[type="range"] { width: 100%; accent-color: #3498db; }
        .chart-box { min-height: 400px; }
        .diagnostic-section { border-top: 2px solid #eee; padding-top: 30px; }
        .mini-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .mini-card { background: #fff; border: 1px solid #ddd; padding: 15px; border-radius: 10px; text-align: center; }
        .mini-chart-container { height: 180px; margin-bottom: 10px; }
        textarea { width: 100%; border-radius: 5px; border: 1px solid #ccc; padding: 8px; font-size: 0.9em; resize: none; }
    </style>
</head>
<body>

<div class="wrapper">
    <h1>Te Whare Tapa Whā Reflection</h1>
    
    <div class="unlock-panel">
        <p>Currently in <strong>2D Mode</strong></p>
        <button class="btn" id="toggleBtn" onclick="toggleMode()">Unlock Whenua (3D Projection)</button>
    </div>

    <div class="main-layout">
        <div class="controls">
            <div class="input-group">
                <label>Taha Tinana (Physical Wellbeing)</label>
                <input type="range" id="t1" min="0" max="10" value="5" oninput="updateMain()">
            </div>
            <div class="input-group">
                <label>Taha Hinengaro (Mental Wellbeing)</label>
                <input type="range" id="t2" min="0" max="10" value="5" oninput="updateMain()">
            </div>
            <div class="input-group">
                <label>Taha Whānau (Social Wellbeing)</label>
                <input type="range" id="t3" min="0" max="10" value="5" oninput="updateMain()">
            </div>
            <div class="input-group">
                <label>Taha Wairua (Spiritual Wellbeing)</label>
                <input type="range" id="t4" min="0" max="10" value="5" oninput="updateMain()">
            </div>
            <div class="input-group" id="whenuaBox" style="display:none; background: #e3f9e5;">
                <label style="color: #27ae60;">Whenua (Belonging / Vertical Apex)</label>
                <input type="range" id="t5" min="0" max="10" value="5" oninput="updateMain()">
            </div>
        </div>
        <div class="chart-box">
            <canvas id="mainChart"></canvas>
        </div>
    </div>

    <div class="diagnostic-section">
        <h2>Diagnostic Case Studies</h2>
        <p style="text-align: center;">Pick a profile below and diagnose the stability of their whare.</p>
        <div class="mini-grid" id="miniGrid"></div>
    </div>
</div>

<script>
    let mode3D = false;
    let mainChart;

    function init() {
        // Initialize Main Chart
        const ctx = document.getElementById('mainChart').getContext('2d');
        mainChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: [['Taha Tinana','(Physical)'], ['Taha Hinengaro','(Mental)'], ['Taha Whānau','(Social)'], ['Taha Wairua','(Spiritual)']],
                datasets: [{
                    label: 'Wellbeing Shape',
                    data: [5, 5, 5, 5],
                    backgroundColor: 'rgba(52, 152, 219, 0.4)',
                    borderColor: '#3498db',
                    pointBackgroundColor: '#3498db',
                    borderWidth: 2,
                    tension: 0.1
                }]
            },
            options: { scales: { r: { min: 0, max: 10, ticks: { display: false } } }, plugins: { legend: { display: false } } }
        });

        // Initialize 3 Mini Diagnostic Charts
        const grid = document.getElementById('miniGrid');
        for (let i = 0; i < 3; i++) {
            const card = document.createElement('div');
            card.className = 'mini-card';
            const randomData = Array.from({length: 4}, () => Math.floor(Math.random() * 9) + 1);
            card.innerHTML = `
                <strong>Profile ${String.fromCharCode(65 + i)}</strong>
                <div class="mini-chart-container"><canvas id="mini${i}"></canvas></div>
                <textarea rows="3" placeholder="Describe this state..."></textarea>
            `;
            grid.appendChild(card);
            
            new Chart(document.getElementById(`mini${i}`).getContext('2d'), {
                type: 'radar',
                data: {
                    labels: ['P', 'M', 'S', 'Sp'],
                    datasets: [{
                        data: randomData,
                        backgroundColor: 'rgba(149, 165, 166, 0.2)',
                        borderColor: '#95a5a6',
                        pointRadius: 0
                    }]
                },
                options: { scales: { r: { min: 0, max: 10, ticks: { display: false } } }, plugins: { legend: { display: false } } }
            });
        }
    }

    function toggleMode() {
        mode3D = !mode3D;
        document.getElementById('whenuaBox').style.display = mode3D ? 'block' : 'none';
        document.getElementById('toggleBtn').innerText = mode3D ? 'Lock to 2D View' : 'Unlock Whenua (3D Projection)';
        updateMain();
    }

    function updateMain() {
        const v = [1,2,3,4,5].map(i => document.getElementById('t'+i).value);
        mainChart.data.datasets[0].data = v.slice(0,4);
        
        if (mode3D) {
            const whenuaHeight = v[4];
            // Visual "Tent" Simulation: adjusting background opacity and line tension
            mainChart.data.datasets[0].backgroundColor = `rgba(52, 152, 219, ${0.1 + (whenuaHeight/15)})`;
            mainChart.data.datasets[0].tension = whenuaHeight / 15;
        } else {
            mainChart.data.datasets[0].backgroundColor = 'rgba(52, 152, 219, 0.4)';
            mainChart.data.datasets[0].tension = 0.1;
        }
        mainChart.update();
    }

    window.onload = init;
</script>
</body>
</html>
