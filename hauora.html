<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Te Whare Tapa Whā: 3D Tent Model</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f9; color: #333; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .header { text-align: center; margin-bottom: 30px; }
        .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: start; }
        .controls { background: #f8f9fa; padding: 20px; border-radius: 10px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.85em; }
        input[type="range"] { width: 100%; accent-color: #2980b9; }
        .val-disp { float: right; color: #2980b9; font-weight: bold; }
        .unlock-panel { grid-column: 1 / -1; background: #eef2f7; padding: 15px; border-radius: 10px; border-left: 5px solid #2980b9; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .diagnostic-grid { margin-top: 40px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .mini-card { background: #fff; border: 1px solid #eee; padding: 10px; border-radius: 8px; font-size: 0.8em; }
        .btn { background: #2980b9; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Te Whare Tapa Whā</h1>
        <p>Holistic Wellbeing Projection</p>
    </div>

    <div class="unlock-panel">
        <span><strong>Dimensionality:</strong> <span id="modeText">2D Spider Chart</span></span>
        <button class="btn" onclick="toggle3D()">Unlock Whenua (Vertical Axis)</button>
    </div>

    <div class="main-content">
        <div class="controls">
            <div class="input-group">
                <label>Taha Tinana (Physical) <span class="val-disp" id="v1">5</span></label>
                <input type="range" id="in1" min="0" max="10" value="5" oninput="update()">
            </div>
            <div class="input-group">
                <label>Taha Hinengaro (Mental) <span class="val-disp" id="v2">5</span></label>
                <input type="range" id="in2" min="0" max="10" value="5" oninput="update()">
            </div>
            <div class="input-group">
                <label>Taha Whānau (Social) <span class="val-disp" id="v3">5</span></label>
                <input type="range" id="in3" min="0" max="10" value="5" oninput="update()">
            </div>
            <div class="input-group">
                <label>Taha Wairua (Spiritual) <span class="val-disp" id="v4">5</span></label>
                <input type="range" id="in4" min="0" max="10" value="5" oninput="update()">
            </div>
            <div class="input-group" id="whenuaGroup" style="opacity: 0.3; pointer-events: none;">
                <label style="color:#27ae60;">Whenua (Belonging/Apex) <span class="val-disp" id="v5">0</span></label>
                <input type="range" id="in5" min="0" max="10" value="0" oninput="update()">
            </div>
        </div>

        <div class="chart-box">
            <canvas id="mainChart"></canvas>
        </div>
    </div>

    <div class="diagnostic-grid" id="diagnostics"></div>
</div>

<script>
    let is3D = false;
    let chart;

    function initChart() {
        const ctx = document.getElementById('mainChart').getContext('2d');
        chart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: [['Taha Tinana','(Physical)'], ['Taha Hinengaro','(Mental)'], ['Taha Whānau','(Social)'], ['Taha Wairua','(Spiritual)']],
                datasets: [{
                    label: 'The Whare Shape',
                    data: [5, 5, 5, 5],
                    backgroundColor: 'rgba(41, 128, 185, 0.4)',
                    borderColor: '#2980b9',
                    fill: true,
                    tension: 0.1
                }]
            },
            options: {
                scales: { r: { min: 0, max: 10, ticks: { display: false } } },
                plugins: { legend: { display: false } }
            }
        });
    }

    function toggle3D() {
        is3D = !is3D;
        document.getElementById('modeText').innerText = is3D ? "3D Vertical Projection" : "2D Spider Chart";
        document.getElementById('whenuaGroup').style.opacity = is3D ? "1" : "0.3";
        document.getElementById('whenuaGroup').style.pointer-events = is3D ? "all" : "none";
        update();
    }

    function update() {
        const vals = [1, 2, 3, 4, 5].map(i => document.getElementById('in'+i).value);
        [1, 2, 3, 4, 5].forEach(i => document.getElementById('v'+i).innerText = vals[i-1]);

        chart.data.datasets[0].data = vals.slice(0,4);
        
        if (is3D) {
            // Simulate vertical height by adjusting point gravity
            const height = vals[4];
            chart.data.datasets[0].pointRadius = [5, 5, 5, 5];
            chart.data.datasets[0].backgroundColor = `rgba(41, 128, 185, ${0.2 + (height/20)})`;
            // Visual "tension" creates the tent-like sloping effect
            chart.data.datasets[0].tension = height / 20;
        } else {
            chart.data.datasets[0].tension = 0.1;
        }
        chart.update();
    }

    function setupDiagnostics() {
        const container = document.getElementById('diagnostics');
        for (let i = 0; i < 3; i++) {
            const div = document.createElement('div');
            div.className = 'mini-card';
            div.innerHTML = `<strong>Profile ${i+1}</strong><canvas id="mini${i}"></canvas>
            <textarea style="width:100%; height:40px; margin-top:5px; font-size:10px" placeholder="Diagnose..."></textarea>`;
            container.appendChild(div);
            
            new Chart(document.getElementById('mini'+i), {
                type: 'radar',
                data: {
                    labels: ['P','M','S','Sp'],
                    datasets: [{ data: Array.from({length:4}, () => Math.floor(Math.random()*9)+1), pointRadius:0, borderColor:'#bdc3c7' }]
                },
                options: { scales: { r: { min:0, max:10, ticks:{display:false} } }, plugins: { legend: { display:false } } }
            });
        }
    }

    window.onload = () => { initChart(); setupDiagnostics(); };
</script>
</body>
</html>
