<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Tier Spatial Variable Grouper</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --panel-bg: #252538;
            --text-color: #cdd6f4;
            --accent-color: #89b4fa;
            --sub-accent: #a6e3a1;
            --border-color: #45475a;
            --nested-bg: #181825;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--panel-bg);
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 20;
        }

        .nav-home-link {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--bg-color);
            transition: all 0.2s ease;
        }

        .nav-home-link:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }

        .divider {
            color: var(--border-color);
            font-size: 18px;
        }

        .btn {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .btn:hover { opacity: 0.9; }
        
        .btn-secondary {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-navigation {
            background-color: var(--sub-accent);
            color: var(--bg-color);
        }

        select, input[type="file"] {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            outline: none;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        #sidebar {
            width: 380px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 15px;
            overflow-y: auto;
            z-index: 10;
        }

        .creator-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.6;
            margin-top: 5px;
        }

        .category-creator {
            display: flex;
            gap: 8px;
        }

        .category-creator input {
            flex: 1;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px;
            border-radius: 4px;
        }

        .category-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .category-zone {
            background-color: var(--bg-color);
            border: 2px dashed var(--border-color);
            border-radius: 6px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .category-zone.active-view {
            border-color: var(--sub-accent);
            background-color: rgba(166, 227, 161, 0.05);
        }

        .category-zone.drag-over {
            border-color: var(--accent-color);
            background-color: rgba(137, 180, 250, 0.05);
        }

        .category-title {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }

        .category-count {
            font-size: 12px;
            opacity: 0.6;
        }

        .inspect-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 8px;
        }

        .inspect-card {
            background-color: var(--nested-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: max-height 0.2s ease;
        }

        .inspect-card-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .inspect-card.expanded .inspect-card-text {
            white-space: normal;
            word-break: break-word;
        }

        .inspect-card-subtag {
            font-size: 10px;
            color: var(--sub-accent);
            margin-top: 4px;
            font-style: italic;
        }

        #canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background-color: #181825;
        }

        #canvas-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: 0 0;
        }

        .floating-node {
            position: absolute;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px 15px;
            border-radius: 20px;
            cursor: grab;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            font-size: 13px;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            z-index: 5;
        }

        .floating-node.sub-node {
            border-color: var(--sub-accent);
        }

        .floating-node.expanded {
            max-width: 400px;
            white-space: normal;
            word-break: break-word;
            border-radius: 12px;
            z-index: 10;
        }

        .stats-banner {
            font-size: 13px;
            opacity: 0.7;
            margin-left: auto;
        }

        .zoom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 5px;
            z-index: 15;
            background-color: var(--panel-bg);
            padding: 5px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .zoom-btn {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="nav-home-link">⌂ Home</a>
        <span class="divider">|</span>
        
        <button class="btn btn-secondary" id="back-to-root-btn" style="display:none;">← Back to Root</button>
        <span id="current-view-title" style="font-weight: bold; font-size: 16px;">Root Workspace</span>
        <input type="file" id="csv-file" accept=".csv">
        <div>
            <select id="view-variable" disabled><option>Upload CSV</option></select>
        </div>
        <button class="btn btn-secondary" id="reshuffle-btn" disabled>Reshuffle</button>
        <button class="btn" id="export-btn" disabled>Export CSV</button>
        <div class="stats-banner" id="stats-display">Remaining: 0 | Grouped: 0</div>
    </header>

    <div class="main-container">
        <div id="sidebar">
            <h3 id="sidebar-context-title">Primary Categories</h3>
            
            <div id="primary-creator-block">
                <div class="creator-title">Add Primary Category</div>
                <div class="category-creator">
                    <input type="text" id="new-group-name" placeholder="Name...">
                    <button class="btn" id="add-group-btn">+</button>
                </div>
            </div>

            <div id="subcategory-creator-block" style="display: none;">
                <div class="creator-title">Add Subcategory Here</div>
                <div class="category-creator">
                    <input type="text" id="new-subgroup-name" placeholder="Subname...">
                    <button class="btn btn-navigation" id="add-subgroup-btn">+</button>
                </div>
            </div>

            <div class="category-list" id="category-list"></div>
        </div>

        <div id="canvas-container">
            <div id="canvas-stage"></div>
            <div class="zoom-controls">
                <button class="zoom-btn" id="zoom-out">-</button>
                <button class="zoom-btn" id="zoom-reset">100%</button>
                <button class="zoom-btn" id="zoom-in">+</button>
            </div>
        </div>
    </div>

    <script>
        let dataset = [];
        let headers = [];
        let floatingItems = [];
        let displayVariable = '';
        const POOL_SIZE = 20;
        
        let currentWorkspace = 'root';
        const categories = new Set();
        const subcategories = {};

        let zoomScale = 1;
        const MIN_ZOOM = 0.4;
        const MAX_ZOOM = 2.0;

        const csvSplitter = /,(?=(?:(?:[^"]*"){2})*[^"]*$)/;

        const fileInput = document.getElementById('csv-file');
        const viewSelect = document.getElementById('view-variable');
        const reshuffleBtn = document.getElementById('reshuffle-btn');
        const exportBtn = document.getElementById('export-btn');
        const canvasContainer = document.getElementById('canvas-container');
        const canvasStage = document.getElementById('canvas-stage');
        const categoryList = document.getElementById('category-list');
        const addGroupBtn = document.getElementById('add-group-btn');
        const addSubgroupBtn = document.getElementById('add-subgroup-btn');
        const newGroupName = document.getElementById('new-group-name');
        const newSubgroupName = document.getElementById('new-subgroup-name');
        const statsDisplay = document.getElementById('stats-display');
        const backToRootBtn = document.getElementById('back-to-root-btn');
        const currentViewTitle = document.getElementById('current-view-title');

        const speedMultiplier = 0.4;

        fileInput.addEventListener('change', handleFileUpload);
        viewSelect.addEventListener('change', (e) => { displayVariable = e.target.value; updateFloatingLabels(); updateUI(); });
        reshuffleBtn.addEventListener('click', () => { clearFloatingPool(); populateFloatingPool(); });
        addGroupBtn.addEventListener('click', generatePrimaryCategory);
        addSubgroupBtn.addEventListener('click', generateSubcategory);
        exportBtn.addEventListener('click', exportProcessedCSV);
        backToRootBtn.addEventListener('click', navigateToRoot);

        canvasContainer.addEventListener('wheel', handleWheelZoom, { passive: false });
        document.getElementById('zoom-in').addEventListener('click', () => adjustZoom(0.1));
        document.getElementById('zoom-out').addEventListener('click', () => adjustZoom(-0.1));
        document.getElementById('zoom-reset').addEventListener('click', () => { zoomScale = 1; applyZoomTransform(); });

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => processCSVData(ev.target.result);
            reader.readAsText(file);
        }

        function processCSVData(text) {
            const lines = text.split(/\r?\n/).map(row => row.trim()).filter(row => row.length > 0);
            if (lines.length < 2) return;

            headers = lines[0].split(csvSplitter).map(h => h.replace(/^["']|["']$/g, '').trim());
            dataset = lines.slice(1).map((row, index) => {
                const values = row.split(csvSplitter);
                const item = { _id: index, assigned_group: '', assigned_subcategory: '' };
                headers.forEach((header, i) => {
                    let val = values[i] ? values[i].trim() : '';
                    item[header] = val.replace(/^["']|["']$/g, '').replace(/""/g, '"');
                });
                return item;
            });

            displayVariable = headers[0];
            viewSelect.innerHTML = '';
            headers.forEach(h => {
                const opt = document.createElement('option');
                opt.value = h; opt.textContent = h; viewSelect.appendChild(opt);
            });

            viewSelect.disabled = reshuffleBtn.disabled = exportBtn.disabled = false;
            navigateToRoot();
        }

        function populateFloatingPool() {
            let poolSource = [];
            
            if (currentWorkspace === 'root') {
                poolSource = dataset.filter(item => !item.assigned_group && !floatingItems.some(f => f._id === item._id));
            } else {
                poolSource = dataset.filter(item => item.assigned_group === currentWorkspace && !item.assigned_subcategory && !floatingItems.some(f => f._id === item._id));
            }

            while (floatingItems.length < POOL_SIZE && poolSource.length > 0) {
                const randomIndex = Math.floor(Math.random() * poolSource.length);
                const item = poolSource.splice(randomIndex, 1)[0];
                
                item.x = Math.random() * ((canvasContainer.clientWidth / zoomScale) - 180);
                item.y = Math.random() * ((canvasContainer.clientHeight / zoomScale) - 50);
                item.vx = (Math.random() - 0.5) * 3 * speedMultiplier;
                item.vy = (Math.random() - 0.5) * 3 * speedMultiplier;
                
                floatingItems.push(item);
                createFloatingElementDOM(item);
            }
        }

        function createFloatingElementDOM(item) {
            const el = document.createElement('div');
            el.className = `floating-node ${currentWorkspace !== 'root' ? 'sub-node' : ''}`;
            el.id = `node-${item._id}`;
            el.textContent = item[displayVariable] || '(Empty)';
            el.draggable = true;
            el.style.left = `${item.x}px`;
            el.style.top = `${item.y}px`;

            el.addEventListener('click', () => {
                if (el.dataset.dragged === 'true') { el.dataset.dragged = 'false'; return; }
                const isExp = el.classList.contains('expanded');
                document.querySelectorAll('.floating-node').forEach(n => n.classList.remove('expanded'));
                if (!isExp) el.classList.add('expanded');
            });

            el.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', item._id);
                el.dataset.dragged = 'true';
                setTimeout(() => el.style.opacity = '0.4', 0);
            });

            el.addEventListener('dragend', () => el.style.opacity = '1');
            canvasStage.appendChild(el);
            item.domElement = el;
        }

        function generatePrimaryCategory() {
            const name = newGroupName.value.trim();
            if (!name || categories.has(name)) return;
            categories.add(name);
            subcategories[name] = new Set();
            newGroupName.value = '';
            updateUI();
        }

        function generateSubcategory() {
            const subName = newSubgroupName.value.trim();
            if (!subName || currentWorkspace === 'root' || subcategories[currentWorkspace].has(subName)) return;
            subcategories[currentWorkspace].add(subName);
            newSubgroupName.value = '';
            updateUI();
        }

        function assignItemToZone(itemId, groupTargetName) {
            const dataIndex = dataset.findIndex(item => item._id === itemId);
            if (dataIndex === -1) return;

            if (currentWorkspace === 'root') {
                dataset[dataIndex].assigned_group = groupTargetName;
            } else {
                dataset[dataIndex].assigned_subcategory = groupTargetName;
            }

            const floatIndex = floatingItems.findIndex(item => item._id === itemId);
            if (floatIndex !== -1) {
                if (floatingItems[floatIndex].domElement) floatingItems[floatIndex].domElement.remove();
                floatingItems.splice(floatIndex, 1);
            }
            populateFloatingPool();
            updateUI();
        }

        function navigateToCategory(catName) {
            currentWorkspace = catName;
            backToRootBtn.style.display = 'inline-block';
            currentViewTitle.textContent = `Category Workspace: ${catName}`;
            document.getElementById('primary-creator-block').style.display = 'none';
            document.getElementById('subcategory-creator-block').style.display = 'block';
            document.getElementById('sidebar-context-title').textContent = "Subcategories Menu";
            clearFloatingPool();
            populateFloatingPool();
            updateUI();
        }

        function navigateToRoot() {
            currentWorkspace = 'root';
            backToRootBtn.style.display = 'none';
            currentViewTitle.textContent = "Root Workspace";
            document.getElementById('primary-creator-block').style.display = 'block';
            document.getElementById('subcategory-creator-block').style.display = 'none';
            document.getElementById('sidebar-context-title').textContent = "Primary Categories";
            clearFloatingPool();
            populateFloatingPool();
            updateUI();
        }

        function updateUI() {
            categoryList.innerHTML = '';

            if (currentWorkspace === 'root') {
                categories.forEach(groupName => {
                    const matchedItems = dataset.filter(item => item.assigned_group === groupName);
                    const zone = document.createElement('div');
                    zone.className = 'category-zone';
                    zone.innerHTML = `
                        <div class="category-title">
                            <span>${groupName} ➔</span>
                            <span class="category-count">${matchedItems.length}</span>
                        </div>
                        <div class="inspect-container">
                            ${matchedItems.map(item => `
                                <div class="inspect-card" onclick="toggleInspectCard(event, this)">
                                    <div class="inspect-card-text">${item[displayVariable] || '(Empty)'}</div>
                                    ${item.assigned_subcategory ? `<div class="inspect-card-subtag">Sub: ${item.assigned_subcategory}</div>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    `;
                    
                    zone.addEventListener('click', (e) => {
                        if (!e.target.closest('.inspect-card')) navigateToCategory(groupName);
                    });
                    setupDragDropEvents(zone, groupName);
                    categoryList.appendChild(zone);
                });
            } else {
                const subSet = subcategories[currentWorkspace] || new Set();
                subSet.forEach(subName => {
                    const matchedSubItems = dataset.filter(item => item.assigned_group === currentWorkspace && item.assigned_subcategory === subName);
                    const zone = document.createElement('div');
                    zone.className = 'category-zone active-view';
                    zone.innerHTML = `
                        <div class="category-title">
                            <span>${subName}</span>
                            <span class="category-count">${matchedSubItems.length}</span>
                        </div>
                        <div class="inspect-container">
                            ${matchedSubItems.map(item => `
                                <div class="inspect-card" onclick="toggleInspectCard(event, this)">
                                    <div class="inspect-card-text">${item[displayVariable] || '(Empty)'}</div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    setupDragDropEvents(zone, subName);
                    categoryList.appendChild(zone);
                });
            }

            const totalGrouped = dataset.filter(item => item.assigned_group).length;
            statsDisplay.textContent = `Remaining: ${dataset.length - totalGrouped} | Grouped: ${totalGrouped}`;
        }

        function toggleInspectCard(event, cardElement) {
            event.stopPropagation();
            cardElement.classList.toggle('expanded');
        }

        function setupDragDropEvents(zone, targetName) {
            zone.addEventListener('dragover', (e) => { e.preventDefault(); zone.classList.add('drag-over'); });
            zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                zone.classList.remove('drag-over');
                const itemId = parseInt(e.dataTransfer.getData('text/plain'), 10);
                assignItemToZone(itemId, targetName);
            });
        }

        function updateFloatingLabels() {
            floatingItems.forEach(item => {
                if (item.domElement) item.domElement.textContent = item[displayVariable] || '(Empty)';
            });
        }

        function clearFloatingPool() {
            floatingItems.forEach(item => { if (item.domElement) item.domElement.remove(); });
            floatingItems = [];
        }

        function handleWheelZoom(e) { e.preventDefault(); adjustZoom(e.deltaY < 0 ? 0.05 : -0.05); }
        function adjustZoom(amount) { zoomScale = Math.min(Math.max(zoomScale + amount, MIN_ZOOM), MAX_ZOOM); applyZoomTransform(); }
        function applyZoomTransform() {
            canvasStage.style.transform = `scale(${zoomScale})`;
            document.getElementById('zoom-reset').textContent = `${Math.round(zoomScale * 100)}%`;
        }

        function physicsLoop() {
            if (floatingItems.length > 0) {
                const width = canvasContainer.clientWidth / zoomScale;
                const height = canvasContainer.clientHeight / zoomScale;
                floatingItems.forEach(item => {
                    if (!item.domElement) return;
                    item.x += item.vx; item.y += item.vy;
                    const r = item.domElement.getBoundingClientRect();
                    const w = r.width / zoomScale; const h = r.height / zoomScale;
                    if (item.x <= 0) { item.x = 0; item.vx *= -1; }
                    if (item.x + w >= width) { item.x = width - w; item.vx *= -1; }
                    if (item.y <= 0) { item.y = 0; item.vy *= -1; }
                    if (item.y + h >= height) { item.y = height - h; item.vy *= -1; }
                    item.domElement.style.left = `${item.x}px`; item.domElement.style.top = `${item.y}px`;
                });
            }
            requestAnimationFrame(physicsLoop);
        }
        requestAnimationFrame(physicsLoop);

        function exportProcessedCSV() {
            if (dataset.length === 0) return;
            const outputHeaders = [...headers, 'assigned_group', 'assigned_subcategory'];
            const csvRows = [outputHeaders.join(',')];
            dataset.forEach(item => {
                const rowValues = outputHeaders.map(header => {
                    const value = item[header] !== undefined ? item[header] : '';
                    return `"${String(value).replace(/"/g, '""')}"`;
                });
                csvRows.push(rowValues.join(','));
            });
            const blob = new Blob([csvRows.join("\n")], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", "nested_grouped_output.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
