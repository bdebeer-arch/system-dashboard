<script>
  let currentSchedule = null;
  const colorPalette = ['#3182ce', '#dd6b20', '#38a169', '#805ad5', '#d69e2e', '#e53e3e', '#319795', '#d6bcfa'];

  document.getElementById('csvInput').addEventListener('input', function() {
    localStorage.setItem('schola_csv_v22', this.value);
  });

  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('schola_csv_v22');
    if (saved) document.getElementById('csvInput').value = saved;
    generateDemandMatrix();
  });

  function getBounds() {
    return {
      min: parseInt(document.getElementById('minInput').value) || 6,
      opt: parseInt(document.getElementById('optInput').value) || 16,
      max: parseInt(document.getElementById('maxInput').value) || 21
    };
  }

  // Robust Parser handling unformatted, concatenated streams and Excel errors
  function parseCSV(text) {
    // 1. Sanitize Excel Formula Errors
    let cleanText = text.replace(/#VALUE!|#N\/A|#REF!|#NAME\?/g, ' ');
    
    // 2. Identify individual student entry boundaries using Name + Tihoi Term pattern
    const studentEntries = cleanText.split(/(?=[A-Z][a-z]+(?:[A-Z][a-z]+)+[1-3])/g);
    const parsedStudents = [];

    studentEntries.forEach(entry => {
      const trimmed = entry.trim();
      if (!trimmed) return;

      // Match: Name, Tihoi Term (1-3), and all 5-6 character Subject Codes
      const match = trimmed.match(/^([A-Za-z\s-]+?)([1-3])((?:[0-9]?[A-Z]{2,4}[0-9]?)+)$/);
      
      if (match) {
        const studentName = match[1].trim();
        const tihoiTerm = match[2];
        const rawSubjects = match[3];
        
        // Extract individual subject codes (e.g., 10ATD1, 10ENT1, 910TE1)
        const subjects = rawSubjects.match(/(?:10|910|[A-Z]{3})[A-Z0-9]+/g) || [];

        if (studentName && subjects.length > 0) {
          parsedStudents.push({
            id: studentName,
            tihoi: tihoiTerm,
            subjects: subjects
          });
        }
      } else {
        // Fallback for standard CSV/Tab delimited rows
        const parts = trimmed.split(/[\t,]+/).map(s => s.trim()).filter(s => s.length > 0);
        if (parts.length >= 3) {
          const studentName = `${parts[0]} ${parts[1]}`.replace(/[0-9]/g, '').trim();
          const tihoiTerm = parts[2].replace(/\D/g, '') || "1";
          const subjects = parts.slice(3).filter(s => !s.includes('#'));
          parsedStudents.push({ id: studentName, tihoi: tihoiTerm, subjects: subjects });
        }
      }
    });

    return parsedStudents;
  }

  function extractTihoiTerm(tihoiVal) {
    if (!tihoiVal) return "1";
    const cleaned = tihoiVal.toString().replace(/\D/g, '');
    return (cleaned === "1" || cleaned === "2" || cleaned === "3") ? cleaned : "1";
  }

  function isEnterpriseSubject(subj) {
    return /10ent|ent1/i.test(subj);
  }

  // STEP 1: PRE-SORT ON-CAMPUS DEMAND (Strict 2-Choice Load Balancing per Active Term)
  function generateDemandMatrix() {
    const students = parseCSV(document.getElementById('csvInput').value);
    const demandPerThird = { "Third 1": {}, "Third 2": {}, "Third 3": {} };

    students.forEach(st => {
      const tNum = extractTihoiTerm(st.tihoi);
      const tihoiThird = `Third ${tNum}`;
      const availThirds = ["Third 1", "Third 2", "Third 3"].filter(t => t !== tihoiThird);

      const load = {};
      availThirds.forEach(t => load[t] = 0);

      const validSubjects = st.subjects.filter(s => s.toLowerCase() !== 'tihoi').slice(0, 4);

      validSubjects.forEach(subj => {
        // Distribute choices 2:2 evenly across the two available terms
        const targetThird = availThirds.sort((a, b) => load[a] - load[b])[0];
        load[targetThird]++;
        demandPerThird[targetThird][subj] = (demandPerThird[targetThird][subj] || 0) + 1;
      });
    });

    renderPieCharts(demandPerThird);
  }

  function renderPieCharts(demandPerThird) {
    const out = document.getElementById('demandOutput');
    let html = '';

    for (let t = 1; t <= 3; t++) {
      const tKey = `Third ${t}`;
      const thirdData = demandPerThird[tKey];
      const totalRequests = Object.values(thirdData).reduce((a, b) => a + b, 0);

      html += `<div class="third-card"><h3>${tKey} <span style="font-size:0.8rem; color:var(--text-muted);">(${totalRequests} Total Choices)</span></h3>`;

      if (totalRequests === 0) {
        html += `<p style="font-size:0.8rem; color:var(--text-muted);">No on-campus elective requests parsed.</p>`;
      } else {
        let cumulativePercent = 0;
        let svgSlices = '';
        let legendHTML = '<div class="chart-legend">';

        const sortedSubjects = Object.keys(thirdData).sort();

        sortedSubjects.forEach((subj, i) => {
          const count = thirdData[subj];
          const percent = count / totalRequests;
          const color = colorPalette[i % colorPalette.length];

          const strokeDash = `${percent * 100} 100`;
          const strokeOffset = -cumulativePercent * 100;

          svgSlices += `<circle cx="21" cy="21" r="15.91549430918954" fill="transparent" 
            stroke="${color}" stroke-width="8" 
            stroke-dasharray="${strokeDash}" stroke-dashoffset="${strokeOffset}">
            <title>${subj}: ${count} choices (${Math.round(percent * 100)}%)</title>
          </circle>`;

          cumulativePercent += percent;

          legendHTML += `
            <div class="legend-item">
              <span><span class="legend-color" style="background:${color};"></span><strong>${subj}</strong></span>
              <span>${count} choices</span>
            </div>`;
        });

        legendHTML += '</div>';

        html += `
          <div class="pie-container">
            <svg viewBox="0 0 42 42">
              ${svgSlices}
            </svg>
          </div>
          ${legendHTML}`;
      }

      html += `</div>`;
    }

    out.innerHTML = html;
    document.getElementById('step1Card').style.display = 'block';
  }

  // STEP 2: TWO-PASS LOCAL SEARCH WITH PER-THIRD VIABILITY PRUNING
  function executeLineSorting() {
    const bounds = getBounds();
    const students = parseCSV(document.getElementById('csvInput').value);
    
    // Assign Lines (Alternating subjects across Line 1 and Line 2)
    const allSubjects = new Set();
    students.forEach(st => st.subjects.forEach(s => { if(s.toLowerCase() !== 'tihoi') allSubjects.add(s); }));
    const sortedSubjects = Array.from(allSubjects).sort();
    const fixedLine = {};
    sortedSubjects.forEach((s, idx) => fixedLine[s] = (idx % 2 === 0) ? "Line 1" : "Line 2");

    const schedule = {
      "Third 1": { "Line 1": {}, "Line 2": {} },
      "Third 2": { "Line 1": {}, "Line 2": {} },
      "Third 3": { "Line 1": {}, "Line 2": {} }
    };

    // PASS 1: Balanced Initial Allocation
    students.forEach(st => {
      const tNum = extractTihoiTerm(st.tihoi);
      const tihoiThird = `Third ${tNum}`;
      const availThirds = ["Third 1", "Third 2", "Third 3"].filter(t => t !== tihoiThird);

      const termLoad = {};
      availThirds.forEach(t => termLoad[t] = 0);

      const validChoices = st.subjects.filter(s => s.toLowerCase() !== 'tihoi').slice(0, 4);

      validChoices.forEach(subj => {
        const targetThird = availThirds.sort((a, b) => termLoad[a] - termLoad[b])[0];
        termLoad[targetThird]++;

        const line = fixedLine[subj] || "Line 1";
        if (!schedule[targetThird][line][subj]) schedule[targetThird][line][subj] = [];
        schedule[targetThird][line][subj].push(st.id);
      });
    });

    // PASS 2: Local Search Viability Pruning per Third
    for (const [thirdName, lines] of Object.entries(schedule)) {
      for (const [lineName, classes] of Object.entries(lines)) {
        for (const [subj, roster] of Object.entries(classes)) {
          // Check localized section viability
          if (roster.length > 0 && roster.length < bounds.min) {
            const strandedStudents = [...roster];
            classes[subj] = []; // Collapse unviable local section

            // Reallocate stranded students to an alternative viable Third
            strandedStudents.forEach(stId => {
              const stObj = students.find(s => s.id === stId);
              const tNum = extractTihoiTerm(stObj.tihoi);
              const altThirds = ["Third 1", "Third 2", "Third 3"].filter(t => t !== `Third ${tNum}` && t !== thirdName);
              
              let reallocated = false;
              for (const altT of altThirds) {
                if (schedule[altT][lineName][subj]) {
                  schedule[altT][lineName][subj].push(stId);
                  reallocated = true;
                  break;
                }
              }
              // Fallback: Retain in section if no alternate viable option exists
              if (!reallocated) classes[subj].push(stId);
            });
          }
        }
      }
    }

    currentSchedule = schedule;
    renderStep2(schedule, bounds);
  }

  function renderStep2(schedule, bounds) {
    const out = document.getElementById('allocationOutput');
    let html = '';

    for (const [thirdName, lines] of Object.entries(schedule)) {
      html += `<div style="margin-bottom:20px;">`;
      html += `<h3 style="color:#2b6cb0; border-bottom:1px solid #cbd5e0; padding-bottom:4px; margin-bottom:10px;">${thirdName}</h3>`;
      html += `<div class="third-grid">`;

      for (const [lineName, classes] of Object.entries(lines)) {
        html += `<div class="line-box">`;
        html += `<h4>${lineName}</h4>`;

        const activeClasses = Object.keys(classes).filter(k => classes[k].length > 0);
        if (activeClasses.length === 0) {
          html += `<p style="font-size:0.8rem; color:var(--text-muted);">No active classes assigned to this line.</p>`;
        } else {
          for (const subj of activeClasses) {
            const roster = classes[subj];
            let badgeStyle = "badge";
            if (isEnterpriseSubject(subj)) badgeStyle += " badge-ent";

            let count = roster.length;
            let metricClass = "metric-good";
            let statusText = `${count} Enrolled`;

            if (count < bounds.min && count > 0) {
              metricClass = "metric-danger";
              statusText = `${count} (Below Min ${bounds.min})`;
            } else if (count > bounds.max) {
              metricClass = "metric-warn";
              statusText = `${count} (Exceeds Max ${bounds.max})`;
            }

            html += `<div style="margin-bottom:8px; padding-bottom:6px; border-bottom:1px dashed #e2e8f0;">`;
            html += `<div><span class="${badgeStyle}">${subj}</span> <span class="metric-pill ${metricClass}">${statusText}</span></div>`;
            html += `<div style="margin-top:4px;">`;
            roster.forEach(st => html += `<span class="student-tag">${st}</span>`);
            html += `</div></div>`;
          }
        }

        html += `</div>`;
      }
      html += `</div></div>`;
    }

    out.innerHTML = html;
    document.getElementById('step2Card').style.display = 'block';
  }

  function exportToCSV() {
    if (!currentSchedule) return;

    let csvContent = "data:text/csv;charset=utf-8,Third,Line,Subject,Student Full Name\n";

    for (const [thirdName, lines] of Object.entries(currentSchedule)) {
      for (const [lineName, classes] of Object.entries(lines)) {
        for (const [subj, roster] of Object.entries(classes)) {
          if (roster.length > 0) {
            roster.forEach(studentId => {
              csvContent += `"${thirdName}","${lineName}","${subj}","${studentId}"\n`;
            });
          }
        }
      }
    }

    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "Schola_Matrix_Optimised_Rosters.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>
