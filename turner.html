<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Turner | Study Assistant</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f7f6; color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #2c3e50; }
        .input-group { margin-bottom: 1rem; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 0.5rem; font-size: 0.9rem; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 1.5rem; }
        button { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
        .btn-start { background: #27ae60; color: white; grid-column: span 2; }
        .btn-pause { background: #f39c12; color: white; }
        .btn-pip { background: #3498db; color: white; }
        .display { margin-top: 2rem; padding: 1rem; border-top: 2px solid #eee; }
        #timer-text { font-size: 2.5rem; font-weight: bold; margin: 10px 0; }
        #phase-icon { font-size: 3rem; }
        #status-text { font-style: italic; color: #7f8c8d; }
        canvas, video { display: none; } /* Hidden helpers for PiP */
    </style>
</head>
<body>

<div class="container">
    <h1>Page Turner</h1>
    
    <div class="input-group">
        <label for="pages">Total Pages</label>
        <input type="number" id="pages" value="10" min="1">
    </div>
    
    <div class="input-group">
        <label for="minutes">Total Time (Minutes)</label>
        <input type="number" id="minutes" value="30" min="1">
    </div>

    <button class="btn-start" onclick="startSession()">Start Study Session</button>

    <div class="display" id="display-area" style="display:none;">
        <div id="phase-icon">📖</div>
        <div id="status-text">Ready to Read</div>
        <div id="timer-text">00:00</div>
        <div class="controls">
            <button class="btn-pause" id="pauseBtn" onclick="togglePause()">Pause</button>
            <button class="btn-pip" onclick="togglePiP()">Floating View (PiP)</button>
        </div>
    </div>
</div>

<canvas id="pipCanvas" width="200" height="200"></canvas>
<video id="pipVideo" autoplay muted playsinline></video>

<script>
    let timer;
    let timeLeft;
    let isPaused = false;
    let currentPhase = 'read'; // 'read' or 'reflect'
    let currentPage = 1;
    let totalPages;
    let timePerPagePhase;

    const canvas = document.getElementById('pipCanvas');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('pipVideo');

    function startSession() {
        totalPages = parseInt(document.getElementById('pages').value);
        const totalMinutes = parseInt(document.getElementById('minutes').value);
        
        // Calculate time per phase (half of the time per page)
        timePerPagePhase = Math.floor((totalMinutes * 60) / (totalPages * 2));
        
        timeLeft = timePerPagePhase;
        currentPage = 1;
        currentPhase = 'read';
        isPaused = false;
        
        document.getElementById('display-area').style.display = 'block';
        updateUI();
        runTimer();
    }

    function runTimer() {
        clearInterval(timer);
        timer = setInterval(() => {
            if (!isPaused) {
                timeLeft--;
                if (timeLeft <= 0) {
                    nextPhase();
                }
                updateUI();
                updatePiPCanvas();
            }
        }, 1000);
    }

    function nextPhase() {
        if (currentPhase === 'read') {
            currentPhase = 'reflect';
            playSound('gong');
        } else {
            if (currentPage < totalPages) {
                currentPage++;
                currentPhase = 'read';
                playSound('whistle');
            } else {
                finishSession();
                return;
            }
        }
        timeLeft = timePerPagePhase;
    }

    function updateUI() {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        document.getElementById('timer-text').innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
        
        const icon = currentPhase === 'read' ? '📖' : '💡';
        const label = currentPhase === 'read' ? `Reading Page ${currentPage}` : `Reflecting/Summarising`;
        
        document.getElementById('phase-icon').innerText = icon;
        document.getElementById('status-text').innerText = label;
    }

    function togglePause() {
        isPaused = !isPaused;
        document.getElementById('pauseBtn').innerText = isPaused ? 'Resume' : 'Pause';
    }

    function finishSession() {
        clearInterval(timer);
        alert("Session Complete! Great work.");
    }

    // Audio Synthesis (No files needed)
    function playSound(type) {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'whistle') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
        } else { // Gong
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
        }

        osc.start();
        osc.stop(audioCtx.currentTime + (type === 'whistle' ? 0.2 : 1));
    }

    // PiP Logic
    async function togglePiP() {
        try {
            if (document.pictureInPictureElement) {
                await document.exitPictureInPicture();
            } else {
                const stream = canvas.captureStream();
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                    video.requestPictureInPicture();
                };
            }
        } catch (err) {
            console.error("PiP failed", err);
        }
    }

    function updatePiPCanvas() {
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.font = "80px serif";
        ctx.textAlign = "center";
        const icon = currentPhase === 'read' ? '📖' : '💡';
        ctx.fillText(icon, 100, 100);
        
        ctx.fillStyle = "black";
        ctx.font = "30px Arial";
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        ctx.fillText(`${mins}:${secs.toString().padStart(2, '0')}`, 100, 150);
        
        ctx.font = "16px Arial";
        ctx.fillText(`Page ${currentPage}`, 100, 180);
    }
</script>

</body>
</html>
