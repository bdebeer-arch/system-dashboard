<div class="display-active" id="display-area" style="display:none;">
    <div id="phase-icon">📖</div>
    <div id="status-text">Scanning Page 1</div>
    <div id="timer-text">00:00</div>
    
    <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
        <button class="btn-pip" id="mainPauseBtn" onclick="togglePause()" style="background: var(--primary-brown); color: white; border: none;">Pause</button>
        <button class="btn-pip" onclick="togglePiP()">Toggle Mini-View</button>
    </div>
</div>

<script>
    let timer, timeLeft, isPaused = false, currentPhase = 'read', currentPage = 1, endPage = 1, timePerPagePhase;
    const canvas = document.getElementById('pipCanvas'), ctx = canvas.getContext('2d'), video = document.getElementById('pipVideo');

    function startSession() {
        const sVal = document.getElementById('startPage').value;
        const eVal = document.getElementById('endPage').value;
        const mVal = document.getElementById('minutes').value;

        currentPage = sVal ? parseInt(sVal) : 1;
        endPage = eVal ? parseInt(eVal) : (currentPage + 9);
        const totalPages = (endPage - currentPage) + 1;

        if (totalPages <= 0) {
            alert("Check your page range."); return;
        }

        timePerPagePhase = Math.floor((parseInt(mVal) * 60) / (totalPages * 2));
        timeLeft = timePerPagePhase;
        isPaused = false;
        
        document.getElementById('setup-ui').style.display = 'none';
        document.getElementById('display-area').style.display = 'block';
        updateUI();
        setupMediaSession();
        runTimer();
    }

    function runTimer() {
        clearInterval(timer);
        timer = setInterval(() => {
            if (!isPaused) {
                timeLeft--;
                if (timeLeft <= 0) nextPhase();
                updateUI();
                updatePiPCanvas();
            }
        }, 1000);
    }

    function togglePause() {
        isPaused = !isPaused;
        const btn = document.getElementById('mainPauseBtn');
        btn.innerText = isPaused ? "Resume" : "Pause";
        btn.style.background = isPaused ? "#7f8c8d" : "var(--primary-brown)";
        updateUI();
        updatePiPCanvas();
    }

    function nextPhase() {
        if (currentPhase === 'read') {
            currentPhase = 'reflect';
            playSound('gong');
        } else {
            if (currentPage < endPage) {
                currentPage++;
                currentPhase = 'read';
                playSound('whistle');
            } else {
                alert("Session Finished.");
                location.reload();
            }
        }
        timeLeft = timePerPagePhase;
    }

    function updateUI() {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        document.getElementById('timer-text').innerText = isPaused ? "PAUSED" : `${mins}:${secs.toString().padStart(2, '0')}`;
        document.getElementById('phase-icon').innerText = currentPhase === 'read' ? '📖' : '💡';
        document.getElementById('status-text').innerText = isPaused ? "System Halted" : (currentPhase === 'read' ? `Scanning Page ${currentPage}` : `Synthesising...`);
    }

    function updatePiPCanvas() {
        // Darker, more discrete background for PiP
        ctx.fillStyle = "#2D1B17"; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Smaller Icon
        ctx.font = "60px serif"; ctx.textAlign = "center";
        ctx.fillText(isPaused ? "⏸" : (currentPhase === 'read' ? '📖' : '💡'), 100, 80);
        
        // Compact Timer
        ctx.fillStyle = "white"; 
        ctx.font = "bold 32px Arial";
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        const timeStr = isPaused ? "PAUSE" : `${mins}:${secs.toString().padStart(2, '0')}`;
        ctx.fillText(timeStr, 100, 130);
        
        // Footer tag
        ctx.font = "600 12px Arial"; 
        ctx.fillStyle = "#A1887F";
        ctx.fillText(`PG ${currentPage} of ${endPage}`, 100, 170);
    }

    // Allows Hardware Media Keys (Pause/Play) to control the app
    function setupMediaSession() {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.setActionHandler('play', togglePause);
            navigator.mediaSession.setActionHandler('pause', togglePause);
        }
    }

    // Keyboard Shortcut (Spacebar)
    window.addEventListener('keydown', (e) => {
        if (e.code === "Space" && document.getElementById('display-area').style.display !== 'none') {
            e.preventDefault();
            togglePause();
        }
    });

    async function togglePiP() {
        try {
            const stream = canvas.captureStream();
            video.srcObject = stream;
            video.onloadedmetadata = () => { video.play(); video.requestPictureInPicture(); };
        } catch (err) { console.error("PiP error", err); }
    }

    function playSound(type) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'whistle') {
                osc.frequency.setValueAtTime(850, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1250, audioCtx.currentTime + 0.1);
            } else {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
            }
            osc.start(); osc.stop(audioCtx.currentTime + (type === 'whistle' ? 0.2 : 1.5));
        } catch(e) {}
    }
</script>
