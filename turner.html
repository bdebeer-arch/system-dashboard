<div id="setup-ui">
    <div class="input-grid" style="grid-template-columns: 1fr 1fr 1fr;">
        <div class="input-group">
            <label>Start Page</label>
            <input type="number" id="startPage" placeholder="1">
        </div>
        <div class="input-group">
            <label>End Page</label>
            <input type="number" id="endPage" placeholder="10">
        </div>
        <div class="input-group">
            <label>Minutes</label>
            <input type="number" id="minutes" value="30">
        </div>
    </div>
    <button class="btn-start" onclick="startSession()">Initialise Session</button>

    <div class="pedagogy-note">
        <b>Why tag & parse?</b><br>
        Defining a specific range allows for <i>targeted cognitive mapping</i>. By scanning the range first, you identify the structural scaffolding of the specific information you need before committing to a deep read.
    </div>
</div>

<script>
    let timer, timeLeft, isPaused = false, currentPhase = 'read', currentPage = 1, endPage = 1, timePerPagePhase;
    const canvas = document.getElementById('pipCanvas'), ctx = canvas.getContext('2d'), video = document.getElementById('pipVideo');

    function startSession() {
        const startInput = document.getElementById('startPage').value;
        const endInput = document.getElementById('endPage').value;
        const minsInput = document.getElementById('minutes').value;

        // Logic: Default to 1 if start is empty
        currentPage = startInput ? parseInt(startInput) : 1;
        endPage = endInput ? parseInt(endInput) : currentPage + 9; // Default 10 page spread if end is empty
        
        const totalPages = (endPage - currentPage) + 1;

        if (totalPages <= 0) {
            alert("End page must be greater than or equal to start page.");
            return;
        }

        timePerPagePhase = Math.floor((parseInt(minsInput) * 60) / (totalPages * 2));
        timeLeft = timePerPagePhase;
        
        document.getElementById('setup-ui').style.display = 'none';
        document.getElementById('display-area').style.display = 'block';
        updateUI();
        runTimer();
    }

    // Update UI Function to show current page in range
    function updateUI() {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        document.getElementById('timer-text').innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
        document.getElementById('phase-icon').innerText = currentPhase === 'read' ? '📖' : '💡';
        document.getElementById('status-text').innerText = currentPhase === 'read' ? `Scanning Page ${currentPage}` : `Synthesising...`;
    }

    function nextPhase() {
        if (currentPhase === 'read') {
            currentPhase = 'reflect';
            playSound('gong');
        } else {
            if (currentPage < endPage) {
                currentPage++;
                currentPhase = 'read';
                playSound('whistle');
            } else {
                alert("Range Complete. Session finished.");
                location.reload();
            }
        }
        timeLeft = timePerPagePhase;
    }

    // ... (Keep existing playSound, togglePiP, and updatePiPCanvas functions)
</script>
