<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Labeler | Byron</title>

    <style>
        :root {
            --primary-blue: #0047ab;
            --bg-gray: #f4f7f6;
            --card-white: #ffffff;
            --edit-highlight: #fff9db;
            --error-gray: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            padding: 0;
        }

        /* NAVIGATION */
        nav {
            padding: 15px 20px;
            background: var(--card-white);
            border-bottom: 1px solid #ddd;
        }

        nav a {
            text-decoration: none;
            color: var(--primary-blue);
            font-weight: 600;
            font-size: 14px;
        }

        /* COMPACT CONTROLS */
        .controls-wrapper {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #ddd;
            transition: all 0.3s ease;
            max-height: 180px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        .controls-wrapper:not(:hover):not(:focus-within) {
            max-height: 12px;
            opacity: 0.3;
            padding: 5px 15px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: monospace;
            box-sizing: border-box;
            max-width: 1200px;
            display: block;
            margin: 0 auto;
        }

        /* MASONRY GRID */
        #imageGallery {
            columns: 4 280px;
            column-gap: 20px;
            padding: 30px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .image-card {
            break-inside: avoid;
            margin-bottom: 20px;
            background: var(--card-white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: transform 0.2s;
            cursor: grab;
            display: inline-block;
            width: 100%;
        }

        .image-card img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
            background: var(--error-gray);
            min-height: 120px;
        }

        .label-tag {
            padding: 15px;
            background: #fff;
            color: #2c3e50;
            font-weight: 600;
            text-align: center;
            outline: none;
            cursor: text;
            border-top: 1px solid #f0f0f0;
        }

        .label-tag:focus {
            background: var(--edit-highlight);
        }

        .dragging {
            opacity: 0.3;
            transform: scale(0.95);
        }
    </style>
</head>

<body>

<nav>
    <a href="index.html">&larr; Return to Dashboard</a>
</nav>

<div class="controls-wrapper">
    <textarea id="urlInput" placeholder="Paste Google Drive or Image URLs here..."></textarea>
</div>

<header style="text-align:center; padding-top: 20px;">
    <h1 style="color: var(--primary-blue); font-weight: 300;">Gallery Labeler</h1>
</header>

<div id="imageGallery"></div>

<script>
    const urlInput = document.getElementById('urlInput');
    const gallery = document.getElementById('imageGallery');

    const demoUrls = [
        "https://drive.google.com/file/d/18nKe1S8CMbKP2vEw9mwnG0MB_eKD-biO",
        "https://drive.google.com/file/d/1EdWyzszNrCm8g11ob_bM267yx7_12haA",
        "https://drive.google.com/file/d/1qICPO_qrSCl8awCm222usel5Awwfyidw",
        "https://drive.google.com/file/d/19aoeZL_t0oTfkOSYGorDZb3ECZQGqwW0",
        "https://drive.google.com/file/d/1X0M-Hc4uSEtuJC0tyNTLP3-fKIjx-gNx"
    ];

    function cleanLink(url) {
        if (url.includes('drive.google.com')) {
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000`;
            }
        }

        if (url.includes('wikia.nocookie.net')) {
            return url.split('/revision/')[0];
        }

        return url;
    }


    function renderGallery() {
        const rawText = urlInput.value.trim();
        const sourceList = rawText
            ? rawText.split('\n').map(u => u.trim()).filter(Boolean)
            : demoUrls;

        gallery.innerHTML = '';

        sourceList.forEach(url => {
            const finalUrl = cleanLink(url);

            const card = document.createElement('div');
            card.className = 'image-card';
            card.draggable = true;

            card.innerHTML = `
                <img src="${finalUrl}" loading="lazy"
                     onerror="this.onerror=null;
                       this.src='fallback.png';
                       this.style.opacity='0.6';">
                <div class="label-tag" contenteditable="true" spellcheck="false">Name</div>
            `;

            card.addEventListener('dragstart', () => card.classList.add('dragging'));
            card.addEventListener('dragend', () => card.classList.remove('dragging'));

            gallery.appendChild(card);
        });
    }

    // Drag-and-drop reflow logic
    gallery.addEventListener('dragover', e => {
        e.preventDefault();
        const draggable = document.querySelector('.dragging');
        if (!draggable) return;

        const afterElement = [...gallery.querySelectorAll('.image-card:not(.dragging)')]
            .find(child => {
                const box = child.getBoundingClientRect();
                return e.clientY < box.top + box.height / 2;
            });

        if (afterElement == null) {
            gallery.appendChild(draggable);
        } else {
            gallery.insertBefore(draggable, afterElement);
        }
    });

    urlInput.addEventListener('input', renderGallery);
    window.addEventListener('load', renderGallery);
</script>

</body>
</html>
