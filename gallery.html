<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Resource Portal | Byron</title>
    <style>
        :root {
            --primary-blue: #0047ab;
            --bg-gray: #f0f2f5;
            --panel-white: rgba(255, 255, 255, 0.98);
            --success-green: #27ae60;
            --edit-highlight: #fff9db;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-gray);
            margin: 0; padding: 0;
        }

        /* COLLAPSIBLE PANEL */
        .controls-wrapper {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--panel-white);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #ddd;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            max-height: 500px;
            opacity: 1;
            overflow: hidden;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .controls-wrapper:not(:hover):not(:focus-within) {
            max-height: 15px;
            opacity: 0.4;
            padding: 8px 20px;
            cursor: pointer;
        }

        .controls-wrapper:not(:hover):not(:focus-within)::after {
            content: "↓ HOVER TO EDIT OR DOWNLOAD DATA ↓";
            display: block;
            text-align: center;
            font-size: 10px;
            letter-spacing: 1px;
            color: var(--primary-blue);
            font-weight: bold;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        textarea {
            width: 100%; height: 100px;
            padding: 10px; border: 1px solid #ccc;
            border-radius: 6px; font-family: monospace;
            box-sizing: border-box;
            background: #fff;
        }

        .button-row {
            grid-column: span 2;
            text-align: right;
            margin-top: 10px;
        }

        .btn-download {
            background-color: var(--success-green);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* GALLERY GRID */
        #imageGallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
            padding: 40px 20px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .image-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            position: relative;
            transition: transform 0.3s ease;
            cursor: grab;
        }

        .image-card:active { cursor: grabbing; }

        .image-card img {
            width: 100%; height: 220px;
            object-fit: cover; pointer-events: none;
        }

        /* CLICK-TO-EDIT LABEL */
        .label-tag {
            padding: 12px;
            background: #fff;
            color: #2c3e50;
            font-weight: 600;
            text-align: center;
            border-top: 1px solid #f0f0f0;
            outline: none;
            cursor: text; /* Indicates it can be typed in */
            transition: background 0.2s;
        }

        .label-tag:focus {
            background: var(--edit-highlight);
        }

        .label-tag:empty::before {
            content: "Click to add name...";
            color: #ccc;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="controls-wrapper">
    <div class="controls-grid">
        <div>
            <h4 style="margin:0 0 5px 0;">Image URLs</h4>
            <textarea id="urlInput" placeholder="Paste URLs here..."></textarea>
        </div>
        <div>
            <h4 style="margin:0 0 5px 0;">Student Labels (Editable below)</h4>
            <textarea id="labelInput" placeholder="Paste Names here..."></textarea>
        </div>
        <div class="button-row">
            <button class="btn-download" onclick="downloadData()">Download Current Configuration</button>
        </div>
    </div>
</div>

<div id="imageGallery"></div>

<script>
    const urlInput = document.getElementById('urlInput');
    const labelInput = document.getElementById('labelInput');
    const gallery = document.getElementById('imageGallery');

    const demoData = [
        { url: 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=500', label: 'Systems Innovation' },
        { url: 'https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=500', label: 'Collaborative Group' }
    ];

    function renderGallery() {
        gallery.innerHTML = '';
        const urls = urlInput.value.split('\n').map(u => u.trim()).filter(u => u);
        const labels = labelInput.value.split('\n').map(l => l.trim());

        const activeData = urls.length > 0 
            ? urls.map((url, i) => ({ url, label: labels[i] || "" }))
            : demoData;

        activeData.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'image-card';
            card.draggable = true;

            // Label is now 'contenteditable'
            card.innerHTML = `
                <img src="${item.url}">
                <div class="label-tag" contenteditable="true" spellcheck="false">${item.label}</div>
            `;
            
            // Sync on typing inside the label
            const labelEl = card.querySelector('.label-tag');
            labelEl.addEventListener('input', () => syncInputsToGrid());
            
            // Drag listeners
            card.addEventListener('dragstart', () => card.classList.add('dragging'));
            card.addEventListener('dragend', () => {
                card.classList.remove('dragging');
                syncInputsToGrid();
            });

            gallery.appendChild(card);
        });
    }

    // Drag-and-drop sorting logic
    gallery.addEventListener('dragover', e => {
        e.preventDefault();
        const draggable = document.querySelector('.dragging');
        const afterElement = [...gallery.querySelectorAll('.image-card:not(.dragging)')].find(child => {
            const box = child.getBoundingClientRect();
            return e.clientY < box.top + box.height / 2;
        });
        if (!afterElement) gallery.appendChild(draggable);
        else gallery.insertBefore(draggable, afterElement);
    });

    function syncInputsToGrid() {
        const cards = [...gallery.querySelectorAll('.image-card')];
        const newUrls = cards.map(c => c.querySelector('img').src);
        const newLabels = cards.map(c => c.querySelector('.label-tag').innerText.trim());
        
        // Prevent recursive triggers by only updating if values actually changed
        urlInput.value = newUrls.join('\n');
        labelInput.value = newLabels.join('\n');
    }

    function downloadData() {
        const content = `--- URLS ---\n${urlInput.value}\n\n--- LABELS ---\n${labelInput.value}`;
        const blob = new Blob([content], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'gallery_config.txt';
        a.click();
    }

    // Listeners for main textareas
    urlInput.addEventListener('input', renderGallery);
    labelInput.addEventListener('input', renderGallery);
    
    renderGallery();
</script>

</body>
</html>
