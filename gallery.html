<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymathic Resource Portal | Byron</title>
    <style>
        :root {
            --primary-blue: #0047ab;
            --bg-gray: #f4f7f6;
            --edit-highlight: #fff9db;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-gray);
            margin: 0; padding: 0;
        }

        .controls-wrapper {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #ddd;
            transition: all 0.4s ease;
            max-height: 250px;
            opacity: 1;
            overflow: hidden;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .controls-wrapper:not(:hover):not(:focus-within) {
            max-height: 15px;
            opacity: 0.4;
            padding: 8px 20px;
        }

        textarea {
            width: 100%; height: 120px;
            padding: 12px; border: 1px solid #ccc;
            border-radius: 8px; font-family: monospace;
            box-sizing: border-box;
            display: block; margin: 0 auto;
            max-width: 1200px;
        }

        .button-row {
            max-width: 1200px;
            margin: 10px auto 0;
            text-align: right;
        }

        .btn-download {
            background-color: var(--primary-blue);
            color: white; border: none;
            padding: 8px 20px; border-radius: 5px;
            cursor: pointer; font-weight: bold;
        }

        #imageGallery {
            columns: 4 280px;
            column-gap: 20px;
            padding: 40px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .image-card {
            break-inside: avoid;
            margin-bottom: 20px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: transform 0.2s;
            cursor: grab;
            display: inline-block;
            width: 100%;
        }

        .image-card img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
            min-height: 150px;
            background: #eee;
        }

        .label-tag {
            padding: 15px;
            background: #fff;
            color: #2c3e50;
            font-weight: 600;
            text-align: center;
            outline: none;
            cursor: text;
            border-top: 1px solid #f0f0f0;
        }

        .label-tag:focus { background: var(--edit-highlight); }
        .dragging { opacity: 0.3; }
    </style>
</head>
<body>

<div class="controls-wrapper">
    <textarea id="urlInput" placeholder="Paste ANY Google Drive links here (one per line)..."></textarea>
    <div class="button-row">
        <button class="btn-download" onclick="downloadData()">Download Configuration</button>
    </div>
</div>

<div id="imageGallery"></div>

<script>
    const urlInput = document.getElementById('urlInput');
    const gallery = document.getElementById('imageGallery');

    // These will now work because of the 'cleaner' function
    const demoUrls = [
        "https://drive.google.com/file/d/18nKe1S8CMbKP2vEw9mwnG0MB_eKD-biO",
        "https://drive.google.com/file/d/1EdWyzszNrCm8g11ob_bM267yx7_12haA",
        "https://drive.google.com/file/d/1qICPO_qrSCl8awCm222usel5Awwfyidw",
        "https://drive.google.com/file/d/19aoeZL_t0oTfkOSYGorDZb3ECZQGqwW0",
        "https://drive.google.com/file/d/1X0M-Hc4uSEtuJC0tyNTLP3-fKIjx-gNx"
    ];

    // UNIVERSAL CLEANER: Works for both Demos and User Inputs
    function cleanLink(url) {
        const driveRegex = /\/d\/([a-zA-Z0-9_-]+)/;
        const match = url.match(driveRegex);
        if (match && match[1]) {
            return `https://docs.google.com/uc?export=view&id=${match[1]}`;
        }
        return url;
    }

    function renderGallery() {
        const rawText = urlInput.value.trim();
        // Uses input if present, otherwise falls back to demoUrls
        const sourceList = rawText ? rawText.split('\n').map(u => u.trim()).filter(u => u) : demoUrls;
        
        gallery.innerHTML = '';

        sourceList.forEach((url) => {
            const finalUrl = cleanLink(url);
            const card = document.createElement('div');
            card.className = 'image-card';
            card.draggable = true;

            card.innerHTML = `
                <img src="${finalUrl}" loading="lazy">
                <div class="label-tag" contenteditable="true" spellcheck="false">Click to name...</div>
            `;

            card.addEventListener('dragstart', () => card.classList.add('dragging'));
            card.addEventListener('dragend', () => card.classList.remove('dragging'));
            gallery.appendChild(card);
        });
    }

    // Drag-and-drop reflow
    gallery.addEventListener('dragover', e => {
        e.preventDefault();
        const draggable = document.querySelector('.dragging');
        if (!draggable) return;
        const afterElement = [...gallery.querySelectorAll('.image-card:not(.dragging)')].find(child => {
            const box = child.getBoundingClientRect();
            return e.clientY < box.top + box.height / 2;
        });
        if (afterElement == null) gallery.appendChild(draggable);
        else gallery.insertBefore(draggable, afterElement);
    });

    function downloadData() {
        const cards = [...gallery.querySelectorAll('.image-card')];
        const content = cards.map(c => `[${c.querySelector('.label-tag').innerText}] -> ${c.querySelector('img').src}`).join('\n');
        const blob = new Blob([content], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'gallery_config.txt';
        a.click();
    }

    urlInput.addEventListener('input', renderGallery);
    window.addEventListener('load', renderGallery);
</script>

</body>
</html>
