<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polymathic Resource Portal | Byron</title>
    <style>
        :root {
            --primary-blue: #0047ab;
            --bg-gray: #f4f7f6;
            --card-white: #ffffff;
            --edit-highlight: #fff9db;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-gray);
            margin: 0; padding: 0;
        }

        /* COLLAPSIBLE PANEL - SIMPLIFIED */
        .controls-wrapper {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #ddd;
            transition: all 0.4s ease;
            max-height: 250px;
            opacity: 1;
            overflow: hidden;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .controls-wrapper:not(:hover):not(:focus-within) {
            max-height: 15px;
            opacity: 0.4;
            padding: 8px 20px;
        }

        textarea {
            width: 100%; height: 120px;
            padding: 12px; border: 1px solid #ccc;
            border-radius: 8px; font-family: monospace;
            box-sizing: border-box;
            display: block; margin: 0 auto;
            max-width: 1200px;
        }

        .button-row {
            max-width: 1200px;
            margin: 10px auto 0;
            text-align: right;
        }

        .btn-download {
            background-color: var(--primary-blue);
            color: white; border: none;
            padding: 8px 20px; border-radius: 5px;
            cursor: pointer; font-weight: bold;
        }

        /* MASONRY GRID LAYOUT */
        #imageGallery {
            columns: 4 280px; /* Number of columns and minimum width */
            column-gap: 20px;
            padding: 40px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .image-card {
            break-inside: avoid; /* Prevents card from splitting across columns */
            margin-bottom: 20px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: grab;
            display: inline-block; /* Required for Masonry behavior */
            width: 100%;
        }

        .image-card:active { cursor: grabbing; }
        .image-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.12); }

        .image-card img {
            width: 100%;
            height: auto; /* Maintains original aspect ratio */
            display: block;
            pointer-events: none;
        }

        .label-tag {
            padding: 15px;
            background: #fff;
            color: #2c3e50;
            font-weight: 600;
            text-align: center;
            outline: none;
            cursor: text;
            border-top: 1px solid #f0f0f0;
        }

        .label-tag:focus { background: var(--edit-highlight); }

        /* Drag styling */
        .dragging { opacity: 0.3; transform: scale(0.9); }
    </style>
</head>
<body>

<div class="controls-wrapper">
    <h4 style="margin:0 0 10px 0; text-align:center; color:var(--primary-blue);">Image URL Input</h4>
    <textarea id="urlInput" placeholder="Paste image URLs here (one per line)..."></textarea>
    <div class="button-row">
        <button class="btn-download" onclick="downloadData()">Download Configuration</button>
    </div>
</div>

<div id="imageGallery"></div>

<script>
    const urlInput = document.getElementById('urlInput');
    const gallery = document.getElementById('imageGallery');

    // Initial Demo Content
    const demoUrls = [
        "https://drive.google.com/file/d/18nKe1S8CMbKP2vEw9mwnG0MB_eKD-biO",
        "https://drive.google.com/file/d/1EdWyzszNrCm8g11ob_bM267yx7_12haA/view?usp=sharing",
        "https://drive.google.com/file/d/1qICPO_qrSCl8awCm222usel5Awwfyidw/view?usp=sharing",
        "https://drive.google.com/file/d/19aoeZL_t0oTfkOSYGorDZb3ECZQGqwW0/view?usp=sharing",
        "https://drive.google.com/file/d/1X0M-Hc4uSEtuJC0tyNTLP3-fKIjx-gNx/view?usp=sharing"
    ];

    function renderGallery() {
        const rawText = urlInput.value.trim();
        const urls = rawText ? rawText.split('\n').map(u => u.trim()).filter(u => u) : demoUrls;
        
        gallery.innerHTML = '';

        urls.forEach((url, i) => {
            const card = document.createElement('div');
            card.className = 'image-card';
            card.draggable = true;

            card.innerHTML = `
                <img src="${url}">
                <div class="label-tag" contenteditable="true" spellcheck="false">Click to name...</div>
            `;

            // Drag Events
            card.addEventListener('dragstart', () => card.classList.add('dragging'));
            card.addEventListener('dragend', () => card.classList.remove('dragging'));

            gallery.appendChild(card);
        });
    }

    // Advanced Reflow Dragging Logic
    gallery.addEventListener('dragover', e => {
        e.preventDefault();
        const draggable = document.querySelector('.dragging');
        if (!draggable) return;

        const afterElement = getDragAfterElement(gallery, e.clientX, e.clientY);
        if (afterElement == null) {
            gallery.appendChild(draggable);
        } else {
            gallery.insertBefore(draggable, afterElement);
        }
    });

    function getDragAfterElement(container, x, y) {
        const draggableElements = [...container.querySelectorAll('.image-card:not(.dragging)')];

        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) {
                return { offset: offset, element: child };
            } else {
                return closest;
            }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function downloadData() {
        const cards = [...gallery.querySelectorAll('.image-card')];
        const data = cards.map(c => ({
            url: c.querySelector('img').src,
            label: c.querySelector('.label-tag').innerText
        }));
        
        let content = "--- GALLERY CONFIGURATION ---\n\n";
        data.forEach(item => {
            content += `[${item.label}] -> ${item.url}\n`;
        });

        const blob = new Blob([content], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'byron_gallery_export.txt';
        a.click();
    }

    urlInput.addEventListener('input', renderGallery);
    window.addEventListener('load', renderGallery);
</script>

</body>
</html>
