<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Resource Portal | Byron</title>
    <style>
        :root {
            --primary-blue: #0047ab;
            --bg-gray: #f0f2f5;
            --panel-white: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-gray);
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        /* DYNAMIC COLLAPSIBLE PANEL */
        .controls-wrapper {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--panel-white);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #ddd;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            max-height: 400px;
            opacity: 1;
            overflow: hidden;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Minimised State: Triggered when not hovered */
        .controls-wrapper:not(:hover):not(:focus-within) {
            max-height: 10px;
            opacity: 0.3;
            padding: 5px 20px;
            cursor: pointer;
        }

        .controls-wrapper:not(:hover):not(:focus-within)::after {
            content: "↑ Hover to Edit URLs & Labels ↑";
            display: block;
            text-align: center;
            font-size: 10px;
            color: var(--primary-blue);
            font-weight: bold;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        textarea {
            width: 100%; height: 80px;
            padding: 10px; border: 1px solid #ccc;
            border-radius: 6px; font-family: monospace;
            box-sizing: border-box;
            background: #fff;
        }

        /* GALLERY STYLING */
        #imageGallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
            padding: 40px 20px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .image-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            position: relative;
            transition: transform 0.3s ease;
            cursor: grab;
        }

        .image-card:hover { transform: translateY(-5px); }

        .image-card img {
            width: 100%; height: 220px;
            object-fit: cover; pointer-events: none;
        }

        .label-tag {
            padding: 12px;
            background: #fff;
            color: #2c3e50;
            font-weight: 600;
            text-align: center;
            border-top: 1px solid #f0f0f0;
        }

        .placeholder-indicator {
            position: absolute;
            top: 10px; left: 10px;
            background: var(--primary-blue);
            color: white; font-size: 10px;
            padding: 3px 8px; border-radius: 20px;
            z-index: 10;
        }
    </style>
</head>
<body>

<div class="controls-wrapper" id="controlPanel">
    <div class="controls-grid">
        <div>
            <h4 style="margin:0 0 10px 0; color:var(--primary-blue);">Image URLs</h4>
            <textarea id="urlInput" placeholder="Paste Google Drive Direct Links..."></textarea>
        </div>
        <div>
            <h4 style="margin:0 0 10px 0; color:var(--primary-blue);">Student Labels</h4>
            <textarea id="labelInput" placeholder="Paste Student Names..."></textarea>
        </div>
    </div>
</div>

<div id="imageGallery"></div>

<script>
    const urlInput = document.getElementById('urlInput');
    const labelInput = document.getElementById('labelInput');
    const gallery = document.getElementById('imageGallery');

    // MOCK DATA FOR INITIAL LOAD
    const demoData = [
        { url: 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=500', label: 'Systems Innovation Project' },
        { url: 'https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=500', label: 'Collaborative Study' },
        { url: 'https://images.unsplash.com/photo-1503676260728-1c00da094a0b?w=500', label: 'Educational Pedagogy' }
    ];

    function renderGallery() {
        gallery.innerHTML = '';
        const rawUrls = urlInput.value.split('\n').map(u => u.trim()).filter(u => u);
        const rawLabels = labelInput.value.split('\n').map(l => l.trim());

        const isUserContent = rawUrls.length > 0;
        const activeData = isUserContent 
            ? rawUrls.map((url, i) => ({ url, label: rawLabels[i] || `Item ${i + 1}`, isDemo: false }))
            : demoData.map(d => ({ ...d, isDemo: true }));

        activeData.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'image-card';
            card.draggable = true;

            card.innerHTML = `
                ${item.isDemo ? '<span class="placeholder-indicator">Demo</span>' : ''}
                <img src="${item.url}" alt="${item.label}">
                <div class="label-tag">${item.label}</div>
            `;

            card.addEventListener('dragstart', () => card.classList.add('dragging'));
            card.addEventListener('dragend', () => card.classList.remove('dragging'));
            gallery.appendChild(card);
        });
    }

    // Drag-and-drop sorting logic
    gallery.addEventListener('dragover', e => {
        e.preventDefault();
        const draggable = document.querySelector('.dragging');
        const afterElement = [...gallery.querySelectorAll('.image-card:not(.dragging)')].find(child => {
            const box = child.getBoundingClientRect();
            return e.clientY < box.top + box.height / 2;
        });
        if (!afterElement) gallery.appendChild(draggable);
        else gallery.insertBefore(draggable, afterElement);
    });

    urlInput.addEventListener('input', renderGallery);
    labelInput.addEventListener('input', renderGallery);
    renderGallery(); // Initial call
</script>

</body>
</html>
