<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Text Scraper</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7385;
    --border: #d9dde5; --accent: #2f6fed; --accent-hover: #1f58c7; --err: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --card: #1b1f29; --text: #e8ebf2; --muted: #9099ad;
      --border: #2e3442; --accent: #5b8cff; --accent-hover: #7aa2ff; --err: #ff7b7b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  p.sub { margin: 0 0 20px; color: var(--muted); }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px;
  }
  label { display: block; font-size: .85rem; font-weight: 600; margin: 0 0 6px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .field { flex: 1 1 200px; }
  .field.grow { flex: 3 1 320px; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  textarea {
    min-height: 340px; resize: vertical; margin-top: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .88rem; line-height: 1.5;
  }
  button {
    font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  #status { margin: 14px 0 0; font-size: .9rem; color: var(--muted); min-height: 1.3em; }
  #status.error { color: var(--err); }
  .out-head {
    display: flex; justify-content: space-between; align-items: center;
    margin: 20px 0 0; flex-wrap: wrap; gap: 8px;
  }
  .out-head span { font-size: .85rem; color: var(--muted); }
  .note { margin-top: 18px; font-size: .8rem; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Page Text Scraper</h1>
  <p class="sub">Enter a URL, pick what to extract, and get plain text back.</p>

  <div class="card">
    <form id="form">
      <div class="row">
        <div class="field grow">
          <label for="url">Page URL</label>
          <input id="url" type="text" placeholder="https://example.com/article" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="mode">Extract</label>
          <select id="mode">
            <option value="everything">Everything (all visible text)</option>
            <option value="text">Text (paragraphs, lists, quotes)</option>
            <option value="headings">Headings (H1–H6)</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="go" type="submit">Scrape</button>
        <button type="button" id="copy" disabled>Copy</button>
        <button type="button" id="download" disabled>Download .txt</button>
      </div>
    </form>

    <p id="status" role="status"></p>

    <div class="out-head">
      <label for="output" style="margin:0">Result</label>
      <span id="count"></span>
    </div>
    <textarea id="output" readonly placeholder="Extracted text will appear here…"></textarea>

    <p class="note">
      Browsers block pages from fetching other sites directly (CORS), so requests go through a public
      CORS proxy. Pages that need JavaScript to render content, or that block proxies, may come back empty.
    </p>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const form = $('form'), urlEl = $('url'), modeEl = $('mode'), goBtn = $('go');
const copyBtn = $('copy'), dlBtn = $('download');
const out = $('output'), statusEl = $('status'), countEl = $('count');

// Proxies tried in order until one works.
// Each proxy has a name (shown in errors), a URL builder, and an optional parser
// for proxies that wrap the page in JSON.
const PROXIES = [
  { name: 'allorigins (json)',
    url: u => 'https://api.allorigins.win/get?url=' + encodeURIComponent(u),
    parse: async res => (await res.json()).contents },
  { name: 'allorigins (raw)',
    url: u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u) },
  { name: 'codetabs',
    url: u => 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(u) },
  { name: 'corsproxy.io',
    url: u => 'https://corsproxy.io/?url=' + encodeURIComponent(u) },
  { name: 'thingproxy',
    url: u => 'https://thingproxy.freeboard.io/fetch/' + u }
];

function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.classList.toggle('error', isError);
}

function normalizeUrl(raw) {
  let v = raw.trim();
  if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
  return new URL(v).href; // throws if invalid
}

async function fetchHtml(url) {
  const failures = [];
  for (const p of PROXIES) {
    setStatus('Fetching page via ' + p.name + '…');
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 25000);
    try {
      const res = await fetch(p.url(url), { signal: ctrl.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const html = p.parse ? await p.parse(res) : await res.text();
      // Reject proxy error pages / non-HTML bodies
      if (!html || !/<(html|body|h1|p|div)[\s>]/i.test(html)) throw new Error('no HTML returned');
      return html;
    } catch (e) {
      failures.push(p.name + ': ' + (e.name === 'AbortError' ? 'timed out' : e.message));
    } finally {
      clearTimeout(timer);
    }
  }
  throw new Error('every proxy failed — ' + failures.join('; '));
}

// Only remove elements that never hold readable content. Wrappers such as
// nav/form/footer are kept, because some sites wrap the whole article in them.
const NOISE = 'script,style,noscript,template,iframe,svg,canvas,head,link,meta,select,option';

function clean(s) {
  return s.replace(/\s+/g, ' ').trim();
}

function extract(doc, mode) {
  const body = doc.body || doc.documentElement;
  // Remove elements that never contain readable page content
  body.querySelectorAll(NOISE).forEach(el => el.remove());

  if (mode === 'headings') {
    const lines = [];
    body.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h => {
      const t = clean(h.textContent);
      if (!t) return;
      const level = parseInt(h.tagName[1], 10);
      lines.push('  '.repeat(level - 1) + t);
    });
    return lines.join('\n');
  }

  if (mode === 'text') {
    const parts = [];
    body.querySelectorAll('p,li,blockquote,pre,td,th,dd,dt,figcaption').forEach(el => {
      // Skip containers whose text is already captured by a nested matching child
      if (el.querySelector('p,li,blockquote,pre')) return;
      const t = clean(el.textContent);
      if (t) parts.push(t);
    });
    return parts.join('\n\n');
  }

  // everything: all visible text, one block per block-level element
  const blocks = [];
  const BLOCK = new Set(['P','DIV','LI','H1','H2','H3','H4','H5','H6','BLOCKQUOTE','PRE',
    'TR','SECTION','ARTICLE','ASIDE','HEADER','MAIN','FIGCAPTION','DT','DD','TD','TH','UL','OL','TABLE']);
  const walker = doc.createTreeWalker(body, NodeFilter.SHOW_TEXT);
  let node, buf = '', lastBlock = null;
  const blockOf = n => {
    let p = n.parentElement;
    while (p && !BLOCK.has(p.tagName)) p = p.parentElement;
    return p || body;
  };
  while ((node = walker.nextNode())) {
    const t = clean(node.nodeValue);
    if (!t) continue;
    const b = blockOf(node);
    if (b !== lastBlock && buf) { blocks.push(buf); buf = ''; }
    buf += (buf ? ' ' : '') + t;
    lastBlock = b;
  }
  if (buf) blocks.push(buf);
  return blocks.join('\n\n');
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  let url;
  try { url = normalizeUrl(urlEl.value); }
  catch { setStatus('That doesn\'t look like a valid URL.', true); return; }

  goBtn.disabled = true; copyBtn.disabled = dlBtn.disabled = true;
  out.value = ''; countEl.textContent = '';
  setStatus('Fetching page…');

  try {
    const html = await fetchHtml(url);
    setStatus('Extracting…');
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const text = extract(doc, modeEl.value);

    if (!text) {
      setStatus('Page loaded, but nothing matched. It may render its content with JavaScript.', true);
    } else {
      out.value = text;
      const words = text.split(/\s+/).filter(Boolean).length;
      countEl.textContent = words.toLocaleString() + ' words · ' + text.length.toLocaleString() + ' characters';
      copyBtn.disabled = dlBtn.disabled = false;
      setStatus('Done.');
    }
  } catch (err) {
    setStatus('Could not scrape that page: ' + err.message, true);
  } finally {
    goBtn.disabled = false;
  }
});

copyBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(out.value);
  } catch {
    out.select(); document.execCommand('copy');
  }
  setStatus('Copied to clipboard.');
});

dlBtn.addEventListener('click', () => {
  let name = 'scraped';
  try { name = new URL(normalizeUrl(urlEl.value)).hostname.replace(/\./g, '_'); } catch {}
  const blob = new Blob([out.value], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name + '_' + modeEl.value + '.txt';
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
