<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint Reporter | Systems Innovator</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-slate: #1e293b;
            --electric-blue: #3b82f6;
            --text-bright: #f8fafc;
            --text-dim: #94a3b8;
            --danger-red: #ef4444;
        }

        body { 
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1e293b 100%); 
            color: var(--text-bright); 
            font-family: 'Inter', sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
        }

        .app-card { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 2.5rem; border-radius: 24px; width: 100%; max-width: 500px; text-align: center;
        }

        h1, #timer-text { color: var(--electric-blue); text-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }

        .nav-header { display: flex; justify-content: space-between; margin-bottom: 2rem; }
        .nav-header a { text-decoration: none; color: var(--electric-blue); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }

        .config-section { text-align: left; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; color: var(--text-dim); }
        input, textarea { width: 100%; padding: 12px; background: rgba(15, 23, 42, 0.5); border: 1px solid #334155; border-radius: 10px; font-size: 1rem; color: white; box-sizing: border-box; }

        .btn-start { width: 100%; background: var(--electric-blue); color: white; padding: 16px; border: none; border-radius: 14px; font-weight: 700; cursor: pointer; font-size: 1rem; margin-top: 10px; }

        .btn-action { 
            background: rgba(255,255,255,0.05); 
            padding: 10px 18px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 0.85rem;
            transition: all 0.2s;
            border: 1px solid #334155;
            color: var(--text-dim);
        }
        .btn-action:hover { background: rgba(255,255,255,0.1); color: var(--text-bright); }

        canvas, video { display: none; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="nav-header">
        <a href="index.html">&larr; Dashboard</a>
        <span style="font-weight: 800; color: var(--text-dim); font-size: 0.7rem; letter-spacing: 2px;">OUTPUT // SYNTHESIS</span>
    </div>

    <h1>Sprint Reporter</h1>
    <p class="subtitle" style="color: var(--text-dim); margin-bottom: 2rem;">Forcing an output</p>
    
    <div id="setup-ui">
        <div class="config-section">
            <div class="input-group">
                <label>Reports (Repeats)</label>
                <input type="number" id="repeats" value="10" min="1">
            </div>
            <div class="input-group">
                <label>Seconds Per Phase</label>
                <input type="number" id="phaseSeconds" value="15">
            </div>
            <div class="input-group">
                <label>Custom Phases (Icon:Label, ...)</label>
                <textarea id="customPhases" oninput="saveConfig()" style="height:80px;">🧠:Think, 🎭:Personality, 📈:Attitude, 🏆:Progress, 👣:Next Steps, 🌟:Wishing Well</textarea>
            </div>
        </div>
        <button class="btn-start" onclick="startReporting()">Begin Reporting Sprint</button>
    </div>

    <div id="display-area" style="display:none;">
        <div id="phase-icon" style="font-size: 5rem; margin-bottom: 10px;">🧠</div>
        <div id="phase-label" style="font-weight: 700; text-transform: uppercase; letter-spacing: 2px;">Think</div>
        <div id="timer-text" style="font-size: 4rem; font-weight: 800; margin: 10px 0;">15s</div>
        <div id="repeat-info" style="color: var(--text-dim); font-weight: 600;">Unit 1 of 10</div>
        
        <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
            <button class="btn-action" id="pauseBtn" onclick="togglePause()">Pause</button>
            <button class="btn-action" onclick="resetSprint()" style="border-color: var(--danger-red); color: var(--danger-red);">Reset / Back</button>
            <button class="btn-action" onclick="togglePiP()">Mini-View</button>
        </div>
    </div>
</div>

<canvas id="pipCanvas" width="200" height="200"></canvas>
<video id="pipVideo" autoplay muted playsinline></video>

<script>
    let timer, timeLeft, isPaused = false;
    let currentRepeat = 1, totalRepeats = 1, phaseIndex = 0, secondsPerPhase = 15;
    let activePhases = [];
    
    const canvas = document.getElementById('pipCanvas'), ctx = canvas.getContext('2d'), video = document.getElementById('pipVideo');

    // Persistence Logic
    window.onload = () => {
        const saved = localStorage.getItem('sprintReporterConfig');
        if (saved) document.getElementById('customPhases').value = saved;
    };

    function saveConfig() {
        localStorage.setItem('sprintReporterConfig', document.getElementById('customPhases').value);
    }

    function parsePhases() {
        const input = document.getElementById('customPhases').value;
        const phaseStrings = input.split(',');
        return phaseStrings.map(str => {
            const parts = str.split(':');
            return {
                icon: parts[0]?.trim() || "📝",
                label: parts[1]?.trim() || parts[0]?.trim() || "Phase"
            };
        });
    }

    async function startReporting() {
        activePhases = parsePhases();
        totalRepeats = parseInt(document.getElementById('repeats').value) || 1;
        secondsPerPhase = parseInt(document.getElementById('phaseSeconds').value) || 15;
        
        currentRepeat = 1;
        phaseIndex = 0;
        timeLeft = secondsPerPhase;
        isPaused = false;

        document.getElementById('setup-ui').style.display = 'none';
        document.getElementById('display-area').style.display = 'block';
        
        updateUI();
        updatePiPCanvas(); // Ensure canvas is ready for capture
        setupMediaSession();
        
        await togglePiP(); // Launch PiP immediately
        runTimer();
    }

    function resetSprint() {
        if (confirm("Reset current sprint and return to setup?")) {
            location.reload(); 
        }
    }
    
    function runTimer() {
        clearInterval(timer);
        timer = setInterval(() => {
            if (!isPaused) {
                timeLeft--;
                if (timeLeft < 0) nextPhase();
                updateUI();
                updatePiPCanvas();
            }
        }, 1000);
    }

    function nextPhase() {
        if (phaseIndex < activePhases.length - 1) {
            phaseIndex++;
            playSound('chime');
        } else {
            if (currentRepeat < totalRepeats) {
                currentRepeat++;
                phaseIndex = 0;
                playSound('gong');
            } else {
                finish(); return;
            }
        }
        timeLeft = secondsPerPhase;
    }

    function togglePause() {
        isPaused = !isPaused;
        document.getElementById('pauseBtn').innerText = isPaused ? "Resume" : "Pause";
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = isPaused ? "paused" : "playing";
        updateUI();
        updatePiPCanvas();
    }

    function finish() {
        clearInterval(timer);
        alert("Sprint Complete!");
        location.reload();
    }

    function updateUI() {
        const p = activePhases[phaseIndex];
        document.getElementById('phase-icon').innerText = p.icon;
        document.getElementById('phase-label').innerText = isPaused ? "System Halted" : p.label;
        document.getElementById('timer-text').innerText = timeLeft + "s";
        document.getElementById('repeat-info').innerText = `Unit ${currentRepeat} of ${totalRepeats}`;
    }

    function updatePiPCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = isPaused ? "#424242" : "#0f172a"; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.textAlign = "center"; 
        ctx.fillStyle = "white";
        ctx.font = "70px serif"; 
        ctx.fillText(isPaused ? "⏸" : activePhases[phaseIndex].icon, 100, 85);
        
        ctx.font = "bold 35px Arial";
        ctx.fillText(isPaused ? "PAUSE" : timeLeft + "s", 100, 140);
        
        ctx.font = "12px Arial"; 
        ctx.fillStyle = "#94a3b8";
        ctx.fillText(`${activePhases[phaseIndex].label.toUpperCase()} | ${currentRepeat}/${totalRepeats}`, 100, 175);
    }

    function playSound(type) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'chime') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            } else { 
                osc.type = 'triangle'; osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2);
            }
            osc.start(); osc.stop(audioCtx.currentTime + (type === 'chime' ? 0.5 : 2));
        } catch(e) {}
    }

    function setupMediaSession() {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({ title: 'Sprint Reporter', artist: 'Systems Innovator' });
            navigator.mediaSession.setActionHandler('play', togglePause);
            navigator.mediaSession.setActionHandler('pause', togglePause);
        }
    }

    async function togglePiP() {
        try {
            const stream = canvas.captureStream();
            video.srcObject = stream;
            await video.play();
            await video.requestPictureInPicture();
        } catch (e) { console.error(e); }
    }

    window.addEventListener('keydown', (e) => {
        if (e.code === "Space" && document.getElementById('display-area').style.display !== 'none') {
            e.preventDefault(); togglePause();
        }
    });
</script>
</body>
</html>
