<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint Reporter | Systems Innovator</title>
    <style>
       :root {
    --primary-blue: #1e293b; /* Deep Slate */
    --accent-blue: #3b82f6;  /* Electric Blue */
    --text-main: #f8fafc;    /* Off-White for high contrast */
    --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
}

body { 
    font-family: 'Inter', -apple-system, sans-serif; 
    background: var(--bg-gradient); 
    color: var(--text-main); 
    display: flex; justify-content: center; align-items: center; 
    min-height: 100vh; margin: 0; 
}

.app-card { 
    background: rgba(30, 41, 59, 0.7); /* Translucent Slate */
    backdrop-filter: blur(16px);
    padding: 2.5rem; border-radius: 24px; 
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
    width: 100%; max-width: 500px; text-align: center;
    border: 1px solid rgba(255,255,255,0.1);
    color: white;
        }

     h1 { color: #60a5fa; } /* Soft Blue for the header */
#timer-text { color: #60a5fa; }
label { color: #94a3b8; } /* Muted Slate for labels */
input, textarea { background: rgba(15, 23, 42, 0.5); border: 1px solid #334155; color: white; }
.btn-start { background: var(--accent-blue); box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
.btn-action { background: rgba(255,255,255,0.05); color: #94a3b8; border: 1px solid #334155; }

        #timer-text { font-size: 4.5rem; font-weight: 800; color: var(--primary-brown); margin: 0; }
        #phase-label { font-weight: 700; color: #8d6e63; text-transform: uppercase; letter-spacing: 2px; font-size: 0.9rem; }
        #repeat-info { font-size: 0.8rem; color: #a1887f; margin-top: 10px; font-weight: 600; }

        .btn-action { margin-top: 20px; padding: 10px 20px; border-radius: 10px; cursor: pointer; border: 1px solid var(--accent-tan); font-weight: 600; background: white; color: var(--primary-brown); }
        
        canvas, video { display: none; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="nav-header">
        <a href="index.html">&larr; Dashboard</a>
        <span style="font-weight: 800; color: var(--accent-tan); font-size: 0.7rem; letter-spacing: 2px;">OUTPUT // SYNTHESIS</span>
    </div>

    <h1>Sprint Reporter</h1>
    <p class="subtitle">Forcing an output</p>
    
<div id="setup-ui">
    <div class="config-section">
        <div class="input-group">
            <label>Number of Reports (Repeats)</label>
            <input type="number" id="repeats" value="10" min="1">
        </div>
        <div class="input-group">
            <label>Seconds Per Phase</label>
            <input type="number" id="phaseSeconds" value="15">
        </div>
        <div class="input-group">
            <label>Custom Phases (Icon:Label, ...)</label>
            <textarea id="customPhases" style="width:100%; height:60px; border-radius:10px; border:2px solid #efebe9; padding:10px; font-family:inherit; font-size:0.8rem; box-sizing:border-box;">🧠:Think, 🎭:Personality, 📈:Attitude, 🏆:Progress, 👣:Next Steps, 🌟:Wishing Well</textarea>
            <p style="font-size: 0.65rem; color: #8d6e63; margin-top: 5px;">Separate phases with commas. Use <b>Icon:Name</b> format.</p>
        </div>
    </div>
    <button class="btn-start" onclick="startReporting()">Begin Reporting Sprint</button>
</div>

    <div id="display-area" style="display:none;">
        <div id="phase-icon" style="font-size: 5rem; margin-bottom: 10px;">🧠</div>
        <div id="phase-label">Think</div>
        <div id="timer-text">00:15</div>
        <div id="repeat-info">Student 1 of 10</div>
        
<div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
    <button class="btn-action" id="pauseBtn" onclick="togglePause()">Pause</button>
    <button class="btn-action" onclick="resetSprint()" style="border-color: #e74c3c; color: #e74c3c;">Reset / Back</button>
    <button class="btn-action" onclick="togglePiP()">Mini-View</button>
</div>
    </div>
</div>

<canvas id="pipCanvas" width="200" height="200"></canvas>
<video id="pipVideo" autoplay muted playsinline></video>

<script>
    let timer, timeLeft, isPaused = false;
    let currentRepeat = 1, totalRepeats = 1, phaseIndex = 0, secondsPerPhase = 15;
    let activePhases = [];
    
    const canvas = document.getElementById('pipCanvas'), ctx = canvas.getContext('2d'), video = document.getElementById('pipVideo');

    function parsePhases() {
        const input = document.getElementById('customPhases').value;
        const phaseStrings = input.split(',');
        return phaseStrings.map(str => {
            const parts = str.split(':');
            return {
                icon: parts[0]?.trim() || "📝",
                label: parts[1]?.trim() || parts[0]?.trim() || "Phase"
            };
        });
    }

    function startReporting() {
        activePhases = parsePhases();
        totalRepeats = parseInt(document.getElementById('repeats').value) || 1;
        secondsPerPhase = parseInt(document.getElementById('phaseSeconds').value) || 15;
        
        currentRepeat = 1;
        phaseIndex = 0;
        timeLeft = secondsPerPhase;
        isPaused = false;

        document.getElementById('setup-ui').style.display = 'none';
        document.getElementById('display-area').style.display = 'block';
        
        setupMediaSession();
        updateUI();
        runTimer();
    }

function resetSprint() {
    // 1. Stop the clock
    clearInterval(timer);
    isPaused = false;

    // 2. UI Switch
    document.getElementById('display-area').style.display = 'none';
    document.getElementById('setup-ui').style.display = 'block';

    // 3. Close PiP if it's open (browser dependent, usually requires a reload or manual close)
    // For a cleaner reset, we alert or simply reload if you want a fresh state:
    if (confirm("Reset current sprint and return to setup?")) {
        location.reload(); 
    } else {
        // If they cancel, we restart the timer logic where it was
        runTimer();
    }
}
    
    function runTimer() {
        clearInterval(timer);
        timer = setInterval(() => {
            if (!isPaused) {
                timeLeft--;
                if (timeLeft < 0) nextPhase();
                updateUI();
                updatePiPCanvas();
            }
        }, 1000);
    }

    function nextPhase() {
        if (phaseIndex < activePhases.length - 1) {
            phaseIndex++;
            playSound('chime');
        } else {
            if (currentRepeat < totalRepeats) {
                currentRepeat++;
                phaseIndex = 0;
                playSound('gong');
            } else {
                finish(); return;
            }
        }
        timeLeft = secondsPerPhase;
    }

    function togglePause() {
        isPaused = !isPaused;
        document.getElementById('pauseBtn').innerText = isPaused ? "Resume" : "Pause";
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = isPaused ? "paused" : "playing";
        updateUI();
        updatePiPCanvas();
    }

    function finish() {
        clearInterval(timer);
        alert("Sprint Complete!");
        location.reload();
    }

    function updateUI() {
        const p = activePhases[phaseIndex];
        document.getElementById('phase-icon').innerText = p.icon;
        document.getElementById('phase-label').innerText = isPaused ? "System Halted" : p.label;
        document.getElementById('timer-text').innerText = timeLeft.toString().padStart(2, '0') + "s";
        document.getElementById('repeat-info').innerText = `Unit ${currentRepeat} of ${totalRepeats}`;
    }

    function updatePiPCanvas() {
        ctx.fillStyle = isPaused ? "#424242" : "#2D1B17";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = "center"; ctx.fillStyle = "white";
        ctx.font = "70px serif"; ctx.fillText(activePhases[phaseIndex].icon, 100, 85);
        ctx.font = "bold 35px Arial";
        ctx.fillText(isPaused ? "PAUSE" : timeLeft + "s", 100, 140);
        ctx.font = "12px Arial"; ctx.fillStyle = "#A1887F";
        ctx.fillText(`${activePhases[phaseIndex].label.toUpperCase()} | ${currentRepeat}/${totalRepeats}`, 100, 175);
    }

    function playSound(type) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'chime') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            } else { 
                osc.type = 'triangle'; osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2);
            }
            osc.start(); osc.stop(audioCtx.currentTime + (type === 'chime' ? 0.5 : 2));
        } catch(e) {}
    }

    function setupMediaSession() {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({ title: 'Sprint Reporter', artist: 'Systems Innovator' });
            navigator.mediaSession.setActionHandler('play', togglePause);
            navigator.mediaSession.setActionHandler('pause', togglePause);
        }
    }

    async function togglePiP() {
        try {
            const stream = canvas.captureStream();
            video.srcObject = stream;
            video.onloadedmetadata = () => { video.play(); video.requestPictureInPicture(); };
        } catch (e) {}
    }

    window.addEventListener('keydown', (e) => {
        if (e.code === "Space" && document.getElementById('display-area').style.display !== 'none') {
            e.preventDefault(); togglePause();
        }
    });
</script>

</body>
</html>
