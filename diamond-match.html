<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hauora Arena Match</title>
    <style>
        :root {
            --progress: 0%;
            --dark-side: #1a1a2e;
            --bright-side: #ffffff;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
        }

        /* Input Bar */
        #setup {
            position: absolute; top: 0; width: 100%; height: 60px;
            background: #fff; display: flex; align-items: center;
            justify-content: center; gap: 10px; z-index: 100;
            border-bottom: 2px solid #ddd;
        }

        input { padding: 8px; width: 250px; border-radius: 4px; border: 1px solid #ccc; }
        button { padding: 8px 15px; cursor: pointer; background: #2c3e50; color: white; border: none; border-radius: 4px; }

        /* The Arena */
        #stage {
            position: relative; width: 100vw; height: calc(100vh - 60px);
            margin-top: 60px; display: flex;
        }

        .half {
            flex: 1; position: relative; overflow: hidden;
            transition: background 1s ease;
        }

        #left-half { 
            background-color: color-mix(in srgb, var(--dark-side), var(--bright-side) var(--progress));
        }
        
        #right-half { background-color: #fff; border-left: 1px solid #eee; }

        /* The Central Match Zone */
        #arena-circle {
            position: absolute;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            width: 180px; height: 180px;
            background: rgba(255, 255, 255, 0.9);
            border: 4px dashed #3498db;
            border-radius: 50%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 50; box-shadow: 0 0 20px rgba(0,0,0,0.1);
            text-align: center; font-size: 0.8em; color: #666;
        }

        /* Floating Words */
        .word {
            position: absolute;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: grab;
            user-select: none;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.1s;
            z-index: 10;
        }
        .word:active { cursor: grabbing; transform: scale(1.1); z-index: 60; }

        .neg-word { background: #4a4e69; color: white; }
        .pos-word { background: #95d5b2; color: #1b4332; }

        /* Review Sidebar */
        #review {
            position: absolute; right: 0; bottom: 0; width: 200px;
            max-height: 250px; background: rgba(0,0,0,0.8);
            color: white; padding: 10px; overflow-y: auto; font-size: 0.8em;
            z-index: 110; border-top-left-radius: 10px;
        }
    </style>
</head>
<body>

<div id="setup">
    <input id="list1" placeholder="List 1 (Negatives) - comma separated">
    <input id="list2" placeholder="List 2 (Positives) - comma separated">
    <button onclick="spawnWords()">Initialize Arena</button>
</div>

<div id="stage">
    <div id="left-half" class="half"></div>
    <div id="arena-circle">DROP PAIR<br>HERE</div>
    <div id="right-half" class="half"></div>
    
    <div id="review"><strong>Matches:</strong><div id="match-log"></div></div>
</div>

<script>
    let words = [];
    let activeNeg = null;
    let activePos = null;
    let totalItems = 0;
    let matches = 0;

    function spawnWords() {
        const l1 = document.getElementById('list1').value.split(',').map(s => s.trim()).filter(s => s);
        const l2 = document.getElementById('list2').value.split(',').map(s => s.trim()).filter(s => s);
        
        const leftHalf = document.getElementById('left-half');
        const rightHalf = document.getElementById('right-half');
        
        leftHalf.innerHTML = ''; rightHalf.innerHTML = '';
        document.getElementById('match-log').innerHTML = '';
        words = [];
        matches = 0;
        totalItems = Math.max(l1.length, l2.length);
        updateProgress();

        l1.forEach(text => createWord(text, 'neg', leftHalf));
        l2.forEach(text => createWord(text, 'pos', rightHalf));
        
        requestAnimationFrame(animate);
    }

    function createWord(text, type, container) {
        const el = document.createElement('div');
        el.className = `word ${type}-word`;
        el.innerText = text;
        container.appendChild(el);

        const data = {
            el: el,
            type: type,
            x: Math.random() * (container.offsetWidth - 100),
            y: Math.random() * (container.offsetHeight - 50),
            vx: (Math.random() - 0.5) * 2,
            vy: (Math.random() - 0.5) * 2,
            isDragging: false
        };

        el.onmousedown = (e) => {
            data.isDragging = true;
            el.style.zIndex = 1000;
        };

        window.onmousemove = (e) => {
            if (data.isDragging) {
                data.x = e.clientX - (type === 'pos' ? window.innerWidth/2 : 0) - 50;
                data.y = e.clientY - 80;
                checkArena(data);
            }
        };

        window.onmouseup = () => {
            if (data.isDragging) {
                data.isDragging = false;
                el.style.zIndex = 10;
            }
        };

        words.push(data);
    }

    function checkArena(data) {
        const arena = document.getElementById('arena-circle').getBoundingClientRect();
        const centerX = arena.left + arena.width/2;
        const centerY = arena.top + arena.height/2;
        
        // Use Global coordinates for checking the "Drop"
        const wordRect = data.el.getBoundingClientRect();
        const dist = Math.hypot(wordRect.left - arena.left, wordRect.top - arena.top);

        if (dist < 100) {
            if (data.type === 'neg') activeNeg = data;
            if (data.type === 'pos') activePos = data;
            
            if (activeNeg && activePos) {
                logMatch(activeNeg.el.innerText, activePos.el.innerText);
                removeWord(activeNeg);
                removeWord(activePos);
                activeNeg = null; activePos = null;
                matches++;
                updateProgress();
            }
        }
    }

    function removeWord(data) {
        data.el.remove();
        words = words.filter(w => w !== data);
    }

    function logMatch(n, p) {
        const log = document.getElementById('match-log');
        log.innerHTML = `<div>${n} + ${p}</div>` + log.innerHTML;
    }

    function updateProgress() {
        const p = (matches / totalItems) * 100;
        document.documentElement.style.setProperty('--progress', p + '%');
    }

    function animate() {
        const stageHeight = window.innerHeight - 60;
        const halfWidth = window.innerWidth / 2;

        words.forEach(w => {
            if (!w.isDragging) {
                w.x += w.vx;
                w.y += w.vy;

                // Bounce off edges
                if (w.x < 0 || w.x > halfWidth - 100) w.vx *= -1;
                if (w.y < 0 || w.y > stageHeight - 50) w.vy *= -1;

                w.el.style.left = w.x + 'px';
                w.el.style.top = w.y + 'px';
            }
        });
        requestAnimationFrame(animate);
    }
</script>

</body>
</html>
