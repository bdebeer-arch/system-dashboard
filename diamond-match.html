<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hauora Arena Match</title>
    <style>
        :root {
            --progress: 0%;
            --dark-side: #1a1a2e;
            --bright-side: #ffffff;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f0f2f5;
        }

        /* Setup Bar */
        #setup {
            position: relative; height: 130px; z-index: 1000;
            background: white; display: flex; align-items: center;
            justify-content: center; gap: 20px; border-bottom: 3px solid #3498db;
        }

        textarea { width: 280px; height: 70px; border-radius: 8px; border: 2px solid #ddd; padding: 8px; resize: none; }
        button { padding: 15px 30px; cursor: pointer; background: #27ae60; color: white; border: none; border-radius: 50px; font-weight: bold; }

        /* Stage */
        #stage {
            position: relative; width: 100vw; height: calc(100vh - 130px);
            display: flex; touch-action: none;
        }

        .half { flex: 1; position: relative; overflow: hidden; pointer-events: none; }
        #left-half { background-color: color-mix(in srgb, var(--dark-side), var(--bright-side) var(--progress)); }
        #right-half { background-color: #ffffff; border-left: 1px solid #eee; }

        /* The Arena Circle */
        #arena-circle {
            position: absolute; left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            width: 260px; height: 260px;
            background: rgba(255, 255, 255, 0.95);
            border: 10px solid #3498db;
            border-radius: 50%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 100; box-shadow: 0 10px 50px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
        }

        /* Visual feedback colors */
        .glow-neg { border-left-color: #e74c3c !important; transform: translate(-50%, -50%) scale(1.05); }
        .glow-pos { border-right-color: #2ecc71 !important; transform: translate(-50%, -50%) scale(1.05); }

        .slot { font-size: 13px; color: #888; font-weight: bold; text-align: center; margin: 10px; height: 24px; }
        .filled { color: #2c3e50; font-size: 16px; background: #eee; padding: 2px 8px; border-radius: 4px; }

        /* Floating Words */
        .word {
            position: absolute; padding: 12px 20px; border-radius: 50px;
            cursor: grab; user-select: none; font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); z-index: 500;
            white-space: nowrap; transition: transform 0.1s linear;
        }
        .neg-word { background: #2c3e50; color: white; }
        .pos-word { background: white; color: #186a3b; border: 2px solid #2ecc71; }

        /* Sidebar */
        #review {
            position: absolute; right: 20px; bottom: 20px; width: 220px;
            max-height: 200px; background: rgba(0,0,0,0.8);
            color: white; padding: 15px; border-radius: 12px; overflow-y: auto; z-index: 1100;
        }
    </style>
</head>
<body>

<div id="setup">
    <textarea id="list1" placeholder="Challenges (Enter or comma)"></textarea>
    <button onclick="init()">START ARENA</button>
    <textarea id="list2" placeholder="Strengths (Enter or comma)"></textarea>
</div>

<div id="stage">
    <div id="left-half" class="half"></div>
    <div id="arena-circle">
        <div id="s-neg" class="slot">DROP CHALLENGE</div>
        <div style="font-size: 24px; font-weight: 900; color: #3498db;">ARENA</div>
        <div id="s-pos" class="slot">DROP STRENGTH</div>
    </div>
    <div id="right-half" class="half"></div>
    <div id="review"><strong>Matches:</strong><div id="log"></div></div>
</div>

<script>
    let items = [];
    let dragObj = null;
    let activeNeg = null;
    let activePos = null;
    let totalMatches = 0;
    let matchCount = 0;

    function init() {
        const parse = (id) => document.getElementById(id).value.split(/[,\n]/).map(s => s.trim()).filter(s => s);
        const l1 = parse('list1'); const l2 = parse('list2');
        
        document.getElementById('left-half').innerHTML = '';
        document.getElementById('right-half').innerHTML = '';
        document.getElementById('log').innerHTML = '';
        items = []; matchCount = 0; activeNeg = null; activePos = null;
        totalMatches = Math.max(l1.length, l2.length);
        updateProgress();

        l1.forEach(t => createWord(t, 'neg'));
        l2.forEach(t => createWord(t, 'pos'));
        requestAnimationFrame(loop);
    }

    function createWord(text, type) {
        const el = document.createElement('div');
        el.className = `word ${type}-word`;
        el.innerText = text;
        document.getElementById('stage').appendChild(el);

        const data = {
            el, type,
            x: type === 'neg' ? Math.random() * (window.innerWidth/2 - 150) : (window.innerWidth/2) + Math.random() * (window.innerWidth/2 - 150),
            y: Math.random() * (window.innerHeight - 300) + 50,
            vx: (Math.random() - 0.5) * 2,
            vy: (Math.random() - 0.5) * 2,
            dragging: false
        };

        el.onmousedown = (e) => {
            dragObj = data;
            data.dragging = true;
        };

        items.push(data);
    }

    window.onmousemove = (e) => {
        if (!dragObj) return;
        const stage = document.getElementById('stage').getBoundingClientRect();
        dragObj.x = e.clientX - 60;
        dragObj.y = e.clientY - stage.top - 20;

        // Visual Feedback
        const arena = document.getElementById('arena-circle').getBoundingClientRect();
        const dist = Math.hypot(e.clientX - (arena.left + arena.width/2), e.clientY - (arena.top + arena.height/2));
        const arenaEl = document.getElementById('arena-circle');
        
        arenaEl.classList.toggle('glow-neg', dist < 150 && dragObj.type === 'neg');
        arenaEl.classList.toggle('glow-pos', dist < 150 && dragObj.type === 'pos');
    };

    window.onmouseup = (e) => {
        if (!dragObj) return;
        const arena = document.getElementById('arena-circle').getBoundingClientRect();
        const dist = Math.hypot(e.clientX - (arena.left + arena.width/2), e.clientY - (arena.top + arena.height/2));

        if (dist < 150) {
            if (dragObj.type === 'neg') {
                if (activeNeg) activeNeg.el.style.display = 'block';
                activeNeg = dragObj;
                document.getElementById('s-neg').innerHTML = `<span class="filled">${dragObj.el.innerText}</span>`;
            } else {
                if (activePos) activePos.el.style.display = 'block';
                activePos = dragObj;
                document.getElementById('s-pos').innerHTML = `<span class="filled">${dragObj.el.innerText}</span>`;
            }
            dragObj.el.style.display = 'none';
        }

        document.getElementById('arena-circle').classList.remove('glow-neg', 'glow-pos');
        dragObj.dragging = false;
        dragObj = null;

        if (activeNeg && activePos) finalize();
    };

    function finalize() {
        const entry = document.createElement('div');
        entry.style.fontSize = '12px'; entry.style.borderBottom = '1px solid #444'; entry.style.padding = '5px 0';
        entry.innerHTML = `🛡️ ${activeNeg.el.innerText}<br>✨ ${activePos.el.innerText}`;
        document.getElementById('log').prepend(entry);

        items = items.filter(i => i !== activeNeg && i !== activePos);
        activeNeg = null; activePos = null;
        document.getElementById('s-neg').innerText = 'DROP CHALLENGE';
        document.getElementById('s-pos').innerText = 'DROP STRENGTH';
        
        matchCount++;
        updateProgress();
    }

    function updateProgress() {
        const p = (matchCount / totalMatches) * 100;
        document.documentElement.style.setProperty('--progress', p + '%');
    }

    function loop() {
        const stage = document.getElementById('stage').getBoundingClientRect();
        items.forEach(i => {
            if (!i.dragging) {
                i.x += i.vx; i.y += i.vy;
                if (i.x < 0 || i.x > window.innerWidth - 120) i.vx *= -1;
                if (i.y < 0 || i.y > stage.height - 50) i.vy *= -1;
            }
            i.el.style.transform = `translate(${i.x}px, ${i.y}px)`;
        });
        requestAnimationFrame(loop);
    }
</script>
</body>
</html>
